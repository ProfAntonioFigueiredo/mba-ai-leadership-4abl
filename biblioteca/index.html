0b1a54c56037f91afff58da730d3af4b2e243a3b72927b2 Conversão do DOCX com títulos, listas, tabelas e imagens incorporadas. A paginação original não é preservada. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. 1. Visão Geral da Solução A solução consiste em uma plataforma SaaS composta por duas frentes de interface unificadas por uma API central: Portal/App do Aluno: Focado em autoatendimento mobile-first , permitindo autenticação simples por matrícula, agendamento/cancelamento de aulas em até 3 cliques, controle de créditos, notificações e acompanhamento de progresso CEFR. Painel Administrativo (ADM / Escola / RH): Focado em gestão operacional, montagem e conciliação de grade sem choques, importação/sincronização de alunos via carga em lote em Excel, controle de presença, dashboard B2B e fechamento de medição para faturamento. 2. Fluxos do Usuário (User Flows) Fluxo 1: Aluno (Autoatendimento Mobile) Login: Aluno acessa a tela de login → Informa id_aluno (Matrícula) e a Senha Fixa Escola@@@ → Clique em \"Entrar\". Dashboard Aluno: Visualiza próximas aulas, saldo de créditos e gráfico de evolução CEFR. Agendamento / Reagendamento: Clica em \"Agendar / Reagendar Aula\". Seleciona horário e professor disponível. Confirma a alteração em até 3 cliques → Recebe confirmação visual e notificação push/e-mail com sincronização de calendário. Fluxo 2: Administrativo (Importação de Base de Alunos via Excel) Login ADM: Coordenador/Gestor acessa o portal → Informa e-mail institucional e senha individual (ou via SSO) → Acessa o Painel ADM. Módulo Base de Alunos: Seleciona a opção \"Gestão de Alunos\" → Clica em \"Importar Alunos (Excel)\". Upload &amp; Validação: Arrasta e solta ( drag-and-drop ) ou seleciona arquivo .xlsx ou .csv. Sistema executa parser e validação de schema das 19 colunas obrigatórias. Exibe pré-visualização com total de novos cadastros, atualizações e erros por linha. Clica em \"Confirmar Importação\" → Sistema grava registros e gera log auditável de carga. 3. Especificação Funcional Detalhada &amp; Regras de Negócio Regras de Autenticação Aluno: Identificador único é o id_aluno. Senha inicial universal é Escola@@@. A autenticação valida a existência do id_aluno ativo na base de dados. Administrador / RH: Autenticação por e-mail institucional com senha criptografada via hash forte (BCrypt) ou integração via protocolo SAML2/OAuth2 (Azure AD/Okta). Regras do Módulo de Carga em Lote (Excel) Obrigatoriedade de Esquema: O arquivo DEVE possuir o cabeçalho idêntico às 19 colunas oficiais: id_aluno | nome | email | data_nascimento | idade | genero | unidade | cidade | estado | canal_aquisicao | nivel_curso | modalidade | turno | plano | desconto_percentual | data_matricula | status_matricula | data_cancelamento | Valor Mensalidade Chave Primária e Unicidade: O campo id_aluno deve ser único. Se já existir na base, a importação atuará no modo Upsert (atualização dos dados cadastrais). Tratamento de Erros: Se faltar qualquer uma das 19 colunas obrigatórias, a importação é abortada com erro de estrutura. Campos de data (data_nascimento, data_matricula, data_cancelamento) devem seguir o padrão ISO YYYY-MM-DD. Valor Mensalidade e desconto_percentual devem ser estritamente numéricos. Linhas inconsistentes devem ser destacadas em um relatório de log para correção do usuário. 4. Especificação de Interface (UI) Tela de Login Aluno: Campo 1: Matrícula / ID do Aluno (id_aluno). Campo 2: Senha (padrão preenchida ou mascarada Escola@@@). Botão principal: \"Acessar Portal\". Painel ADM - Área de Upload Excel: Container Drag-and-Drop com ícone de planilha e instrução: \"Arraste aqui o arquivo Excel (.xlsx / .csv) da base de alunos ou clique para buscar\" . Tabela de Pré-visualização ( Preview ): exibe as 19 colunas mapeadas com status de validação (Linha Válida [Verde] / Erro [Vermelho]). Botão de Ação: \"Processar Importação em Lote\". 5. Integrações e Engenharia de Dados Mapeamento Relacional / Banco de Dados (TB_ALUNO) CREATE TABLE tb_aluno ( id_aluno VARCHAR(50) PRIMARY KEY, nome VARCHAR(150) NOT NULL, email VARCHAR(100) NOT NULL, data_nascimento DATE, idade INT, genero VARCHAR(20), unidade VARCHAR(100), cidade VARCHAR(100), estado VARCHAR(2), canal_aquisicao VARCHAR(50), nivel_curso VARCHAR(50), modalidade VARCHAR(20), turno VARCHAR(20), plano VARCHAR(50), desconto_percentual DECIMAL(5,2), data_matricula DATE NOT NULL, status_matricula VARCHAR(20) NOT NULL, data_cancelamento DATE, valor_mensalidade DECIMAL(10,2) NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP ); 6. Critérios de Aceite (Given / When / Then) Cenário 1: Autenticação de Aluno com Sucesso Given que o aluno possui matrícula ativa de id_aluno \"10045\" When ele inserir o id_aluno \"10045\" e a senha \"Escola@@@\" na tela de login Then o sistema deve autenticar o usuário e redirecioná-lo para a Dashboard do Aluno em menos de 2 segundos. Cenário 2: Importação em Lote via Excel com Sucesso Given que o usuário ADM está logado e no módulo de Gestão de Alunos When fizer upload de um arquivo .xlsx válido contendo as 19 colunas corretas Then o sistema exibe a pré-visualização, processa os registros em lote, grava no banco de dados e apresenta a mensagem \"Importação concluída com sucesso: X alunos inseridos/atualizados\" . Cenário 3: Tentativa de Upload com Colunas Inválidas Given que o usuário ADM tenta fazer upload de uma planilha com apenas 15 colunas When o sistema processar a validação da planilha Then a operação deve ser interrompida, apresentando a mensagem de erro \"Arquivo inválido. A planilha deve conter rigorosamente as 19 colunas da estrutura oficial\" . 7. Fora de Escopo Técnico Desenvolvimento de aplicativo nativo iOS/Android (será utilizado PWA responsivo mobile-first ). Leitura e processamento de arquivos em formatos PDF, DOCX ou planilhas sem estrutura padrão. 8. Considerações de Segurança e Privacidade (LGPD) Criptografia TLS 1.3 em trânsito e AES-256 para dados sensíveis em repouso. Mascaramento de dados sensíveis dos alunos nas telas de pré-visualização do RH B2B (exibindo apenas consolidados quando aplicável). Logs de auditoria para todas as operações de upload, alteração de cadastro e exclusão/inativação de alunos mantidos por 12 meses. ", "formato": ".docx"}, {"titulo": "PSS.md.docx", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/pss-md-docx-aec6becf/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/pss-md-docx-aec6becf/conteudo.html", "texto": " PSS.md.docx Índice da biblioteca Fonte: Vibe Coding Executivo/speakup-sdd/specs/sources/PSS.md.docx.txt SHA-256: aec6becfe2b02213ce1d258a0b8756fb5f32d06d98f3ca9c2fff519323c4ed17 Transcrição textual integral; não é resumo. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. PSS: Plataforma Integrada SpeakUp Idiomas 1. Visão Geral da Solução A solução consiste em uma plataforma SaaS composta por duas frentes de interface unificadas por uma API central: Portal/App do Aluno: Focado em autoatendimento mobile-first, permitindo autenticação simples por matrícula, agendamento/cancelamento de aulas em até 3 cliques, controle de créditos, notificações e acompanhamento de progresso CEFR. Painel Administrativo (ADM / Escola / RH): Focado em gestão operacional, montagem e conciliação de grade sem choques, importação/sincronização de alunos via carga em lote em Excel, controle de presença, dashboard B2B e fechamento de medição para faturamento. 2. Fluxos do Usuário (User Flows) Fluxo 1: Aluno (Autoatendimento Mobile) Login: Aluno acessa a tela de login → Informa id_aluno (Matrícula) e a Senha Fixa Escola@@@ → Clique em \"Entrar\". Dashboard Aluno: Visualiza próximas aulas, saldo de créditos e gráfico de evolução CEFR. Agendamento / Reagendamento: Clica em \"Agendar / Reagendar Aula\". Seleciona horário egistros em lote, grava no banco de dados e apresenta a mensagem \"Importação concluída com sucesso: X alunos inseridos/atualizados\". Cenário 3: Tentativa de Upload com Colunas Inválidas Given que o usuário ADM tenta fazer upload de uma planilha com apenas 15 colunas When o sistema processar a validação da planilha Then a operação deve ser interrompida, apresentando a mensagem de erro \"Arquivo inválido. A planilha deve conter rigorosamente as 19 colunas da estrutura oficial\". 7. Fora de Escopo Técnico Desenvolvimento de aplicativo nativo iOS/Android (será utilizado PWA responsivo mobile-first). Leitura e processamento de arquivos em formatos PDF, DOCX ou planilhas sem estrutura padrão. 8. Considerações de Segurança e Privacidade (LGPD) Criptografia TLS 1.3 em trânsito e AES-256 para dados sensíveis em repouso. Mascaramento de dados sensíveis dos alunos nas telas de pré-visualização do RH B2B (exibindo apenas consolidados quando aplicável). Logs de auditoria para todas as operações de upload, alteração de cadastro e exclusão/inativação de alunos mantidos por 12 meses. ", "formato": ".txt"}, {"titulo": "Resultado da comparação", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/reports/relatorio-comparativo.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/reports/relatorio-comparativo.html", "texto": " Sumário do documento F-01 — Contagem corporativa além do escopo autorizado F-02 — Prévia obsoleta depois de erro de importação F-03 — Modal sem gestão de foco F-04 — Configuração parcial abre demonstração F-05 — Regras cliente e servidor divergentes Resultado da comparação A implementação original é uma base funcional de piloto com controles relevantes de engenharia: validações, transações, constraints de agenda, autorização no banco e testes. A evolução SDD preserva esses pontos, organiza o trabalho em especificações rastreáveis e corrige problemas reproduzidos nos mesmos cenários. Entregue: uma cópia executável do software em speakup-sdd , especificações, critérios de aceite, decisões arquiteturais, migração incremental, testes e este relatório lado a lado. O original speakup-lovable foi preservado; os hashes dos 25 arquivos inventariados continuam iguais, excluindo dependências, build e Git. Validação final: original 25/25 testes herdados; SDD 40/40 testes Node (incluem testes agrupadores) e 4/4 testes de navegador. Ambos os builds passam. Os 40 testes não são uma medida de cobertura nem diretamente equivalentes aos 25 herdados; a comparação controlada é feita pelos cenários adicionais aplicados a ambos. A nova versão é uma evolução do mesmo piloto, não uma implementação completa de todo o PRD. Não foi promovida a produção e nenhum Supabase remoto foi alterado. Método e fontes Foram lidos os três documentos originais e o código local. As extrações textuais estão em specs/sources/ ; elas não substituem a leitura visual dos Word, especialmente em formulários com escolhas. O material fornecido contém um interpretador cuja saída prevista é um prompt de configuração de kernel, e não a aplicação completa. Não foi presumido que seu texto comprove escolhas preenchidas em outro configurador. A skill exata “Spec-Driven Development with Coding Agents” não foi localizada. Após autorização para prosseguir, foi aplicado o fluxo explícito fontes → requisitos → critérios de aceite → decisões → tarefas → implementação → validação . Não se atribui esta entrega à execução daquela skill indisponível. A baseline foi copiada para diretório temporário, com os arquivos originais preservados. Para executar as duas versões sob dependências equivalentes, a baseline usou a mesma árvore instalada da versão SDD. A resolução npm não reproduz exatamente o pnpm-lock original: por exemplo, PGlite 0.5.10 em vez de 0.5.9 e React 19.3.1 em vez de 19.3.0. As versões constam em dependencies.json . Essa normalização permite comparar o código no ambiente desta execução, mas não prova o resultado do lock antigo em outros ambientes. O exercício não mede produtividade, custo de desenvolvimento ou superioridade universal de um método. Os cenários novos foram escolhidos durante a revisão e são direcionados a riscos identificados. Não foram atribuídas notas subjetivas de maturidade nem percentuais fictícios de conformidade. O mesmo software lado a lado Original • mesmo aluno fictício e fluxo SDD • interface preservada, organização e regras evoluídas Capturas produzidas pelos testes em Chromium, viewport 1280×900, em 19/10/2026. Imagem de página inteira. A aparência semelhante é intencional: as alterações estão sobretudo na estrutura, consistência e validação. Dimensão Original Vibe Coding Evolução SDD Evidência Produto e requisitos PRD/PSS detalhados e diagnóstico de lacunas já presentes. Especificação explícita do piloto, aceite, ADRs, tarefas e vínculos com testes. specs/requirements.md; specs/acceptance.md Arquitetura e manutenção App, fluxos, importação e interface concentrados em main.jsx; domínio e backend já separados. Entrada mínima; App.jsx; domínio por capacidade; infraestrutura; caso de uso demo; telas de login/importação; modal reutilizável. App ainda concentra agenda, presença e relatórios. src/main.jsx; src/App.jsx; src/domain/; src/features/ Dados e importação 19 colunas, matrícula textual, datas/decimais e rollback transacional no SQL. Prévia cliente não aplica todos os limites do servidor. Preserva integridade do SQL; bloqueia 5.001 linhas e idade fora do inteiro; apaga prévia antes de analisar novo arquivo. tests/regression.test.mjs; tests/browser/import.spec.js Agenda Constraints de sobreposição e locks no SQL já presentes. Demo compara strings e aceita casos inválidos. Compara instantes com fuso, valida datas e capacidade; rejeita remarcação para mesma aula. src/domain/scheduling.mjs; AC-02/03/10 Autenticação e configuração Supabase Auth e perfil provisionado; URL/chave parcial resulta em null e abre demo. Configuração parcial gera erro; inicialização explícita; cliente Supabase sob demanda. Senha compartilhada permanece pendente. src/infrastructure/configuration.mjs; AC-01 Autorização e privacidade RLS, grants e RPCs por perfil; RH tem vínculo empresa separado de unidade. Contagem occupied inclui outras empresas na aula. Preserva controles; migração incremental restringe occupied à empresa do RH. Booking IDs e metadados continuam presentes; não é anonimização formal. supabase/migrations/202610190001_rh_occupancy.sql; AC-07 UX e acessibilidade Interface responsiva; reserva demo e largura mobile passam. Modal não move foco ao abrir. Mesma identidade visual; dialog nativo com foco, Tab, Escape e restauração testados. Sem certificação de acessibilidade integral. src/ui/Modal.jsx; tests/browser/booking.spec.js Testes e qualidade 25 testes herdados passam; sem testes de navegador no pacote original. 40 testes Node, 4 cenários de navegador, regressões aplicáveis à baseline, logs e comparação reproduzível. Não há percentual de cobertura medido. reports/validation.json; scripts/compare.py Desempenho e escala Uma resposta workspace_data carrega a coleção autorizada; paginação no cliente. Mesma limitação de escala. XLSX e SDK Supabase em chunks sob demanda; entry demo menor. Sem teste de carga ou comprovação de 2 segundos. reports/build-original.log; reports/build-sdd.log DevSecOps e dependências pnpm-lock.yaml; scripts test/build. package-lock.json, checagem de formato e workflow CI proposto. npm audit consultado sem vulnerabilidades conhecidas retornadas. reports/dependencies.json; reports/dependency-audit.json; .github/workflows/validate.yml Operação e observabilidade Logs de ações no banco e ressalvas no README. Runbook, plano de rollback e pendências explícitas. Não há métricas, alertas, traces ou rotina de recuperação implantados. docs/operations.md Escopo e governança Créditos, notificações, faturamento e integrações reconhecidos como futuros. Mesmas pendências preservadas; decisões não resolvidas são identificadas, sem inventar regras contratuais. specs/decisions.md; README.md Resultados executados sob os mesmos cenários Verificação Original SDD Interpretação Suíte própria original / suíte própria evoluída 25 passam 40 passam Contagens incluem agrupadores Node; suítes de tamanho diferente Nove cenários dirigidos de domínio 1 passa; 8 falham 9 passam Mesmas entradas aplicadas a ambos; sem rede RH em aula de duas empresas occupied = 2 para RH A occupied = 1 para RH A Novo teste SQL; correção de contagem fora do escopo corporativo Reserva pelo aluno demo Passa Passa Preservação do fluxo funcional Dashboard a 390×844 Passa Passa Não há overflow horizontal no cenário testado Foco inicial do modal Falha Passa No original o foco permanece fora; verificação interrompe nesse primeiro erro Novo upload inválido após prévia válida Prévia antiga permanece Prévia antiga removida Impede confirmar acidentalmente o lote anterior Build local Passa Passa Não comprova deployment ou backend real Formatação Sem gate equivalente no pacote Passa Prettier; não equivale a lint semântico ou análise de tipos Os oito testes de domínio que falham no original cobrem: intervalo invertido em UTC, data inválida, capacidade fora de faixa, intervalos adjacentes com offsets distintos, remarcação para mesma aula, lote de 5.001 alunos, idade fora de inteiro PostgreSQL e reserva com data inválida. Eles agrupam falhas relacionadas; não são oito vulnerabilidades independentes. As falhas de agenda e parte dos limites de importação dizem respeito ao domínio cliente/demo: o PostgreSQL original já impõe diversas dessas regras. A interface normal converte horários para ISO UTC, o que reduz a exposição cotidiana ao caso de offsets distintos. Os testes verificam consistência do domínio sob entradas adversas; não alegam que todos esses casos são alcançáveis pela tela atual. Achados corrigidos e sua importância F-01 — Contagem corporativa além do escopo autorizado Prioridade: alta para isolamento de informações B2B. ../speakup-lovable/supabase/migrations/202610140001_speakup.sql:77 limita quais aulas o RH pode ver, mas a subconsulta de ocupação conta todas as reservas da aula. Em uma aula compartilhada, RH A consegue inferir ocupação além de sua própria empresa. A migração 202610190001_rh_occupancy.sql:14 acrescenta o vínculo corporativo à contagem quando o perfil é RH. O teste AC-07 cria empresas A/B e dois alunos na mesma aula: o original retorna 2, a versão corrigida retorna 1 para RH A. A capacidade física da aula continua visível; confirmar com o responsável se esse metadado faz parte do contrato. Não foi demonstrado vazamento de nome ou e-mail de outra empresa nesse cenário. F-02 — Prévia obsoleta depois de erro de importação Prioridade: média para integridade operacional. Em ../speakup-lovable/src/main.jsx:17 , o novo upload só substitui a prévia se a validação tiver sucesso. Se um lote válido for seguido por arquivo inválido, o erro aparece, mas a prévia antiga e sua confirmação permanecem. A versão SDD limpa a prévia antes de analisar o novo arquivo ( src/App.jsx , função upload). AC-05 reproduz a sequência em navegador real. O backend original ainda valida o lote recebido; o problema aqui é o usuário confirmar uma prévia que já não corresponde à última seleção. F-03 — Modal sem gestão de foco Prioridade: média para acessibilidade. O modal original declara role/aria-modal, mas não move foco, contém navegação ou implementa Escape. O teste comparável falha já na entrada de foco, sem atribuir automaticamente resultado às etapas seguintes. src/ui/Modal.jsx usa dialog nativo, showModal, tratamento de cancelamento e restauração do foco anterior. A versão SDD passa na sequência foco inicial → Tab → Escape → retorno ao acionador. Isso não certifica todas as necessidades de teclado, leitores de tela, contraste ou WCAG. F-04 — Configuração parcial abre demonstração Prioridade: média para confiabilidade de ambiente. . epende de RF-08 RF-03 Créditos Pendente Pendente Política de cancelamento e expiração não definida RF-04 Notificações Pendente Pendente Sem envio real ou calendário RF-08 Medição e fatura Pendente Pendente Sem regras contratuais suficientes RF-09 Substituição Pendente Pendente Sem recomendação implementada RF-07 Histórico CEFR Pendente Pendente Nível cadastrado não representa histórico RF-10 SSO/ERP Pendente Pendente Sem provedores integrados RF-12 Auditoria Parcial Preservada; operação documentada Trigger bloqueia alterações comuns; proprietário não perde poderes A dependência RF-06 P0 → RF-08 P1 precisa de revisão do produto: a aprovação financeira é P0 no portal, mas seu módulo habilitador está em prioridade inferior. A versão SDD registra a inconsistência em vez de criar aprovação fictícia. Arquitetura da evolução PRD/PSS/interpretador → specs/requirements + acceptance + decisions + tasks ↓ src/main.jsx → inicialização do backend → src/App.jsx ├─ features/auth/LoginView ├─ features/import/ImportView ├─ ui/Modal ├─ application/executeDemoCommand → estado demo → localStorage └─ infrastructure/Supabase → RPCs → PostgreSQL ├─ grants/RLS ├─ validação/autorização └─ constraints/auditoria A separação melhora os pontos de mudança, mas a refatoração é incremental: App.jsx ainda concentra estado e telas de agenda, chamada e relatórios. A nova estrutura não é apresentada como arquitetura hexagonal completa nem exige microserviços sem necessidade. SQL continua como autoridade de autorização e integridade no modo conectado; o demo é apenas demonstração local. Segurança, dados e operação ainda pendentes Senha universal: PRD/PSS alternam senha fixa e inicial. Mantida por fidelidade ao material; resolver com o dono do produto antes de uso real. Não foi criada mudança silenciosa da política. Controle de tentativas: a Edge Function não implementa limitação distribuída no código inspecionado. O README exige configuração no destino; não se presumiu que a proteção está ativa. CORS não substitui autenticação. Sessão e integração: a recuperação inicial de perfil existe; não há evidência de teste de expiração/revogação entre abas nem de integração Auth/Edge real. Minimização: RH não recebe cadastro completo, mas IDs de reservas e metadados continuam; chamar isso de anonimização irreversível seria incorreto. Há somente minimização parcial. Escala: workspace_data retorna coleções completas. Busca/paginação administrativa no cliente não demonstra RNF-06. Projetar paginação, filtros por período e consultas medidas antes de prometer 5.000 usuários. Concorrência: locks e constraints já existem. Testes PGlite em uma conexão não reproduzem corridas, deadlocks ou carga de múltiplas sessões; executar teste PostgreSQL/Supabase com conexões independentes. Auditoria e recuperação: não há prova de retenção imutável externa por 12 meses, backup restaurado ou RPO/RTO atendido. O trigger não protege contra o administrador do banco. Observabilidade: logs de negócio não substituem métricas, traces e alertas. O runbook propõe o que medir; nada disso foi declarado implantado. Privacidade e conformidade: nenhum exame jurídico/operacional de LGPD foi executado; TLS/AES não foram medidos. Nenhuma das versões recebe declaração de conformidade integral. Acessibilidade e UX: falta validação com leitores de tela, mais perfis e fluxos, contraste e tarefas completas de três cliques. O teste mobile cobre apenas o dashboard de aluno. Importação: não houve ensaio de planilhas comprimidas hostis nem novo teste ponta a ponta de XLSX. Os limites de arquivo e validações não equivalem a auditoria de todos os parsers. Qualidade de código: há formatação automática, testes e CI definido; não foram introduzidos TypeScript, lint semântico ou meta de cobertura. O workflow não foi executado no GitHub; não existe repositório Git nesta pasta de trabalho. Desempenho observado e dependências No build comparável sem variáveis Supabase , o entry JavaScript passou de 285,44 kB (88,26 kB gzip) para r concorrência/carga/restore; revisar privacidade e acessibilidade; só então avaliar promoção operacional. Não são estimados prazos sem dimensionamento. Artefatos e trilha de evidências Especificação , aceite , decisões , tarefas e matriz rastreável . Resultados e comandos , testes originais , testes SDD , regressões no original e regressão SQL . Navegador original , navegador SDD , build original , build SDD , dependências e npm audit . Hashes do original , instruções para agentes e operação . Referências técnicas primárias O uso de funções SECURITY DEFINER exige revisão de privilégios e search_path; os controles foram inspecionados e testados no contexto local descrito. Referências: RLS no Supabase e funções de banco no Supabase . A existência de locks não comprova ausência de deadlocks ou corridas sob carga: documentação PostgreSQL sobre locking . Os critérios de foco, teclado e Escape do modal foram orientados pelo padrão de diálogo modal da W3C . A aprovação dos testes locais não equivale a certificação de acessibilidade. ", "formato": ".md"}, {"titulo": "Roadmap — evolução gradual até produção", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/roadmap.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/roadmap.html", "texto": " Sumário do documento Processo de cada fase Fase 0 — Constituição e enquadramento do projeto Fase 1 — Consolidar a baseline e o primeiro incremento Fase 2 — Credenciais e primeiro acesso Fase 3 — Integração real em desenvolvimento Fase 4 — Reservas sob concorrência Fase 5 — Consultas e paginação no servidor Fase 6 — Presença e indicadores entre usuários Fase 7 — Créditos e cancelamento contratual Fase 8 — Medição mensal Fase 9 — Aprovação de medição pelo RH Fase 10 — Notificações e calendário Fase 11 — Preparar e executar piloto controlado Fase 12 — Expansão e evolução contínua Próxima ação após a revisão Roadmap — evolução gradual até produção Data: 19/10/2026. Direção confirmada por Antonio. Estado: proposta para revisão humana; as fases futuras não estão autorizadas para implementação apenas por constarem neste documento. Processo de cada fase Antes de especificar uma fase, inspecionar o estado real e esclarecer em conjunto apenas as decisões ainda ausentes. Produzir requirements.md , plan.md com grupos numerados e validation.md em specs/YYYY-MM-DD-feature-name/ . Pausar para revisão humana dos arquivos antes de implementar. Implementar em grupos revisáveis, executar a validação aplicável e registrar aprovados, falhas, não executados e riscos residuais. Pausar após a implementação para revisão. Commit, push e promoção de ambiente são decisões humanas. Novas dependências ou automações precisam estar previstas na spec da fase que as introduzir. Não há cronograma ou orçamento aprovado. A ordem abaixo explicita dependências; datas e responsáveis serão definidos com o escopo de cada fase. Nenhuma fase está marcada concluída por conter apenas documentação. Fase 0 — Constituição e enquadramento do projeto Estado: três arquivos propostos; revisão humana pendente. Entrega: mission.md, tech-stack.md e este roadmap. Preservar a distinção entre a evolução anterior com SDD genérico e a aplicação atual da skill específica. Saída: responsável revisa propósito, stack, limites e ordem; alterações solicitadas são incorporadas. Depois disso, especificar a fase 1. Fase 1 — Consolidar a baseline e o primeiro incremento Estado: implementação anterior disponível; formalização conforme a skill ainda pendente. Escopo: especificar o fechamento das correções existentes, reconciliar os documentos anteriores e a matriz de aceite, atualizar a comparação com a aplicação real da skill e definir o limite do primeiro piloto real. Registrar quais testes são históricos e quais precisam ser repetidos conforme o código efetivamente mudar. Saída: requisitos e validação datados, rastreabilidade coerente, original preservado e revisão das evidências. Não atribuir à skill checkpoints que não aconteceram antes do código existente. Fase 2 — Credenciais e primeiro acesso Dependência: fase 1 e decisão do responsável sobre senha fixa versus inicial. Escopo: política de credenciais, provisionamento, recuperação, sessão, revogação e limitação de tentativas. Preservar matrícula como login sem usar exposição de e-mail como atalho. Saída: política aceita e cenários negativos definidos e verificados; nenhuma dependência de senha universal sem resolução explícita para usuários reais. Não confundir manter a senha no demo com aprová-la para produção. Fase 3 — Integração real em desenvolvimento Dependência: fase 2 e acesso a ambiente de desenvolvimento autorizado. Escopo: Auth/Edge, migrações, quatro perfis, duas empresas e professores distintos. Verificar chamadas diretas de API, matrícula inativa, expiração/revogação e privacidade de aulas compartilhadas. Saída: evidências ponta a ponta do ambiente real e ensaio das migrações com reversão definida. PGlite permanece como teste local complementar. Fase 4 — Reservas sob concorrência Dependência: fase 3. Escopo: duas sessões disputando última vaga, reservas simultâneas do mesmo aluno, remarcações concorrentes e cancelamentos. Investigar ordem de locks e tratamento de falhas a partir de reprodução, sem presumir defeitos ou ausência deles. Saída: invariantes de lotação, conflito e atomicidade demonstradas em conexões independentes; falhas e comportamento de recuperação documentados. Fase 5 — Consultas e paginação no servidor Dependência: fase 3; preservar invariantes da fase 4. Escopo: recortes temporais, filtros e paginação autorizados, índices baseados em consultas medidas e compatibilidade da interface. Definir previamente o significado de carga e das metas RNF-02/RNF-06. Saída: ausência de coleções desnecessariamente completas nos fluxos escolhidos e medições reproduzíveis com distribuição representativa. Não declarar 5.000 usuários validados por testar somente um lote de importação de 5.000 linhas. Fase 6 — Presença e indicadores entre usuários Dependência: fase 5. Escopo: sincronização de chamada e indicadores entre professor, coordenação e RH, estratégia de atualização, erros e recuperação. Validar opções de realtime/polling na spec antes de escolher uma. Saída: atualizações observadas entre sessões sem vazamento corporativo; sem confundir recarregar após a própria mutação com atualização multiusuário. Fase 7 — Créditos e cancelamento contratual Dependência: fases 3–4 e política de negócio confirmada. Escopo: RF-03, janela de cancelamento por modalidade, saldo, expiração, reposição e exceções; registrar efeitos transacionais nas reservas. Saída: cenários de contrato, bordas de horário/fuso e ausência de consumo/devolução duplicados verificados. Valores e prazos não serão inventados pelo agente. Fase 8 — Medição mensal Dependência: fase 7 e decisões de preço, competência e aulas faturáveis. Escopo: RF-08, geração de medição, reprocessamento, conciliação e evidência de origem dos valores. Definir contratos de exportação sem assumir uma integração financeira já existente. Saída: resultados conciliados em cenários de referência, sem duplicação financeira ou uso de aritmética monetária aproximada. Fase 9 — Aprovação de medição pelo RH Dependência: fase 8. Escopo: completar a parte financeira de RF-06, com autorização por empresa, estados, revisão e auditoria. Resolver a dependência do RF-06 P0 em relação ao RF-08 P1 antes de prometer o portal completo. Saída: somente o RH autorizado aprova a versão correta da medição e o histórico permite conferir alterações. Fase 10 — Notificações e calendário Dependência: regras de agenda/crédito estáveis; fornecedor e orçamento escolhidos antes de integração. Escopo: RF-04 em fatias: primeiro lembretes/alterações; depois calendário. Definir idempotência, tratamento de falhas, conteúdo mínimo e preferências. Saída: entregas reais verificadas em ambiente de teste, sem duplicação ou divulgação indevida de dados. Integrações não testadas não serão apresentadas como concluídas. Fase 11 — Preparar e executar piloto controlado Dependência: integração, concorrência e consultas validadas; escopo de lançamento confirmado na fase 1. Se funções das fases 6–10 forem excluídas do piloto, registrar a redução explicitamente; não declarar todo o PRD atendido. Fatias a especificar e revisar separadamente: Operação: logs sem segredos/PII excessiva, métricas, alertas, suporte e resposta a incidentes. Recuperação e dados: backups/restauração, migração ensaiada, plano de reversão e retenção; definir e medir RPO/RTO. Aceite: acessibilidade com tarefas reais, privacidade, segurança, carga representativa e restrições conhecidas. Promoção: checklist de release, responsáveis e decisão humana sobre ambiente, custo e janela; entrada progressiva dos usuários e acompanhamento. Saída: pacote de evidências por fatia e decisão explícita de go/no-go. Aprovação desta constituição não autoriza implantação nem gasto. Produção controlada não equivale a comprovação imediata do SLA mensal. Fase 12 — Expansão e evolução contínua Dependência: resultados e necessidades observadas no piloto. Tratar RF-09 (substituição), RF-07 (histórico CEFR) e RF-10 (SSO/ERP) como specs próprias, com prioridades confirmadas pelo responsável. A auditoria RF-12 e RNF-07 evolui junto de cada fluxo e exige política operacional; não deve ser adiada integralmente a esta fase. Saída de cada incremento: requisito delimitado, validação, revisão humana e atualização da memória do projeto. Mudanças de contrato, stack, hospedagem, carga ou política de acesso acionam replanning. Próxima ação após a revisão Especificar a fase 1 em diretório datado, usando os arquivos anteriores como evidência de brownfield. A implementação existente fica preservada enquanto a constituição é revisada. O relatório comparativo histórico continuará identificando o método utilizado na execução original até sua atualização especificada na fase 1. ", "formato": ".md"}, {"titulo": "SpeakUp Idiomas", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-lovable/README.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-lovable/README.html", "texto": " Sumário do documento Usar no Lovable Rodar a demonstração Backend Supabase de desenvolvimento Importação Validar Limites que impedem produção SpeakUp Idiomas Base de aplicação React para a plataforma B2B descrita no PRD e no PSS da aula. Destino escolhido: Lovable + Supabase próprio . O pacote contém os prompts, uma demonstração funcional no navegador e uma implementação inicial do backend em SQL/Edge Function. Nenhum projeto foi criado em contas externas: os dois conectores estão desabilitados pelo administrador da sessão. Usar no Lovable Crie um projeto no Lovable e selecione seu projeto Supabase próprio no seletor de banco. A conexão entre contas deve ser feita pelo proprietário autorizado. Não coloque service role ou senhas no chat. Use o bloco SYSTEM PROMPT de 03_SYSTEM_PROMPT_KERNEL_SUPABASE.txt nas instruções/conhecimento do projeto. Cole integralmente 02_PROMPT_DE_IGNICAO_LOVABLE.txt no chat do projeto. Ele é autossuficiente: descreve todos os requisitos e as etapas, sem depender dos documentos Word. Revise o plano e as migrações geradas. A pasta src e a migração deste pacote são uma base revisável para a implementação. Não suponha que existe importação automática de um repositório local para o Lovable; use o fluxo de código/Git suportado no seu projeto. Valide autenticação, isolamento entre empresas e concorrência no Supabase de desenvolvimento antes de carregar dados reais. Referências oficiais consultadas em 14/10/2026: conectar Supabase ao Lovable , sincronização Git , RLS . Rodar a demonstração Requer Node 20.19+ ou 22.12+ e um gerenciador npm/pnpm. npm install npm run dev Abra a URL informada pelo Vite. Sem variáveis de ambiente, os dados são inteiramente fictícios e persistem no localStorage deste navegador. Aluno de teste: matrícula 10045 , senha Escola@@@ . As abas permitem explorar coordenação, professor e RH com a mesma senha somente na demonstração. O RH demo está limitado à empresa fictícia Acme Brasil; a associação por unidade é apenas um recurso dos dados fictícios. Fluxos do piloto: login, agenda, reserva/cancelamento/remarcação, prevenção de conflitos, criação de aulas pela coordenação, base de alunos, importação CSV/XLSX com prévia, chamada e indicadores. Créditos, notificações reais, evolução histórica CEFR, substituição automática, medição e SSO/ERP permanecem em etapas posteriores. A aprovação de medição prevista em RF-06 depende da etapa RF-08 e não está implementada. Backend Supabase de desenvolvimento Revise e aplique supabase/migrations/202610140001_speakup.sql em projeto novo de desenvolvimento . Não aplicar em banco existente sem revisão de compatibilidade. A migração cria tabelas, RPCs, grants e RLS; o exemplo MySQL do PSS foi traduzido para PostgreSQL. Crie contas de equipe no Supabase Auth com senhas individuais. Vincule auth.users.id a profiles.user_id , atribuindo role , name , teacher_id ou company_id no contexto administrativo. Não há autoatribuição de papéis. Para professores, o nome do perfil deve corresponder ao cadastro de teachers usado pelas aulas. Cadastre companies e os vínculos student_companies . Unidade não determina a empresa em produção. O RH recebe indicadores e reservas anonimizadas, sem base de alunos completa. Importe alunos pelo perfil ADM. A importação cadastra/upserta a base, mas não cria contas Auth. Para provisionar cada matrícula, execute node scripts/provision-student.mjs MATRICULA em terminal seguro com SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY definidos no ambiente. O script nunca reseta conta existente. O endereço técnico de login é o hash SHA-256 da matrícula em domínio reservado .invalid , separado do e-mail de contato. Implante a Edge Function student-login , usando supabase/config.toml . Configure ALLOWED_ORIGIN como a origem exata da aplicação (sem barra final). Habilite limites de tentativa/rate limiting no ambiente de destino e valide a proteção do endpoint antes de exposição real. A função autentica com Supabase Auth e revalida matrícula ativa. Copie .env.example para .env.local e preencha somente URL e chave pública/publicável. A service role fica exclusivamente no terminal/backend. O Vite passa a usar Supabase quando as duas variáveis existem; nesse modo não há fallback silencioso para o demo. Reinicie o Vite. As RPCs devolvem dados conforme perfil. Perfis privilegiados precisam ser cadastrados por operador autorizado. Realize testes reais com duas empresas e dois professores, credenciais inválidas, aluno inativo e chamadas de API diretas. O piloto carrega dados no login e após suas próprias mutações. Atualização automática entre usuários, paginação no servidor e painel em tempo real precisam ser concluídos no Lovable; a lista administrativa tem paginação apenas no cliente nesta base. Não usar essa versão como entrega completa de RF-06/RNF-06. Importação Baixe o modelo na tela ou use examples/modelo-alunos.csv . São exigidas as 19 colunas oficiais na ordem exibida no PRD. Use UTF-8, delimitador vírgula ou ponto e vírgula, datas YYYY-MM-DD e valores decimais com ponto. No XLSX, prefira matrícula e datas ISO como texto ; um valor numérico salvo pelo Excel já perdeu possíveis zeros iniciais, que não podem ser reconstruídos. O lote tem prévia das primeiras 20 linhas, mas todas são validadas. Há indicação de linha/coluna; qualquer erro bloqueia a confirmação. O servidor também valida e executa a carga de modo transacional. Limites do piloto: arquivo de 5 MB e lote de até 5.000 linhas. Ordem exata, limites, atomicidade, valores não negativos e percentual 0–100 são decisões técnicas revisáveis, não respostas preenchidas no configurador. Validar npm test npm run build Os testes de domínio cobrem importação, matrícula, datas, campos, conflitos e remarcação com falha. Os testes SQL, quando presentes no pacote, usam PostgreSQL local em memória via PGlite e simulam o contexto de identidade. Eles não substituem os testes de Auth, rede, concorrência multiusuário e implantação no Supabase real. Limites que impedem produção A senha compartilhada Escola@@@ foi mantida conforme o requisito de aula, que alterna os termos fixa e inicial. A política definitiva depende de decisão do responsável. Não foram certificados TLS 1.3, AES-256, conformidade LGPD, SLA, 5.000 usuários, resposta em 2 segundos, backups ou retenção imutável por 12 meses. O trigger de auditoria protege contra operações normais de alteração; o proprietário do banco continua tendo poder administrativo. Nenhuma fatura, e-mail ou calendário conectado é simulado como concluído. A identidade visual verde é uma proposta para revisão, pois o material não traz Design System aprovado. Os documentos originais permanecem preservados. O diagnóstico rastreável está em 01_DIAGNOSTICO_E_CONSOLIDACAO.txt . ", "formato": ".md"}, {"titulo": "SpeakUp Idiomas", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/README_ORIGEM.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/README_ORIGEM.html", "texto": " Sumário do documento Usar no Lovable Rodar a demonstração Backend Supabase de desenvolvimento Importação Validar Limites que impedem produção SpeakUp Idiomas Base de aplicação React para a plataforma B2B descrita no PRD e no PSS da aula. Destino escolhido: Lovable + Supabase próprio . O pacote contém os prompts, uma demonstração funcional no navegador e uma implementação inicial do backend em SQL/Edge Function. Nenhum projeto foi criado em contas externas: os dois conectores estão desabilitados pelo administrador da sessão. Usar no Lovable Crie um projeto ara revisão, pois o material não traz Design System aprovado. Os documentos originais permanecem preservados. O diagnóstico rastreável está em 01_DIAGNOSTICO_E_CONSOLIDACAO.txt . ", "formato": ".md"}, {"titulo": "SpeakUp Idiomas — original e evolução SDD", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/README.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/README.html", "texto": " SpeakUp Idiomas — original e evolução SDD Original Vibe Coding : baseline preservada byte a byte, confirmada contra a fonte atual. Evolução SDD : código, testes, specs e evidências. Documentação responsiva : missão, stack, roadmap e comparação. Relatório lado a lado . documentos-origem/ : PRD, PSS e requisitos do projeto. As versões permanecem em diretórios irmãos para executar a comparação. A importação não reescreve a baseline nem encerra fases SDD. A constituição permanece em revisão; produção e todos os requisitos do PRD não estão concluídos. O helper usa diretório temporário portátil. Os resultados anteriores continuam históricos até a revalidação na nova estrutura. A skill recebida é referência externa no acervo local e não leva seu Git interno para este repositório. ", "formato": ".md"}, {"titulo": "SpeakUp — evolução com Spec-Driven Development", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/README.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/README.html", "texto": " Sumário do documento Começar Verificar Estrutura Backend e limites SpeakUp — evolução com Spec-Driven Development Comparação preparada em 19/10/2026 a partir do piloto ../speakup-lovable . Original preservado. Método: fontes → requisitos → critérios de aceite → decisões → tarefas → código → testes → relatório. A skill específica mencionada não estava disponível; o usuário autorizou prosseguir com este fluxo explícito. Começar npm ci npm run dev Acesse a URL local na porta 5174. Demo: matrícula 10045 , senha Escola@@@ ; dados fictícios no navegador, namespace separado do original. Os quatro perfis demo mantêm a experiência do piloto. Verificar npm test npm run build npm run format:check npx playwright install chromium npm run test:e2e Critérios e limites: specs/requirements.md , aceite , decisões , tarefas . Relatório lado a lado: reports/comparacao.html e reports/relatorio-comparativo.md . Logs e versões efetivamente testadas estão em reports/. Estrutura src/domain: importação, agenda e indicadores; domain.mjs mantém compatibilidade. src/application: mutação demo atômica, independente de persistência e interface. src/infrastructure: configuração e integração Supabase. src/features: telas de login e importação. src/ui: modal com navegação de teclado; App.jsx ainda concentra outras telas e estado. specs: requisitos, decisões, aceite e fontes extraídas. supabase/migrations: migração original preservada e correção incremental de ocupação por empresa. tests: domínio, regressões, configuração, SQL e navegador. .github/workflows/validate.yml: pipeline proposto para repositório cuja raiz seja esta pasta. Backend e limites Leia docs/operations.md . Nenhum banco remoto foi alterado. Configuração Supabase parcial gera erro visível; sem variáveis usa demo. Aplicar as duas migrações somente em ambiente de desenvolvimento revisado. Instruções de provisionamento herdadas: README_ORIGEM.md. Esta entrega melhora o piloto; não implementa créditos, notificações reais, medição/faturamento, histórico CEFR, substituição ou SSO/ERP. Não certifica LGPD, SLA, desempenho sob carga ou produção. A senha compartilhada permanece uma pendência de negócio/segurança. Os testes SQL em PGlite não substituem Supabase Auth/Edge e concorrência em conexões reais. ", "formato": ".md"}, {"titulo": "SpeakUp_Discovery_Lab_Fluxo_Integrado", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/speakup-discovery-lab-fluxo-integrado-c4eb4603/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/speakup-discovery-lab-fluxo-integrado-c4eb4603/conteudo.html", "texto": " Sumário do documento 1. Como usar 2. Personas Fernanda Lima Marcos Andrade Beatriz Souza 3. Fluxo Integrado de Desenvolvimento: do Design Thinking ao Agile 1. Design Thinking / Design Sprint 2. Lean Startup / Lean Inception 3. PBB — Product Backlog Building 4. Agile / Scrum Como as 10 perguntas entram no fluxo 4. Bloco pronto para usar no Gemini Sequência P-01 a P-10 5. Registro detalhado das 10 perguntas e respostas Processo atual e dor central Operação pedagógica Volume, escala e retenção Gestão corporativa e ROI Integrações e governança Experiência do aluno Progresso e usabilidade Falhas e exceções Qualidade e RNFs Prioridade e sucesso 6. Requisitos Funcionais 7. Requisitos Não Funcionais 8. Salvar e levar ao Codex/Gemini SpeakUp_Discovery_Lab_Fluxo_Integrado Índice da biblioteca Fonte: Vibe Coding Executivo/ExercicioAula05102026/SpeakUp_Discovery_Lab_Fluxo_Integrado.html SHA-256: c4eb4603f01467ef7698da8bed745f13914e91843754114851b7ce44bec5591d Conteúdo textual do HTML; código interativo e scripts não são executados. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. 1. Como usar Regra crítica: o exercício permite somente 10 perguntas . Faça uma por vez no GEM/Gemini e cole aqui a resposta completa antes de avançar. Estratégia baseada nos materiais da aula: começar pelo problema, cobrir as três perspectivas, investigar processo atual, volumes, prazos, integrações, restrições e exceções. Só depois transformar evidências em RFs e RNFs. Fluxo: Discovery → evidências → RF/RNF → critérios de aceitação → futura especificação/prototipação. 2. Personas Fernanda Lima Coordenadora Pedagógica Turmas, professores, agenda, eficiência operacional, ocupação e retenção. Marcos Andrade Gerente de T&amp;D Orçamento, política de inglês, relatórios de progresso, compliance e ROI. Beatriz Souza Aluna corporativa Flexibilidade, faltas/reposições, comunicação e acompanhamento do progresso. 3. Fluxo Integrado de Desenvolvimento: do Design Thinking ao Agile Use este roteiro como uma sequência de raciocínio. No exercício Speak Up, as 10 perguntas estão concentradas principalmente na fase de Descoberta/Discovery ; as respostas alimentam as fases seguintes. 1. Design Thinking / Design Sprint Fase de Descoberta: definição, empatia, ideação, protótipo, experimento e hipóteses de melhoria. 2. Lean Startup / Lean Inception Fase de Estratégia: visão do produto, estratégia, mapeamento e ciclo mensurar → aprender. 3. PBB — Product Backlog Building Fase de Refinamento: refinamento, iteração e MVP, preparando o que será construído. 4. Agile / Scrum Fase de Entrega: Sprint Planning, Product Backlog, execução da Sprint, Review e incremento/MVP. Como as 10 perguntas entram no fluxo Etapa Perguntas O que buscamos descobrir Saída para a próxima fase Definição + Empatia P-01, P-02, P-04, P-06 Processo atual, atores, dores e impacto. Problem Statement e necessidades reais. Hipóteses / Experimento P-03, P-07, P-08 Escala, comportamento, exceções e evidências que validam ou invalidam hipóteses. Hipóteses priorizadas e critérios para validar solução. Estratégia / Mapeamento P-05, P-09 Integrações, restrições, segurança, disponibilidade, desempenho e governança. RFs, RNFs e restrições para refinamento. Priorização → MVP P-10 O que gera maior valor e como medir sucesso. Prioridades para backlog/MVP e futura entrega Agile. Importante: não use as fases seguintes para presumir respostas. Primeiro obtenha evidências das personas. Depois converta os achados em requisitos, hipóteses, backlog e critérios de aceitação. 4. Bloco pronto para usar no Gemini Você pode copiar o contexto abaixo antes de iniciar a entrevista. Depois envie uma pergunta por vez , porque o exercício limita a entrevist
