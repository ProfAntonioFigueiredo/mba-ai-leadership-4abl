amento) IA como copiloto e aprendizado Viés de seleção identificado Registro de cobertura Bloco 8 — aproximadamente 19h49–19h54 Fechamento do exercício Transição de conteúdo Cobertura AI Core Concepts — Aula 2 — 19/10/2026 Professora: Tassiana Rugoni de Campos. Fonte: transcrição ao vivo do Microsoft Teams, iniciada pela professora. Horários de Brasília. Status: acompanhamento iniciado; não há captura independente do áudio por este agente. Cobertura anterior às 19h17: não disponível na transcrição observada. Bloco 1 — 19h17–19h22 (parcial, em andamento) Conceitos e explicações observados A abertura retoma o conteúdo da primeira aula por meio de perguntas dos alunos no chat, para recuperar os conceitos após o intervalo entre os encontros. A professora começa a revisão do exercício de correlação da aula anterior; anuncia que o conteúdo seguinte terá maior foco em IA generativa. Correlação identifica variáveis que variam juntas, na mesma direção ou em direções opostas. Ela oferece pistas para investigar o negócio, sem estabelecer causalidade. Correlações podem ser espúrias: eventos que ocorrem juntos sem uma relação relevante para o negócio. A estatística descritiva e a análise exploratória abrem caminho para investigar problemas e construir modelos de machine learning e deep learning. O Caderno de Hipóteses compara as hipóteses iniciais, formuladas sem IA, com a análise posterior apoiada por IA. Aplicação à liderança Relacionar a análise estatística a uma pergunta de negócio e ao valor da decisão. Distinguir intuição inicial, associação observada e explicação causal. Pendências Capturar a continuação da correção do exercício e os exemplos apresentados. Bloco ainda não cobre cinco minutos completos; será atualizado com nova leitura. Organização para a apresentação final A estrutura dos slides será definida após o encerramento, conforme os temas efetivamente registrados. Cada bloco deverá preservar conceitos, exemplos, dúvidas e referências mencionadas. Conteúdo não capturado será identificado como lacuna. Continuação do bloco 1 — revisão do exercício Em uma consultoria, primeiro se coletam as impressões do gestor. Depois, com dados consistentes, as hipóteses podem ser mantidas ou rejeitadas, ajudando a enfrentar o viés de confirmação. A revisão do exercício atende aos pedidos de alunos que precisaram de mais tempo para assimilar a parte estatística apresentada no fim da primeira aula. A professora apresenta na tela a matriz de correlação gerada no exercício; os valores ainda não foram registrados nesta leitura. Bloco 2 — aproximadamente 19h22–19h27 (em andamento) Leitura da matriz de correlação A professora retoma o corte do exercício: investigar coeficientes a partir de +0,4 ou abaixo de −0,4; trata-se do critério adotado nesta atividade. Correlação positiva: as variáveis tendem a subir ou descer juntas. Negativa: tendem a variar em sentidos opostos. Idade × esforço: a leitura apresentada é que maior idade está associada a maior percepção de esforço; isso ainda não explica o motivo nem estabelece causalidade. Tempo para resolver × satisfação: a professora destaca a associação aparentemente contraintuitiva de maior tempo com maior satisfação e convida a turma a explicar o resultado. A discussão diferencia ler o sinal da correlação de avaliar seu significado para o negócio. Questões para recuperar na apresentação Quais hipóteses da turma explicam idade × esforço? O que poderia explicar maior satisfação em atendimentos mais demorados? Quais evidências seriam necessárias para validar essas hipóteses? Complemento — relações entre métricas de experiência Maior NPS aparece associado a menor percepção de esforço. Maior NPS aparece associado a melhor avaliação do serviço. Maior esforço aparece associado a pior avaliação. A relação tempo × satisfação foi caracterizada pela professora como moderada e curiosa; não foi registrado um coeficiente exato nesta leitura. A professora solicita que representantes dos grupos apresentem seus achados mais relevantes e as hipóteses que ainda sustentam após a análise. O uso do LLM para calcular estatística descritiva e montar a matriz faz parte da atividade; a discussão se concentra na interpretação dos resultados. Bloco 3 — 19h27–19h32 (em andamento) Hipóteses da turma — idade × esforço Um representante de grupo propõe que dificuldades de entendimento de aplicações e das orientações de suporte poderiam explicar maior esforço entre pessoas mais velhas. Classificação: hipótese apresentada por aluno, ainda sem validação; não é uma conclusão sobre capacidade de pessoas de determinada idade. A professora acolhe a contribuição para aprofundamento posterior. Hipóteses alternativas e segmentação A professora levanta a possibilidade de uma equipe de suporte mais júnior ter dificuldade de comunicação com profissionais mais seniores. Isso desloca a investigação também para a qualidade da orientação oferecida. Outro grupo relata que o canal telefônico pode estar por trás da associação entre idade e esforço : pessoas mais velhas utilizariam mais o telefone; usuários mais jovens desse mesmo canal também apresentariam insatisfação. Classificação: achado relatado pelo grupo e acolhido pela professora como investigação relevante. Os números e recortes exatos ainda não foram mostrados na transcrição capturada. A professora afirma que a base foi preparada com armadilhas que exigem investigação mais detalhada. Implicação para a análise: segmentar por canal antes de atribuir a dificuldade à idade; comparar pessoas de idades diferentes dentro do mesmo canal. Bloco 4 — 19h32–19h37 (em andamento) Variável omitida: canal de atendimento A professora esclarece que o exemplo de idade × esforço é de variável omitida , e não o exemplo de paradoxo de Simpson que havia começado a mostrar em outro slide. No canal telefone, a idade média apresentada é de 51 anos , e o esforço médio é maior. Segundo a explicação da professora, o telefone é problemático para todas as idades. Isso põe em dúvida uma explicação centrada exclusivamente na idade e orienta a investigação para o canal. As hipóteses iniciais sobre idade servem como ponto de partida, mas devem ser revistas à luz da segmentação. O paradoxo de Simpson foi mencionado em relação a outro slide, com recorte por criticidade; aguarda-se a explicação completa desse exemplo. Relato de validação de um grupo — por volta de 19h32–19h33 Uma aluna relata correlação agregada de 0,47 entre idade e esforço, que desapareceu na análise dentro de cada canal. O grupo abandonou sua hipótese inicial centrada na idade. A professora confirma que essa investigação atende ao objetivo do exercício: usar o LLM para o trabalho de cálculo e aplicar experiência de negócio para interpretar o que a análise agregada esconde. Cuidado para os slides: o relato favorece investigar o canal como explicação da associação agregada; não equivale, por si só, a uma demonstração experimental de causalidade. Limite da conclusão explicitado pela professora Investigar por que determinado público usa mais o telefone e o que acontece nas ligações. A evidência apresentada ainda não permite inferir além desse direcionamento de investigação. Bloco 5 — aproximadamente 19h35–19h40 (em andamento) Tempo de resolução × satisfação A professora retoma a associação contraintuitiva entre maior tempo de resolução e maior avaliação. Um grupo propõe que chamados mais demorados possam ser percebidos como mais complexos; a resolução desses casos poderia gerar maior reconhecimento e satisfação. Classificação: hipótese do grupo, aguardando discussão e contraste com os recortes da base. Atenção, criticidade e contexto operacional Outro grupo sugere que mais tempo de atendimento possa representar maior cuidado, acompanhamento e confirmação de que o problema foi resolvido. Ao segmentar por criticidade , a professora mostra maior avaliação nos chamados de criticidade alta, que também consomem mais tempo. SLA acordado, equipe especializada e compreensão da complexidade pelo solicitante aparecem como possíveis explicações a verificar com o gestor, e não como fatos demonstrados apenas pela matriz. A professora enfatiza que conversar com o gestor é necessário para compreender esses mecanismos de negócio. Paradoxo de Simpson — tempo × avaliação Na base agregada: correlação positiva de +0,42 , sugerindo maior satisfação associada a maior demora. Dentro de cada um dos três níveis de criticidade: correlações negativas; maior demora acompanha menor avaliação. O grupo de criticidade alta apresenta patamares de duração e avaliação mais altos, influenciando o resultado agregado. A professora apresenta essa divergência entre associação agregada e associações nos subgrupos como paradoxo de Simpson . Aprendizado para a liderança: verificar a composição dos grupos antes de transformar uma correlação agregada em orientação operacional. Bloco 6 — aproximadamente 19h40–19h45 (em andamento) Relevância de uma correlação A professora aponta que NPS × avaliação tem correlação alta, mas isso não torna a relação um achado importante por si só. Ela inicia a discussão sobre avaliar a utilidade dessas variáveis na construção de modelos estatísticos e de machine learning. Redundância, avaliação e postura crítica NPS e avaliação podem trazer informação redundante; correlação alta não basta para justificar manter ambas em um modelo. A professora anuncia que há viés de seleção na base e pergunta se algum grupo o encontrou; identificação ainda pendente neste trecho. Orientação de avaliação anunciada ao vivo: quatro entregas de 2,5 pontos. Para esta primeira atividade, os grupos que entregaram ou entregarem hoje receberão a pontuação pela entrega; a professora afirma que não descontará argumentações estatisticamente imprecisas, pois o objetivo era explorar o valor da IA clássica. Usar IA não encerra a atividade: é preciso validar suas hipóteses, investigar os dados e aplicar senso crítico. Bloco 7 — aproximadamente 19h45–19h50 (em andamento) IA como copiloto e aprendizado A professora relata feedback anônimo de outra turma: entregas feitas integralmente com IA resultaram em discussões rasas e desconforto de uma integrante. A orientação é manter o comando da investigação, aprofundando a análise além dos primeiros insights do ChatGPT. Viés de seleção identificado Os 420 registros da base têm status “resolvido”. A professora pergunta quais problemas isso traz para a interpretação da experiência de atendimento. A explicação das consequências será registrada na continuação. Registro de cobertura Após a identificação dos 420 chamados resolvidos, a leitura da transcrição foi interrompida pela mudança para outra janela do Teams. A retomada e eventual recuperação desse intervalo devem ser verificadas antes de considerar o resumo completo. Bloco 8 — aproximadamente 19h49–19h54 Fechamento do exercício Foi confirmado que a base representa suporte de TI interno: funcionários de uma organização abrem chamados. Depois de descartar interpretações iniciais e considerar o canal, o próximo passo é estabelecer uma estratégia de validação e testar melhorias. A professora destaca que a IA reduz o tempo gasto em código, cálculos e gráficos, liberando tempo para discutir o negócio, validar com o cliente e aplicar senso crítico. Mantida a orientação de 2,5 pontos para a primeira entrega; espera-se evolução da visão crítica nas próximas atividades. Transição de conteúdo A professora anuncia o início do material da aula 2 e a discussão de um projeto corporativo em que atua, atendendo a pedidos da turma por mais casos de mercado. Intervalo para café ainda será anunciado. Cobertura Leitura da reunião retomada. Parte do intervalo entre a identificação do viés de seleção e o fechamento da revisão ainda precisa ser recuperada da transcrição completa. ", "formato": ".md"}, {"titulo": "transcricao_completa", "disciplina": "02", "grupo": "AI Core Concepts", "markdown": "biblioteca/02/transcricao-completa-31d6ef8e/conteudo.md", "html": "biblioteca/leitura/biblioteca/ : " Sumário do documento Navegação Projetos e materiais identificados Atualização AI Sociedades do Futuro Dessincronizao e… Turma 4ABL · MBA AI Leadership · Organização: 03 · Status: com-material . O título aparece truncado na imagem; confirmar o nome oficial no portal. Navegação Aulas Projetos Entregas Referências Projetos e materiais identificados Reflexão sobre futuros e regeneração : rascunho localizado no acervo; submissão não verificada. Atualização Registre novos encontros por data e projetos por nome estável. Use os modelos em ../../templates/ . Material encontrado não significa aula cursada, conclusão de disciplina ou entrega registrada no portal. ", "formato": ".md"}, {"titulo": "Entrega — futuros, dessincronização e regeneração", "disciplina": "03", "grupo": "AI Sociedades do Futuro Dessincronizao e…", "markdown": "disciplinas/03-ai-sociedades-do-futuro/entregas/README.md", "html": "biblioteca/leitura/disciplinas/03-ai-sociedades-do-futuro/entregas/README.html", "texto": " Entrega — futuros, dessincronização e regeneração Foram encontrados um documento de atividade e um rascunho de entrega Word. Preservados em ../../../acervo-local/originais/AI Sociedades do Futuro Dessincronizao/ somente na máquina local. Submissão e nota não foram verificadas. Antes de divulgar, revisar autoria compartilhada, identificação do grupo e autorização dos participantes. ", "formato": ".md"}, {"titulo": "01_DIAGNOSTICO_E_CONSOLIDACAO", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/01-diagnostico-e-consolidacao-9e17db49/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/01-diagnostico-e-consolidacao-9e17db49/conteudo.html", "texto": " 01_DIAGNOSTICO_E_CONSOLIDACAO Índice da biblioteca Fonte: Vibe Coding Executivo/speakup-lovable/01_DIAGNOSTICO_E_CONSOLIDACAO.txt SHA-256: 9e17db49625e183f40383f9ae017733726dad3b298eb01df82b2be4243d47215 Transcrição textual integral; não é resumo. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. DIAGNÓSTICO E CONSOLIDAÇÃO DA PLATAFORMA SPEAKUP Data de referência 14 de outubro de 2026 PARTE 1 — DIAGNÓSTICO DE LEITURA Foram lidos integralmente os textos e tabelas de PRD.md.docx e PSS.md.docx, documentos de produto da pasta raiz. Não há imagens incorporadas nesses dois arquivos. Não foi identificado um Service Blueprint específico do produto. Os slides e modelos genéricos da aula não foram tratados como requisitos do produto. O arquivo SpeakUp_Requisitos_Antonio_Figueiredo.docx foi consultado como contexto de Discovery; não substitui a priorização P0/P1/P2 do PRD. Traz RF-11 de ciclo do aluno e volumes adicionais, que não devem ampliar silenciosamente o MVP. Foram lidos Prompt_de_Ignicao_Mestre_Independente_V2.docx e Prompt_Interpretador_Mestre_Vibe_Coding_V1.docx. O primeiro traz internamente versão 1.0, apesar do nome V2. As duas cópias do Interpretador têm texto idêntico. Os dois Configurador de System Prompt.docx também têm texto idêntico: 27 perguntas, 1 resposta explícita, 26 sem resposta, nenhuma marcação indeterminada identificada. A resposta está em Q4.1: número sequencial automático. Os campos de contexto e observações estão em branco. Não há imagens nem controles de checkbox armazenados; a escolha é um X textual. Produto identificado: plataforma B2B SpeakUp Idiomas. Público: aluno, professor, coordenação e gestor de RH. Plataforma: PWA responsivo, segundo PSS §7. Tecnologia: Lovable com Supabase, escolha explícita do usuário nesta conversa. Cobertura: PRD define objetivos, prioridades, 19 campos e RNFs. PSS detalha login, importação, upsert e critérios de aceitação. Não há regras suficientes para cálculo financeiro por aula, créditos, políticas VIP/grupo, integração real de calendário, gestão contratual ou plano de migração. MVP adotado para o piloto: requisitos P0 do PRD §9, conservando os demais em etapas posteriores. Essa interpretação operacional de P0 como primeira etapa está explícita; não há aprovação de uma entrega de produção completa. PARTE 2 — MATRIZ DE CONSOLIDAÇÃO Item | Descrição | Tipo | Fonte | Prioridade | Situação RF-01 | Grade sem choque de professor/turma | funcional | PRD §9; Discovery RF-01 | P0 | confirmado RF-02 | Agendar/cancelar/remarcar em até 3 cliques; matrícula e senha padrão | funcional/jornada | PRD §§4,9,12; PSS §§2,3,6 | P0 | confirmado; política de crédito pendente RF-13 | Importação XLSX/CSV, 19 cabeçalhos, prévia e confirmação | funcional | PRD §§8,9,11; PSS §§2–6 | P0 | confirmado RF-05 | Chamada digital e frequência | funcional | PRD §§9,11; Discovery RF-05 | P0 | confirmado RF-06 | Portal RH, indicadores por empresa e aprovação de medição | funcional | PRD §§3,9; Discovery RF-06/RF-08 | P0 | indicadores confirmados; cálculo/aprovação depende de RF-08 e contrato RF-03 | Saldo, expiração e cancelamento parametrizados | regra/funcional | PRD §§9,13 | P1 | confirmado, regras pendentes RF-04 | Push/e-mail, lembretes e calendário | integração | PRD §9; PSS §2 | P1 | canais citados; provedores pendentes RF-08 | Medição mensal em 1 clique | funcional | PRD §§6,9,12 | P1 | cálculo contratual pendente RF-09 | Sugerir substitutos disponíveis | funcional | PRD §9 | P1 | critérios pedagógicos pendentes RF-07 | Histórico de evolução CEFR | funcional | PRD §9; PSS §1 | P2 | confirmado, não ampliar MVP RF-10 | SSO Azure AD/Okta e ERP | integração | PRD §9 | P2 | conectores/provisionamento pendentes RF-12 | Auditoria de alterações | funcional | PRD §9 | P2 | prioridade P2, infraestrutura mínima já necessária pelo RNF-07 e PSS §8 RNF-01 | Mobile-first e até 3 cliques | qualidade | PRD §10 | sem prioridade expressa | confirmado RNF-02 | Resposta &lt;=2 segundos | qualidade | PRD §10 | sem prioridade expressa | meta confirmada, carga a validar RNF-03 | Disponibilidade 99,5%, 24/7 | qualidade | PRD §10 | sem prioridade expressa | meta confirmada, não certificada no piloto RNF-04 | TLS 1.3 e AES-256; privacidade | qualidade | PRD §10; PSS §8 | sem prioridade expressa | depende de infraestrutura e validação RNF-05 | Papéis Aluno, Professor, Coordenação e RH | autorização | PRD §10 | sem prioridade expressa | confirmado RNF-06 | Até 5.000 usuários ativos | capacidade | PRD §10 | sem prioridade expressa | Discovery menciona simultaneidade, cenário de carga pendente RNF-07 | Logs imutáveis por 12 meses | qualidade | PRD §10; PSS §8 | sem prioridade expressa | aplicação pode bloquear edição; retenção/integridade externa pendentes AUX-01 | Cabeçalho Valor Mensalidade mapeado a valor_mensalidade | dados | PRD §8; PSS §§3,5 | ID auxiliar criado na análise | confirmado AUX-02 | Upsert por matrícula existente | regra | PSS §3 | ID auxiliar criado na análise | confirmado AUX-03 | Vínculo aluno-empresa separado de unidade | inferência técnica | isolamento RH, PRD personas/RNF-05 | ID auxiliar criado na análise | necessário ao piloto; não presumir unidade=empresa em produção AUX-04 | Lote atômico, ordem exata, até 5 MB/5.000 linhas | decisão do piloto | não especificado integralmente nos documentos | ID auxiliar criado na análise | escolha operacional revisável, não requisito aprovado PARTE 3 — VALIDAÇÃO 1. Fluxo dos prompts: o Interpretador é destinado ao Configurador de System Prompt, e não ao prompt de ignição. Os entregáveis foram separados para preservar a finalidade de cada material. A implementação é uma etapa posterior autorizada explicitamente pelo usuário. 2. Identificadores: Q4.1 escolhe sequenciais, enquanto PSS define matrícula VARCHAR(50) como chave de tb_aluno. Preservar a matrícula textual como exceção explícita; usar sequenciais em entidades internas. Supabase Auth exige UUID para usuários; registrar essa exceção técnica, sem converter matrículas ou renumerar legados. 3. Sintaxe SQL do PSS é parcialmente MySQL (ON UPDATE CURRENT_TIMESTAMP); traduzir comportamento para PostgreSQL. Não copiar SQL incompatível. Manter updated_at por operações de atualização controladas. 4. Senha fixa versus inicial: PRD §§4/12 e PSS §§2/3 empregam ambas as expressões. O piloto provisiona Escola@@@ e autentica pelo Supabase Auth. Não afirmar conformidade de produção desse mecanismo. Mudança obrigatória da senha ou alteração de política requer decisão do responsável. 5. Medição: RF-06 P0 cita aprovação, RF-08 P1 contém a consolidação. Indicadores são implementáveis; cálculo financeiro e aprovação real aguardam preços/contratos. Não substituir por soma de mensalidades ou valores fictícios e não simular aprovação financeira. 6. Banco e plataforma antes ausentes foram resolvidos pelo usuário: Lovable + Supabase. Tipos, fuso de exibição, paginação e identidade visual não foram escolhidos no formulário; padrões empregados no piloto são decisões técnicas revisáveis, não respostas do aluno. 7. Importação não cria automaticamente contas Auth: cadastro e identidade são recursos distintos. Script de provisionamento é separado e restrito ao operador. Não resetar senhas de usuários existentes em um upsert. 8. Não há um conflito que impeça gerar o prompt de construção completo com pendências explícitas. Há lacunas que impedem declarar o produto pronto para operação real: políticas VIP/grupo, créditos, contrato, integrações, migração, backups, escala, TLS/AES e retenção de auditoria. PERGUNTAS PENDENTES PARA ETAPAS POSTERIORES Quais as janelas de cancelamento por modalidade e contrato, e seus efeitos no crédito? Como as aulas são precificadas e medidas, inclusive faltas e cancelamentos? Como serão vinculados os alunos às empresas e os usuários aos quatro perfis? A senha padrão permanecerá fixa ou será somente inicial? Qual é o projeto Supabase de desenvolvimento, domínio e cronograma de migração? Nenhum dado real foi carregado nem qualquer ambiente externo foi configurado nesta execução. ", "formato": ".txt"}, {"titulo": "02_PROMPT_DE_IGNICAO_LOVABLE", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/02-prompt-de-ignicao-lovable-b551fb02/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/02-prompt-de-ignicao-lovable-b551fb02/conteudo.html", "texto": " 02_PROMPT_DE_IGNICAO_LOVABLE Índice da biblioteca Fonte: Vibe Coding Executivo/speakup-lovable/02_PROMPT_DE_IGNICAO_LOVABLE.txt SHA-256: b551fb02d123af3cc204aba2d6fc9030cedddc0911420c016d7a0ca795d3bf33 Transcrição textual integral; não é resumo. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. PROMPT DE IGNIÇÃO — CONSTRUÇÃO DA APLICAÇÃO SPEAKUP IDIOMAS INÍCIO DO PROMPT ÚNICO A. PAPEL DA IA DESENVOLVEDORA Atue como arquiteto e desenvolvedor da plataforma SpeakUp Idiomas. Construa uma PWA web responsiva no Lovable com backend em um projeto próprio Supabase, conforme escolha do usuário. Organize o desenvolvimento incrementalmente. Não use Lovable Cloud em substituição ao projeto Supabase próprio sem consultar o responsável. Não trate simulações como serviços conectados. Preserve as decisões abaixo e explicite pendências. B. VISÃO DO PRODUTO Construa uma plataforma integrada para a operação de idiomas corporativos B2B da SpeakUp. O contexto atual envolve mais de 800 alunos, processos manuais, mais de 15 horas semanais de retrabalho, choques de agenda, baixa visibilidade do RH e atraso na medição. O objetivo é dar autonomia ao aluno, organizar turmas e docentes e oferecer acompanhamento autorizado às empresas. As personas são Beatriz, aluna corporativa; Marina, coordenadora; Rodrigo, gestor de RH. O professor registra a presença das turmas sob sua responsabilidade. As metas de resultado são reduzir em 80% o esforço de grade, obter mais de 90% de autoatendimento em até 3 cliques e apoiar a aprovação mensal em 1 clique até o primeiro dia útil. Trate essas metas como indicadores a medir, não como resultados já comprovados. C. ESCOPO E ETAPAS Etapa inicial: RF-01 grade, RF-02 autoatendimento, RF-13 importação, RF-05 presença e indicadores autorizados de RF-06, todos P0. Inclua desde a fundação as restrições dos RNFs. RF-06 também prevê aprovação de medições; implemente essa ação somente após a consolidação contratual de RF-08 estar validada. Registre essa dependência expressamente, sem declarar RF-06 completo prematuramente. Etapa P1: RF-03 créditos e políticas, RF-04 notificações/calendários, RF-08 medição e RF-09 substituição. Etapa P2: RF-07 histórico CEFR, RF-10 SSO/ERP e RF-12 interface completa de auditoria. A infraestrutura mínima de auditoria é exigida desde o início por RNF-07 e PSS. Exclua gamificação avançada, produção de cursos/conteúdo, pagamentos B2C por cartão, folha de pagamento docente e aplicativos nativos iOS/Android. Não transforme o Discovery em ampliação automática desse escopo. D. USUÁRIOS E PERMISSÕES Separe quatro perfis: aluno, professor, coordenação ADM e gestor RH. Aluno: login por id_aluno e senha Escola@@@; valide matrícula ativa. Mostre somente seus dados, sua agenda e operações próprias. Preserve a matrícula textual e zeros à esquerda. O requisito alterna senha fixa e inicial: mantenha a senha no provisionamento conforme documentado e sinalize a decisão em aberto antes de produção. ADM: e-mail corporativo e senha individual, gestão de alunos, importações, turmas/grade, presença e indicadores operacionais autorizados. Professor: somente suas aulas e lista mínima necessária à chamada, sem acesso a dados financeiros ou pessoais não necessários. RH: somente indicadores autorizados da própria empresa. Não permita acesso cruzado entre empresas, exportação de base completa ou dados de nascimento, gênero e e-mail sem necessidade definida. Implemente autorização no servidor, em RLS e/ou funções com permissões explícitas. Nunca confie em papel enviado pelo navegador, localStorage ou ocultação de botões. Não permita autoatribuição de perfis privilegiados. E. JORNADAS PONTA A PONTA Aluno: abrir login, informar matrícula e senha, validar credenciais e matrícula ativa, carregar painel com próximas aulas; exibir saldo apenas quando houver política configurada e nível atual disponível. Para agendar: abrir horários, selecionar opção, confirmar, totalizando até 3 cliques após o painel. Atualize imediatamente a agenda. Para remarcar: selecionar nova opção e confirmar de forma atômica, preservando a original se falhar. Para cancelar: validar titularidade e elegibilidade; registrar evento e refletir a agenda. Não invente devolução ou perda de crédito sem política. Bloqueie agenda passada, matrícula inativa, horário lotado e sobreposição do próprio aluno. ADM/importação: entrar com conta autorizada, abrir Gestão de Alunos, selecionar ou arrastar XLSX/CSV, validar cabeçalhos, parsear todas as linhas, mostrar novos/atualizados/erros, pré-visualizar as 19 colunas, destacar linhas válidas e inválidas, solicitar confirmação explícita para gravar. Caso faltem colunas, interrompa com “Arquivo inválido. A planilha deve conter rigorosamente as 19 colunas da estrutura oficial”. Reporte linha e coluna do erro. Use upsert por id_aluno. Grave log de carga; não resete senhas existentes. Diferencie cadastro importado de conta Auth provisionada. Coordenação/grade: selecionar professor, turma e intervalo; validar disponibilidade, professor/turma e capacidade; bloquear conflitos; oferecer alternativas disponíveis. Use transação/constraints para que duas requisições concorrentes não passem pela mesma vaga ou conflito. A sugestão pedagógica de substitutos é etapa P1, não apenas listagem arbitrária de nomes. Professor/chamada: abrir aula atribuída, registrar presença ou falta conforme permissões, refletir o índice de frequência em relatórios autorizados. Preserve histórico de alterações. Conte horas ministradas somente após registro efetivo da chamada, quando a etapa de apuração estiver disponível. Lembretes automáticos pós-aula dependem do provedor de notificações de P1. RH: autenticar, obter indicadores de sua empresa, consultar frequência e evolução permitida. A medição mensal só deve ser exibida como apta a aprovação quando existir cálculo contratual validado. Aprovação é uma ação única autorizada, com período, valores e trilha. Não simule faturamento. F. REQUISITOS FUNCIONAIS RF-01 P0: criar e conciliar grade sem choque de professor ou turma. Dado um horário sobreposto, recuse e preserve a grade anterior; dado intervalo adjacente, permita. Valide também conflitos do aluno em reservas. RF-02 P0: login por matrícula ativa, agendar/cancelar/remarcar em até 3 cliques. Mostre confirmação e erro acionável. Nunca cancele a aula original se a nova reserva não puder ser concluída. RF-13 P0: importe XLSX/CSV nas 19 colunas, valide tipos e mostre preview com quantidade de inserções/atualizações. Revalide no servidor e preserve atomicidade do lote no piloto. Limites de arquivo/lote e ordem exata devem ser identificados como decisões operacionais revisáveis, não requisitos originais. RF-05 P0: chamada digital, frequência calculada a partir dos registros, atualização autorizada após gravação. Não conte chamada pendente como falta efetiva. RF-06 P0: dashboard por empresa com alunos ativos, frequência, indicadores operacionais e evolução disponível; aprovação de medição depende de RF-08. Mostre ausência de dados sem criar números artificiais. RF-03 P1: saldo, expiração e políticas de crédito por contrato. Parametrize política VIP versus turmas; solicite os parâmetros antes de aplicar penalidade. RF-04 P1: lembretes de aula, confirmações e alteração de grade via push/e-mail e calendário. Exija provedor configurado, consentimento quando aplicável e registro de falhas/reenvio. Não confunda baixar ICS com sincronização nativa. RF-08 P1: consolide mensalmente aulas agendadas/realizadas conforme contrato, gere planilha de medição em 1 clique e ofereça aprovação pelo RH. Defina preço por aula, descontos, faltas, cancelamentos e coparticipação antes do cálculo. RF-09 P1: recomende substitutos disponíveis, valide agenda e critérios documentados, registre troca e notifique afetados. Não invente critérios de habilitação sem validação. RF-07 P2: histórico CEFR A1–C2, nivelamento, evolução e histórico permitido entre docentes. Diferencie nível cadastral de histórico evolutivo. RF-10 P2: SSO Azure AD/Okta e exportação/integração ERP; conectores concretos, credenciais, contratos e campos autorizados são pendências. Não declare integrações ativas sem teste. RF-12 P2: consulta de trilha de alterações em cadastro, abonos e remanejamentos; registrar ator, data/hora e informação necessária sem registrar senhas. O mecanismo mínimo nasce com o projeto. G. DADOS E INTEGRAÇÕES A base oficial de importação tem exatamente os seguintes cabeçalhos: id_aluno | nome | email | data_nascimento | idade | genero | unidade | cidade | estado | canal_aquisicao | nivel_curso | modalidade | turno | plano | desconto_percentual | data_matricula | status_matricula | data_cancelamento | Valor Mensalidade No banco, preserve tb_aluno conforme os tipos definidos: id_aluno VARCHAR(50), chave única; nome VARCHAR(150) obrigatório; email VARCHAR(100) obrigatório; data_nascimento DATE opcional; idade INT; genero VARCHAR(20); unidade VARCHAR(100); cidade VARCHAR(100); estado VARCHAR(2); canal_aquisicao VARCHAR(50); nivel_curso VARCHAR(50); modalidade VARCHAR(20); turno VARCHAR(20); plano VARCHAR(50); desconto_percentual DECIMAL(5,2); data_matricula DATE obrigatório; status_matricula VARCHAR(20) obrigatório; data_cancelamento DATE opcional; valor_mensalidade DECIMAL(10,2) obrigatório. O cabeçalho externo “Valor Mensalidade” mapeia explicitamente a valor_mensalidade. Preserve created_at e updated_at como metadados fora das 19 colunas importadas. Use datas de importação ISO YYYY-MM-DD válidas; preços/percentuais estritamente numéricos. Matrícula é texto; não remova zeros iniciais. Status possíveis: Ativa, Cancelada, Trancada e Pausada. Unicidade de e-mail de aluno não está confirmada: não imponha silenciosamente. Preserve a matrícula como chave do upsert. Modele os vínculos mínimos de empresa, perfil/identidade, professor, turma, aula, reserva e presença necessários aos fluxos. Documente como decisões derivadas, pois não há schema completo dessas entidades. Não infira a empresa a partir de unidade em produção; use vínculo explícito autorizado. Use IDs sequenciais internos, com exceção da matrícula textual e UUID nativo do Auth. Adapte a sintaxe MySQL de updated_at do exemplo para PostgreSQL. Não copie ON UPDATE CURRENT_TIMESTAMP. Integrações futuras: push/e-mail, calendário, SSO Azure AD/Okta e ERP; sem fornecedores ou endpoints inventados. Configure segredos somente no backend. H. UX E INTERFACE Implemente login aluno, login corporativo, painel aluno, agenda/seleção de horários, Gestão de Alunos, upload/preview de 19 colunas, grade ADM, chamada e painel RH. Inclua estados carregando, vazio, erro, acesso negado e sucesso. Use labels, foco de teclado, contraste e tabelas com rolagem em telas pequenas. O material não define identidade visual. Como proposta revisável, use tons verdes, tipografia legível e painel limpo em português brasileiro; não apresente essa proposta como marca aprovada. Separe claramente modo demonstração com dados fictícios do ambiente conectado. Nunca leve autorização da demonstração para produção. I. QUALIDADE RNF-01: mobile-first, principais ações em até 3 cliques. RNF-02: consultas e relatórios &lt;=2 segundos sob pico definido. RNF-03: disponibilidade &gt;=99,5%, 24/7. RNF-04: TLS 1.3, AES-256 em repouso para dados sensíveis e tratamento conforme os requisitos de privacidade. Verifique capacidades do plano/provedor e não declare conformidade só porque usa Supabase. RNF-05: RBAC com isolamento por aluno, turma/professor e empresa/RH. RNF-06: até 5.000 usuários ativos, com cenário de simultaneidade a validar. RNF-07: trilha imutável por no mínimo 12 meses, acessível somente a autorizados. Triggers que bloqueiam edição pela aplicação não impedem o proprietário do banco de alterá-la; defina retenção e arquivo protegido antes de produção. Use transações e validação de servidor. Evite float para valores monetários. Nunca exponha service_role, credenciais ou senhas em logs/frontend. Não grave dados reais no modo demo. Não prometa RTO/RPO ou teste de carga que não executou. J. CRITÉRIOS DE ACEITAÇÃO 1. Dada matrícula ativa 10045 provisionada, ao usar Escola@@@ autentique e direcione ao painel; a meta é &lt;2 segundos, medida no ambiente final. Matrícula inativa ou senha incorreta não obtém dados. 2. Dado XLSX/CSV correto com 19 colunas, mostre preview, novas/atualizações e confirme antes de gravar; ao concluir mostre “Importação concluída com sucesso: X alunos inseridos/atualizados”. Repetir o lote não duplica matrículas. 3. Dado arquivo com 15 colunas, rejeite antes de persistir com mensagem de schema. Dado erro de data/número/duplicidade, indique linha e coluna e não grave lote parcial no piloto. 4. Dadas aulas com professor ou turma sobrepostos, bloqueie; horários adjacentes válidos são aceitos. 5. Dada aula com uma vaga, concorrência não cria duas reservas. Remarcação inválida preserva a original. Aluno não cancela reserva alheia nem agenda aula no passado. 6. Professor não acessa chamada de outra turma; RH não recebe dados de outra empresa nem base pessoal completa. A requisição direta à API também deve falhar. 7. Presença gravada aparece nas consultas autorizadas; chamada pendente não vira ausência automaticamente. 8. Sem configuração financeira, não mostre fatura ou aprovação como concluída; sem provedor de notificação, não mostre “e-mail enviado”. 9. Matrículas com zeros, acentos e campos opcionais vazios não sofrem perda; cabeçalho externo é preservado no modelo exportado. 10. Valide desktop e celular, teclado, erros, recarregamento e sessão expirada. Execute testes de integração em Supabase de desenvolvimento antes de dados reais. K. EXECUÇÃO INCREMENTAL 1. Confirmar projeto Supabase próprio e domínio, carregar estas instruções e o kernel, criar fundações e ambiente demo fictício separado. 2. Modelar tabelas/vínculos, Auth/provisionamento, políticas e auditoria mínima; validar proibição de acesso cruzado. 3. Implementar importação completa com upsert, preview e transação; não alterar identidade de usuários existentes. 4. Implementar grade, restrições de conflitos e reservas/remarcações atômicas. 5. Implementar chamada e painel RH autorizado, com atualização coerente dos dados. 6. Testar cenários positivos/negativos, corrigir falhas e registrar limitações. 7. Validar parâmetros contratuais para avançar em P1 e depois P2, mantendo fronteiras explícitas. L. GOVERNANÇA Não invente políticas de cancelamento, preços, crédito, migração, identidade visual aprovada, empresas dos alunos, credenciais ou integrações. Questione mudanças materiais e registre decisões mínimas de implementação como revisáveis. Preserve a prioridade P0/P1/P2. Diferencie meta, implementação, teste local e comprovação em produção. A senha compartilhada do aluno exige decisão formal de segurança antes da operação real; não altere o requisito silenciosamente. M. DEFINIÇÃO DE PRONTO A etapa inicial só está pronta quando seus fluxos funcionarem com persistência real, sessões e autorização de servidor, schema de importação validado, conflitos e concorrência testados, chamada integrada e painel RH isolado. Cada dependência incompleta deve estar identificada, incluindo medição de RF-06. O produto inteiro não está pronto enquanto P1/P2 e RNFs confirmados não forem atendidos no ambiente de destino. Entregue evidências dos testes, instruções de operação e lista honesta de pendências. Não declare projeto criado/conectado/publicado sem confirmação do serviço. FIM DO PROMPT ÚNICO ", "formato": ".txt"}, {"titulo": "03_SYSTEM_PROMPT_KERNEL_SUPABASE", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/03-system-prompt-kernel-supabase-a106b9c8/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/03-system-prompt-kernel-supabase-a106b9c8/conteudo.html", "texto": " 03_SYSTEM_PROMPT_KERNEL_SUPABASE Índice da biblioteca Fonte: Vibe Coding Executivo/speakup-lovable/03_SYSTEM_PROMPT_KERNEL_SUPABASE.txt SHA-256: a106b9c8b935537f397a9784694616680fd8b7373576fffae58fab04ef901b7c Transcrição textual integral; não é resumo. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. INTERPRETAÇÃO DO CONFIGURADOR Projeto identificado nos documentos de produto: SpeakUp Idiomas, educação corporativa B2B. Os campos de projeto do formulário estão vazios. Banco/plataforma escolhidos pelo usuário nesta conversa: Supabase/PostgreSQL + Lovable. Perguntas: 27; respondidas: 1; não respondidas: 26; indeterminadas: 0. A marcação X de Q4.1 está nas duas cópias idênticas. As opções recomendadas não são escolhas. Pergunta | Escolha identificada | Situação Q1.1 | sem resposta | pendente Q1.2 | sem resposta | pendente Q1.3 | sem resposta | pendente Q2.1 | sem resposta | pendente Q2.2 | sem resposta | pendente Q2.3 | sem resposta | pendente Q2.4 | sem resposta | pendente Q3.1 | sem resposta | pendente Q3.2 | sem resposta | pendente Q3.3 | sem resposta | pendente Q3.4 | sem resposta | pendente Q3.5 | sem resposta | pendente Q3.6 | sem resposta | pendente Q4.1 | número sequencial automático | confirmado Q4.2 | sem resposta | pendente Q4.3 | sem resposta | pendente Q5.1 | sem resposta | pendente Q5.2 | sem resposta | pendente Q5.3 | sem resposta | pendente Q6.1 | sem resposta | pendente Q6.2 | sem resposta | pendente Q6.3 | sem resposta | pendente Q7.1 | sem resposta | pendente Q7.2 | sem resposta | pendente Q7.3 | sem resposta | pendente Q8.1 | sem resposta | pendente Q8.2 | sem resposta | pendente VALIDAÇÃO ARQUITETURAL CONSISTENTE: IDs internos sequenciais; campos relacionais e tipos do PSS traduzidos para PostgreSQL; autenticação separada de autorização. ATENÇÃO: matrícula textual como chave específica do produto versus a escolha geral sequencial; UUID do Auth como exceção técnica da plataforma. A aplicação preserva essas exceções explicitamente. ATENÇÃO: senha padrão comum confirmada nos documentos e proteção de dados exigida no RNF; não confundir hash forte com prevenção de acesso por conhecimento da senha comum. PENDENTE: política de eliminação/anonimização, cascata, fuso, convenções gerais, volumes por tabela, dados pessoais, retenção externa e políticas contratuais. Não há escolhas suficientes para atribuir ao aluno uma política geral completa. RECOMENDAÇÕES/DECISÕES DO PILOTO, NÃO RESPOSTAS DO ALUNO: eventos em TIMESTAMPTZ, apresentação pt-BR, paginação 20, tabelas internas snake_case, limites operacionais do upload. Valide antes de consolidá-las como regras permanentes. INÍCIO DO BLOCO PARA INSTRUÇÕES DO PROJETO SYSTEM PROMPT — KERNEL DE BANCO DE DADOS — SPEAKUP IDIOMAS IDENTIDADE E CONTEXTO Atue como responsável pela consistência do kernel da plataforma SpeakUp Idiomas, educação corporativa B2B. Estas instruções regulam a implementação futura, e não expandem funcionalidades. BANCO E TECNOLOGIA Utilize PostgreSQL no Supabase integrado ao Lovable, conforme escolha explícita do usuário. Não substitua por outro banco ou backend sem validação. Adapte sintaxe do exemplo do PSS para PostgreSQL. IDENTIFICADORES E INTEGRIDADE Adote identificadores numéricos sequenciais automáticos nos registros internos conforme Q4.1. Preserve a exceção de tb_aluno: id_aluno é VARCHAR(50), único e chave de importação, incluindo zeros à esquerda. Não renumere matrículas existentes. Preserve UUID nativo do Supabase Auth como identidade técnica separada da matrícula e do ID interno. Não use a previsibilidade do ID como mecanismo de autorização. Valide vínculos e titularidade em cada operação. Não invente política geral de DELETE CASCADE ou soft delete: Q4.2/Q4.3 não estão respondidas. Preserve o histórico exigido pelo produto; eliminação e anonimização dependem de validação da política de privacidade. DATAS E HORÁRIOS Conforme PSS, use DATE para data_nascimento, data_matricula e data_cancelamento; receba datas ISO YYYY-MM-DD válidas na importação. created_at e updated_at são metadados previstos pelo PSS. Convenções gerais de fuso e exibição permanecem pendentes no formulário; documente qualquer escolha operacional sem atribuí-la ao aluno. NÚMEROS E DINHEIRO Preserve idade como inteiro, desconto_percentual DECIMAL(5,2) e valor_mensalidade DECIMAL(10,2), conforme PSS. Não use ponto flutuante para persistência de dinheiro. Não infira a fatura por aula a partir da mensalidade. Representação de percentuais e formato visual geral devem ser confirmados; validações do piloto consideram percentual de 0 a 100 explicitamente como decisão operacional. TEXTO E CAMPOS OFICIAIS Preserve nomes, tipos e limites de tb_aluno indicados no prompt de construção. Importe o cabeçalho literal Valor Mensalidade e mapeie a valor_mensalidade. Nome, email, data_matricula, status_matricula e valor_mensalidade são obrigatórios no PSS. Não imponha unicidade de e-mail nem acrescente CPF, telefone ou endereço completo com base em exemplos do formulário. Convenções gerais de nomenclatura não foram escolhidas. AUTENTICAÇÃO E AUTORIZAÇÃO Utilize Supabase Auth para credenciais. Nunca armazene senha em texto puro ou exponha service_role. O aluno acessa por matrícula ativa com senha Escola@@@ conforme requisito; fixe a distinção entre credencial inicial e política de permanência como decisão pendente. ADM usa e-mail e senha individual. Separe os papéis aluno, professor, coordenação e RH no servidor, sem aceitar papéis arbitrários do navegador. RH vê somente dados autorizados da sua empresa. Matrícula inativa não obtém novos agendamentos mesmo que tenha token de sessão anterior. Implemente RLS e restrições de execução das funções. Não conceda acesso anônimo às tabelas de alunos/perfis. Não permita alteração de papel pelo próprio usuário. Limite SECURITY DEFINER e fixe search_path seguro. REGRAS DE NEGÓCIO Valide as 19 colunas e tipos no servidor, faça upsert por matrícula e preserve a identidade existente. Não resete senhas em cargas de atualização. Implemente reserva/remarcação atômica com proteção contra concorrência, capacidade e sobreposição. Não invente janelas de cancelamento nem efeitos financeiros sem parâmetros contratuais. Registre alterações críticas com ator/data, sem senhas ou payloads pessoais desnecessários. PERFORMANCE E AUDITORIA Preserve a meta de resposta &lt;=2 segundos, 99,5% de disponibilidade e até 5.000 usuários ativos; não trate essas metas como garantias verificadas. Defina cenários de carga e operação com o responsável. A trilha exigida deve permanecer íntegra por 12 meses. Valide retenção, arquivo e operação de infraestrutura; bloqueio de UPDATE/DELETE na aplicação não equivale a armazenamento imutável contra administradores. GOVERNANÇA As 26 respostas ausentes não autorizam selecionar opções recomendadas. Documente decisões técnicas necessárias como revisáveis, separadas das escolhas confirmadas. Peça validação para mudanças materiais no kernel e para parâmetros financeiros, privacidade, autenticação, integração e migração. Não declare configuração aplicada ao Lovable ou Supabase sem efetivamente verificá-la. FIM DO BLOCO ", "formato": ".txt"}, {"titulo": "04_VALIDACAO", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/04-validacao-a0bbc780/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/04-validacao-a0bbc780/conteudo.html", "texto": " 04_VALIDACAO Índice da biblioteca Fonte: Vibe Coding Executivo/speakup-lovable/04_VALIDACAO.txt SHA-256: a0bbc7803e44e0cb792e9446ea376a482402ead8a01890328c22a3e5c54e548d Transcrição textual integral; não é resumo. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. VALIDAÇÃO DA BASE LOCAL SPEAKUP Build de produção com Vite concluído. Resultado final: 25 verificações aprovadas, zero falhas (inclui o teste agrupador PostgreSQL). Testes de domínio e de PostgreSQL em memória com btree_gist executados. Verificam  lote com 5.001 alunos, rejeitar antes da prévia; 5.000 é limite técnico do piloto, já usado no backend original. Inteiro fora de faixa produz erro de coluna. Teste regression.test.mjs. AC-05 / RF-13: Dada prévia válida, ao selecionar arquivo inválido, remover prévia antiga e impedir confirmação. Teste browser/import.spec.js. AC-06 / RNF-01: Dado modal de reserva aberto, receber foco dentro dele, conter navegação por Tab, fechar com Escape e devolver foco ao acionador. Teste browser/booking.spec.js. AC-07 / RNF-05, RF-06: Dados alunos de empresas A/B em uma aula compartilhada, RH A vê somente ocupação correspondente a A. Teste database.test.mjs, novo subteste AC-07. AC-08 / RF-02: Dado aluno demo ativo, reservar horário livre, confirmar sucesso e atualizar agenda. Teste browser/booking.spec.js. AC-09 / RNF-05: usuário anônimo não chama RPC, aluno não importa, professor não altera chamada de outro professor e RH não recebe cadastro pessoal. Teste SQL herdado. AC-10 / ENG-02: instantes inválidos em reserva falham sem mutação. Teste regression.test.mjs. Validações externas ainda necessárias Supabase Auth/Edge real, concorrência em conexões PostgreSQL independentes, latência e carga, e-mail/calendário, backup/restore, acessibilidade com leitor de tela, testes completos de todos os perfis e revisão de privacidade. PGlite simula identidade SQL, não JWT/rede/Auth. AC-11 / RNF-01: viewport 390×844, dashboard de aluno sem overflow horizontal; captura visual. Teste browser/booking.spec.js. Não substitui auditoria completa de usabilidade. ", "formato": ".md"}, {"titulo": "Decisões e pendências", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/decisions.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/decisions.html", "texto": " Sumário do documento ADR-001 — Evolução comparável ADR-002 — Segurança no servidor ADR-003 — Demonstração e configuração ADR-004 — Datas e limites ADR-005 — Modal ADR-006 — Dependências e reprodutibilidade Decisões de negócio pendentes Referências técnicas primárias consultadas ADR-007 — Carregamento sob demanda Decisões e pendências ADR-001 — Evolução comparável Manter React/Vite, PostgreSQL/Supabase, UI e API do piloto. Reorganizar responsabilidades e corrigir regressões especificadas. Reescrever todo o produto impediria comparar o mesmo escopo e acrescentaria risco sem evidência. ADR-002 — Segurança no servidor Manter funções SECURITY DEFINER com search_path vazio e autorização explícita; RLS e grants continuam presentes. Corrigir apenas a contagem de ocupação do RH que agregava outras empresas. Unidade do demo não é vínculo corporativo de produção. ADR-003 — Demonstração e configuração Sem URL/chave: demo com namespace localStorage próprio. Um valor isolado: erro de configuração renderizado. Duas variáveis: Supabase. Não carregar demo em configuração parcial. ADR-004 — Datas e limites Eventos são instantes ISO com fuso explícito; comparar epoch em JavaScript. Intervalos adjacentes são permitidos. Capacity 1–100 e lote 1–5.000 repetem limites já presentes no servidor. Não criar política financeira. ADR-005 — Modal Usar elemento dialog nativo e showModal para contenção de foco e fundo inerte; Escape e restauração explícita de foco. Verificar no navegador real. Não alegar conformidade WCAG completa. ADR-006 — Dependências e reprodutibilidade A versão SDD usa npm/package-lock.json, pois pnpm não estava instalado e sua resolução inicial foi bloqueada pela rede. O lock original foi preservado em reports/original-pnpm-lock.yaml. A baseline isolada usa as mesmas dependências instaladas da cópia SDD por link local, sem mudar as declarações do original. Registre versões resolvidas em reports/dependencies.json. Essa normalização limita inferências sobre builds feitos em outros ambientes. Decisões de negócio pendentes DEC-01: senha fixa versus senha inicial. Material contraditório. Mantida regra existente para comparabilidade; resolver antes de produção com responsável. DEC-02: cancelamento/expiração/créditos. Exige dono do produto. DEC-03: preços, competência e aprovação financeira. Exige contratos. DEC-04: segregação por cliente além do RH: original tem coordenação global; não assumir escola multi-tenant sem requisito. DEC-05: retenção/anonimização e controles jurídicos/operacionais. Requer responsáveis competentes. Referências técnicas primárias consultadas https://supabase.com/docs/guides/database/postgres/row-level-security https://supabase.com/docs/guides/database/functions https://www.postgresql.org/docs/17/explicit-locking.html https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/ Essas fontes orientam revisão técnica; não provam que a implementação atende os requisitos. ADR-007 — Carregamento sob demanda O parser XLSX é carregado somente ao importar Excel; o cliente Supabase é inicializado antes da renderização e carregado apenas quando configurado. Medir artefatos de build, sem confundir tamanho de bundle com latência real ou RNF-02. ", "formato": ".md"}, {"titulo": "Discovery SpeakUp", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/discovery-speakup/README.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/discovery-speakup/README.html", "texto": " Discovery SpeakUp Material de exercício da aula de 05/10/2026. O laboratório HTML foi importado, assim como cópias locais dos documentos de requisitos e simulação, que permanecem fora do Git. Laboratório integrado . Evolução SpeakUp . Submissão acadêmica não verificada. ", "formato": ".md"}, {"titulo": "Especificação de produto e escopo", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/requirements.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/requirements.html", "texto": " Sumário do documento Versão comparável Requisitos do PRD Requisitos não funcionais Melhorias técnicas derivadas, não requisitos fictícios Especificação de produto e escopo Data de referência: 19/10/2026. Fontes: PRD.md.docx, PSS.md.docx e Prompt_Interpretador_Mestre_Vibe_Coding_V1.docx. Extrações em sources/; os Word originais são a autoridade, incluindo estrutura visual não preservada na extração textual. A skill específica solicitada não estava disponível; após autorização para prosseguir, aplicou-se um fluxo SDD explícito: fontes → requisitos → aceite → decisões → tarefas → implementação → validação. Versão comparável Evolução do piloto React/Vite/Supabase existente, com os mesmos quatro perfis e interfaces. Não é uma reconstrução independente nem experimento controlado sobre produtividade de métodos. Mantém as funcionalidades de agenda, reserva, remarcação, cancelamento, importação, chamada e indicadores. Conserva contratos RPC existentes. Requisitos do PRD RF-01 P0: grade sem sobreposição de professor ou turma. Implementado no piloto; reforçar validação de datas no demo. RF-02 P0: reservar, cancelar e remarcar em até três cliques após login; matrícula ativa. Preservar fluxo. A senha compartilhada exigida no material permanece, com conflito registrado. RF-13 P0: importar CSV/XLSX nas 19 colunas, prévia e erros por linha/coluna. Implementado; alinhar limites de cliente e servidor e invalidar prévia antiga após novo upload. RF-05 P0: chamada digital e indicadores. Implementado com refresh após operações próprias; sincronização entre usuários continua pendente. RF-06 P0: RH corporativo, frequência e aprovação de medição. Parcial: aprovação depende de RF-08. Minimizar dados do RH e evitar contagens de outra empresa em turmas compartilhadas. RF-03 P1: créditos e expiração. Pendente de política contratual; não implementar números inventados. RF-04 P1: notificações/calendário. Pendente, sem provedores configurados. RF-08 P1: medição mensal e aprovação. Pendente de regras e integração; não simular conclusão. RF-09 P1: substituição automática. Pendente. RF-07 P2: histórico CEFR. Pendente; nível atual não equivale a histórico. RF-10 P2: SSO/ERP. Pendente. RF-12 P2: auditoria. Parcial: RPCs registram eventos e trigger impede alteração comum; retenção 12 meses e imutabilidade administrativa não demonstradas. Requisitos não funcionais RNF-01: interface mobile e fluxo curto. Verificar teclado e modal, testar reserva; auditoria completa e todos os fluxos de três cliques permanecem sem certificação. RNF-02: resposta &lt;=2s sob pico. Sem evidência de carga; pendente. RNF-03: disponibilidade &gt;=99,5%. Depende de operação; pendente. RNF-04: TLS 1.3, AES-256 e LGPD. Não inferir conformidade a partir de RLS; evidências jurídicas e operacionais pendentes. RNF-05: papéis Aluno/Professor/Coordenação/RH. Preservar banco como autoridade, testar negativas e isolamento. RNF-06: 5.000 usuários. workspace_data ainda retorna coleção completa autorizada; paginação cliente não demonstra escalabilidade. RNF-07: auditoria por 12 meses. Pendente de armazenamento, retenção e restauração testados. Melhorias técnicas derivadas, não requisitos fictícios ENG-01: configuração incompleta deve falhar explicitamente, sem fallback silencioso ao demo. ENG-02: regras de calendário devem comparar instantes, aceitar offsets e rejeitar datas inválidas, capacidade fora de 1–100 e remarcação para a mesma aula. ENG-03: importação cliente deve rejeitar mais de 5.000 linhas e idade fora do inteiro PostgreSQL; nova seleção limpa a prévia anterior. ENG-04: modal deve receber foco, limitar Tab, fechar por Escape e restaurar foco ao acionador. ENG-05: RH não deve obter ocupação de outras empresas em aulas compartilhadas. ENG-06: separar domínio, aplicação, infraestrutura e apresentação sem alterar a identidade visual. ENG-07: validações executáveis e logs reproduzíveis; CI deve executar os mesmos comandos locais. ", "formato": ".md"}, {"titulo": "Execução e operação", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/docs/operations.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/docs/operations.html", "texto": " Execução e operação Desenvolvimento: npm ci; npm run dev. Sem variáveis de backend, dados fictícios. Rode original na porta 5173 e SDD na porta 5174 para comparar. localStorage SDD usa chave própria. Validação: npm test; npm run build; npm run test:e2e; npm run format:check. Instale Chromium com npx playwright install chromium antes de E2E. Banco: aplicar migração original e depois 202610190001_rh_occupancy.sql somente em desenvolvimento. Não executar automaticamente em instância compartilhada. Backup e revisão antes de promoção. Migração incremental substitui workspace_data; rollback restaura a definição da migração original, reintroduzindo a exposição de contagem de ocupação. Não fazer rollback de privacidade sem avaliar impacto. Segredos: service role somente no backend/terminal; .env.local fora de versionamento. Origin não substitui autenticação ou limitação de tentativas. Antes de produção: resolver senha compartilhada, rate limiting distribuído, paginação no servidor, telemetria sem PII, teste de carga representativo, restore de backup, retenção de auditoria e Auth/Edge reais. Não há evidência operacional de SLA ou certificação LGPD. Observabilidade a implementar: identificador de requisição, latência por RPC, falhas por código e auditoria de ações. Nunca registrar senha, token ou planilhas completas. ", "formato": ".md"}, {"titulo": "Instruções para agentes — SpeakUp SDD", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/AGENTS.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/AGENTS.html", "texto": " Instruções para agentes — SpeakUp SDD Leia specs/requirements.md, specs/acceptance.md e specs/decisions.md antes de alterar comportamento. Não assuma que o prompt interpretador é uma especificação completa do produto: ele produz diretrizes de kernel. Toda mudança de regra deve citar requisito e cenário de aceite. Não invente política de créditos ou faturamento. Preserve isolamento no banco. Demo não representa segurança multiusuário. Execute npm test, npm run build, npm run test:e2e e npm run format:check. Registre falhas reais e testes não executados. Não implante nem provisione contas automaticamente. Não inclua segredos em logs ou fixtures. ", "formato": ".md"}, {"titulo": "Missão — SpeakUp Idiomas", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/mission.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/mission.html", "texto": " Sumário do documento Direção confirmada Propósito e público Estado de partida e evidências Fronteiras do produto Princípios e limites Sucesso e condição de produção Pendências de decisão Missão — SpeakUp Idiomas Data: 19/10/2026. Estado: constituição proposta para revisão humana. Direção confirmada Antonio escolheu evoluir gradualmente até produção , preservando React/Vite/Supabase e a comparação com a implementação original. O projeto é brownfield: parte do piloto existente, não de uma reconstrução independente. Esta constituição aplica a skill local spec-driven , agora acessível em ../../../../../../acervo-local/originais/Vibe Coding Executivo/Spec-Driven Development with Coding Agents/codex-skills/skills/spec-driven/SKILL.md . A implementação e o relatório anteriores foram produzidos antes de sua leitura, com um fluxo SDD genérico autorizado. Não se deve atribuir retroativamente àquela entrega a execução dos checkpoints desta skill. Propósito e público Reduzir o trabalho manual de gestão da operação B2B da SpeakUp, oferecendo autoatendimento aos alunos, organização de turmas e docentes, registro de presença e visibilidade corporativa ao RH. Aluno: consultar, reservar, cancelar e remarcar aulas pelo portal responsivo. Professor: acompanhar as próprias aulas e registrar chamadas autorizadas. Coordenação: administrar alunos, importações, grade e operação pedagógica. RH: acompanhar informações autorizadas de sua empresa e, futuramente, aprovar medições contratuais. As personas, requisitos e objetivos de negócio derivam dos Word PRD/PSS. O prompt interpretador orienta a configuração do kernel; não substitui esses requisitos nem comprova decisões de um configurador não fornecido. Estado de partida e evidências O piloto inclui agenda, reservas, remarcação, cancelamento, importação, presença e indicadores parciais. A evolução existente corrigiu problemas de configuração, domínio, prévia de importação, foco do modal e contagem de ocupação por empresa. Em ../reports/validation.json estão os resultados anteriores: 40 verificações Node aprovadas, incluindo agrupadores, quatro cenários de navegador aprovados, build e formatação aprovados. As verificações SQL usam PGlite e identidade simulada. Não demonstram Supabase Auth/Edge reais, concorrência entre conexões, disponibilidade ou operação em produção. Fronteiras do produto O PRD continua sendo a referência funcional completa. A entrega atual é um piloto parcial. Créditos, notificações reais, medição/faturamento, substituição, histórico CEFR e integrações SSO/ERP permanecem sujeitos às fases do roadmap. Continuam fora do escopo definido nos documentos: aplicativo nativo iOS/Android, pagamento B2C por cartão, folha completa de professores, gamificação avançada e criação de cursos próprios. Hospedagem, região, orçamento e fornecedores complementares ainda não foram escolhidos. Princípios e limites Preservar ../../speakup-lovable como referência original e manter evidências comparáveis. Não equiparar contagem de testes a cobertura ou conformidade. Definir requisitos e validação antes de novas alterações. Manter a distinção entre fato observado, decisão confirmada, proposta e pendência. Usar autorização e integridade no servidor. O modo demo e o localStorage não são mecanismos de segurança multiusuário. Não inventar políticas de crédito, cancelamento, preço ou retenção para preencher lacunas. A senha universal existente exige decisão explícita antes do uso real. Não declarar LGPD, SLA, criptografia, escala ou acessibilidade integral atendidos com base somente em código ou testes locais. Tratar specs como fonte versionável. Commits, pushes e promoções de ambiente pertencem ao responsável humano; esta constituição não os executa nem os autoriza automaticamente. Revisar cada constituição e especificação antes da etapa seguinte. Mudanças relevantes de escopo exigem replanning. Sucesso e condição de produção Os objetivos do PRD — redução de 80% no esforço de coordenação, mais de 90% de autoatendimento, tarefas principais em até três cliques, medição até o primeiro dia útil, resposta em até dois segundos, disponibilidade de 99,5% e suporte a 5.000 usuários ativos — são metas a validar, não resultados desta entrega. Cada release deverá ter escopo aceito, requisitos rastreáveis, evidências apropriadas ao ambiente e limitações conhecidas. A promoção inicial requer validação de acesso entre perfis/empresas, autenticação real, regras contratuais do escopo, migração ensaiada, recuperação testada, monitoramento e avaliação operacional/de privacidade. Metodologia de carga, percentis, RPO/RTO, responsáveis e critérios de bloqueio precisam ser definidos antes desses ensaios. Pendências de decisão Política definitiva de credenciais, recuperação e primeiro acesso. Janela de cancelamento, expiração, créditos e exceções por contrato. Fórmula de medição, competência, preços e aprovação pelo RH. Limites de acesso da coordenação e visibilidade de turmas compartilhadas. Escopo mínimo do primeiro piloto real, responsáveis, orçamento, ambiente e janela de migração. Retenção, anonimização, restore, suporte e resposta a incidentes. Essas pendências serão tratadas na especificação da fase correspondente; não impedem a revisão desta constituição. ", "formato": ".md"}, {"titulo": "Plano de execução verificável", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/tasks.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/tasks.html", "texto": " Plano de execução verificável Preservar baseline e hashes das fontes; executar testes originais. Registrar requisitos, critérios e decisões antes das alterações de comportamento. Modularizar domínio e UI preservando reexports e contratos usados nos testes. Corrigir ENG-01/02/03 e escrever regressões executadas também contra original. Corrigir ENG-04 e verificar no navegador. Corrigir ENG-05 por migração incremental e ampliar teste SQL. Adicionar CI, instruções operacionais e comandos de validação. Executar comparação, registrar evidências e limitações, produzir relatório lado a lado. Estado de conclusão e comandos efetivamente executados: reports/validation.json e reports/*.log. ", "formato": ".md"}, {"titulo": "PRD.md", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/prd-md-4e6ccc93/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/prd-md-4e6ccc93/conteudo.html", "texto": " Sumário do documento 1. Contexto e Problema 2. Objetivo do Produto 3. Público-Alvo e Personas 4. Arquitetura de Versões do Sistema 4.1. Versão do Aluno (Mobile-First / Web) 4.2. Versão Administrativa (ADM / Escola / RH) 5. Hipóteses e Evidências 6. Métricas de Sucesso (KPIs) 7. Escopo do Projeto Dentro do Escopo Fora do Escopo 8. Modelo de Dados — Estrutura da Base de Alunos 9. Requisitos Funcionais 10. Requisitos Não-Funcionais 11. Análise de Riscos e Mitigações 12. Premissas do Projeto 13. Questões em Aberto PRD.md Índice da biblioteca Fonte: Vibe Coding Executivo/PRD.md.docx SHA-256: 4e6ccc93f384d3aadc0d982e88d37c97cbe18aa6697c2a400ad5e7c6b9bb5c91 Conversão do DOCX com títulos, listas, tabelas e imagens incorporadas. A paginação original não é preservada. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. Sistema de Gestão Plataforma B2B — SpeakUp Idiomas 1. Contexto e Problema A Speak Up Idiomas atende atualmente mais de 800 alunos corporativos B2B e enfrenta sérias limitações operacionais decorrentes do uso de planilhas manuais, canais descentralizados (WhatsApp) e um sistema legado lento com baixa usabilidade mobile. O modelo operacional vigente gera: Retrabalho constante: Mais de 15 horas semanais consumidas na coordenação pedagógica. Conflitos de agenda: Erros e sobreposições na alocação de docentes. Opacidade de dados: Baixa visibilidade em tempo real para os gestores de RH das empresas clientes. Gargalos financeiros: Atrasos na medição contratual e no faturamento mensal. Riscos operacionais: Vulnerabilidades de compliance e não conformidade com a LGPD. 2. Objetivo do Produto Desenvolver uma plataforma web e mobile integrada para administrar de ponta a ponta a operação B2B da Speak Up Idiomas. O sistema deve promover: Autonomia total no autoatendimento do aluno via interface mobile. Gestão eficiente e automatizada de turmas e docentes para a equipe pedagógica. Controle consolidado e em tempo real de frequência, evolução pedagógica e medição financeira para os gestores de RH corporativos. 3. Público-Alvo e Personas Beatriz (Aluno Corporativo) Necessidade: Autonomia mobile para agendar, cancelar e remarcar aulas em até 3 cliques, sincronização nativa com agenda corporativa e acompanhamento claro do seu progresso na escala CEFR. Marina (Coordenadora Pedagógica) Necessidade: Eliminar planilhas manuais, gerenciar com precisão mais de 830 alunos, 120 turmas e 35 professores sem choque de horários, automatizando o remanejamento e a substituição de docentes. Rodrigo (Gestor de RH / Cliente B2B) Necessidade: Visibilidade em tempo real sobre frequência e evolução dos colaboradores para comprovação de ROI, facilidade em auditorias de coparticipação e aprovação de faturamento sem atrasos. 4. Arquitetura de Versões do Sistema ┌─────────────────────────────────┐ │ Plataforma SpeakUp Idiomas │ └────────────────┬────────────────┘ │ ┌───────────────────────┴───────────────────────┐ ▼ ▼ ┌───────────────────────────────────┐ ┌───────────────────────────────────┐ │ Versão do Aluno │ │ Versão Administrativa (ADM) │ │ (App Mobile / Portal) │ │ (Web Dashboard / RH / ADM) │ ├───────────────────────────────────┤ ├───────────────────────────────────┤ │ • Autoatendimento (&lt;= 3 cliques) │ │ • Gestão Pedagógica &amp; Turmas │ │ • Agendamentos e Cancelamentos │ │ • Alocação e Prevenção Conflitos │ │ • Consulta de Presença e CEFR │ │ • Importação de Alunos (19 cols) │ │ │ │ • Portal B2B / RH &amp; Faturamento │ ├───────────────────────────────────┤ ├───────────────────────────────────┤ │ Autenticação: │ │ Autenticação: │ │ Login: `id_aluno` (Matrícula) │ │ Login: E-mail Corporativo │ │ Senha Padrão: `Escola@@@` │ │ Senha Individual / SSO Corporativo│ └───────────────────────────────────┘ └───────────────────────────────────┘ 4.1. Versão do Aluno (Mobile-First / Web) Foco: Autoatendimento, agendamentos, cancelamentos, consulta de aulas, presença e perfil do aluno. Regras de Acesso: Autenticação simplificada utilizando o campo id_aluno (número de matrícula) como login e a senha padrão fixa Escola@@@. 4.2. Versão Administrativa (ADM / Escola / RH) Foco: Painel de coordenação pedagógica, alocação de grade docente, gestão de turmas, relatórios B2B e administração da base de alunos. Regras de Acesso: Autenticação corporativa segura via login (e-mail institucional) e senha individual cadastrada (com suporte opcional a SSO via Azure AD/Okta). 5. Hipóteses e Evidências Hipótese 1: Fornecer autonomia de autoatendimento mobile reduzirá o absenteísmo e os chamados no suporte via WhatsApp. Evidência: Entrevistas P-06/P-08 indicaram perda de créditos e frustração do aluno devido ao tempo de resposta do suporte manual. Hipótese 2: A automação da grade de horários reduzirá em 80% o tempo gasto pela coordenação na resolução de conflitos. Evidência: Entrevistas P-01/P-02/P-03 apontaram que a coordenação gasta mais de 15 horas semanais operando planilhas mestres sujeitas a falhas humanadas. Hipótese 3: Disponibilizar dashboard de frequência e faturamento B2B em tempo real elimina ruídos nas auditorias de RH. Evidência: Entrevistas P-04/P-10 demonstraram a exigência dos gestores de RH por relatórios imediatos, sem a necessidade de aguardar o fechamento mensal. 6. Métricas de Sucesso (KPIs) Eficiência Operacional: Redução de 80% no tempo gasto pela coordenação na montagem e remanejamento da grade. Adoção do Aluno: 90%+ das ações de agendamento e cancelamento realizadas diretamente via autoatendimento mobile (&lt;= 3 cliques). Agilidade Financeira: Emissão e aprovação da medição de faturamento B2B em 1 clique até o 1º dia útil do mês. Performance: SLA de disponibilidade do sistema de 99,5% e tempo de resposta &lt;= 2 segundos sob picos de acesso. 7. Escopo do Projeto Dentro do Escopo Autoatendimento mobile para alunos (agendamento, cancelamento, reposição e saldo de créditos). Gestão e automação da grade docente com prevenção algorítmica de conflitos de agenda. Módulo Administrativo com Carga em Lote de Alunos (Importação via Excel .xlsx / .csv) . Painel B2B para RH com acompanhamento de frequência, evolução CEFR e consolidação de medição. Registro digital de presença e disparos automatizados de notificações. Estruturação estrita do cadastro de alunos baseada nas 19 colunas oficiais. Fora do Escopo Módulos de gamificação avançada ou criação de conteúdos/cursos próprios dentro do app. Gateway de pagamento B2C direto por cartão de crédito no app (foco exclusivo em faturamento B2B). Gestão financeira completa de folha de pagamento de professores (apenas apuração de horas ministradas). 8. Modelo de Dados — Estrutura da Base de Alunos A entidade de alunos na versão ADM e no arquivo de importação em lote deve seguir rigorosamente o esquema de 19 colunas oficiais descrito abaixo: # Nome da Coluna Tipo de Dado Regra de Negócio / Descrição 1 id_aluno Texto / Inteiro Identificador único / Matrícula (Login do Aluno) 2 nome Texto Nome completo do aluno 3 email Texto E-mail corporativo ou pessoal 4 data_nascimento Data (YYYY-MM-DD) Data de nascimento 5 idade Numérico Inteiro Idade calculada ou informada 6 genero Texto / Sigla Identificação de gênero 7 unidade Texto Unidade, campus ou polo 8 cidade Texto Cidade da unidade ou residência 9 estado Texto (UF) Sigla do Estado (2 caracteres) 10 canal_aquisicao Texto Canal de entrada/venda B2B 11 nivel_curso Texto Nível de proficiência (ex: Basic, CEFR A1-C2) 12 modalidade Texto Presencial ou Online 13 turno Texto Manhã, Tarde ou Noite 14 plano Texto Tipo de contrato (Semestral, Anual, etc.) 15 desconto_percentual Numérico (Decimal) Percentual de desconto ou subsídio 16 data_matricula Data (YYYY-MM-DD) Data de início do vínculo 17 status_matricula Texto Status (Ativa, Cancelada, Trancada, Pausada) 18 data_cancelamento Data (YYYY-MM-DD) Data de cancelamento (opcional) 19 Valor Mensalidade Moeda (Decimal) Valor financeiro mensal em BRL 9. Requisitos Funcionais ID Requisito Prioridade Módulo Descrição Funcional RF-01 Gestão de Grade P0 ADM / Pedagógico Montagem e conciliação de grade horária com validação algorítmica contra sobreposição de agendas. RF-02 Autoatendimento P0 Aluno / Mobile Fluxo de agendamento, cancelamento e remarcação em até 3 cliques. Autenticação via id_aluno e senha Escola@@@. RF-13 Importação Excel P0 ADM / Sistema Upload e validação em lote de arquivos .xlsx/.csv estruturados estritamente nas 19 colunas oficiais. RF-05 Registro de Presença P0 Professor / ADM Chamada digital em tempo real com consolidação instantânea do índice de frequência. RF-06 Portal do RH B2B P0 B2B / RH Dashboard corporativo para acompanhamento de frequência, indicadores operacionais e aprovação de medições. RF-03 Gestão de Créditos P1 Aluno / ADM Regras parametrizadas de saldo, prazos de expiração e políticas de cancelamento prévio. RF-04 Notificações P1 Sistema Disparo de alertas push/e-mail para lembretes de aula e alterações na grade com integração de calendário. RF-08 Medição e Fatura P1 ADM / B2B Consolidação e geração da planilha de medição mensal em 1 clique para aprovação do RH. RF-09 Substituição P1 ADM / Pedagógico Algoritmo de recomendação de professores substitutos disponíveis em caso de ausência. RF-07 Evolução CEFR P2 Aluno / B2B Mapeamento do histórico de proficiência alinhado ao quadro comum europeu (CEFR). RF-10 Integrações P2 Arquitetura Conectores para autenticação SSO (Azure AD/Okta) e exportação de dados para ERPs. RF-12 Trilha de Auditoria P2 Segurança Registros imutáveis de alterações em cadastros, abonos e remanejamentos de aulas. 10. Requisitos Não-Funcionais RNF-01 (Usabilidade): Interface mobile-first otimizada para o perfil do aluno, garantindo a conclusão das tarefas principais em no máximo 3 cliques. RNF-02 (Desempenho): Tempo de resposta do servidor de no máximo 2 segundos para relatórios e consultas em horários de pico. RNF-03 (Disponibilidade): Disponibilidade mínima de 99,5% (SLA) operando em regime 24/7. RNF-04 (Segurança e LGPD): Criptografia de dados sensíveis em trânsito (TLS 1.3) e em repouso (AES-256), atendendo integralmente à LGPD. RNF-05 (Controle de Acesso): Controle de acesso baseado em papéis (RBAC) para os perfis: Aluno, Professor, Coordenação ADM e Gestor RH. RNF-06 (Escalabilidade): Suporte arquitetural para até 5.000 usuários ativos sem degradação de performance. RNF-07 (Auditabilidade): Manutenção de logs auditáveis e imutáveis por no mínimo 12 meses. 11. Análise de Riscos e Mitigações Risco 1: Inconsistência nos Dados Legados Descrição: Dados incorretos ou incompletos nas planilhas históricas de alunos durante a migração. Mitigação: Implementar validador rigoroso no módulo de importação (RF-13), com relatório detalhado de erros apontando linha e coluna exatas antes da persistência. Risco 2: Baixa Adesão dos Docentes ao Registro de Presença Descrição: Atrasos dos professores no preenchimento do diário de classe digital impactando a visão do RH. Mitigação: Envio de lembretes automáticos pós-aula e condicionamento do cômputo de horas ministradas ao registro efetivo da chamada. 12. Premissas do Projeto A senha inicial padrão para todos os alunos importados será obrigatoriamente Escola@@@. O identificador de login do aluno no app será estritamente o seu código de matrícula (id_aluno). O faturamento B2B baseia-se na consolidação mensal das aulas efetivamente agendadas/realizadas, validadas pela gestão de RH. 13. Questões em Aberto Política de Cancelamento: Qual a janela exata de antecedência mínima necessária para cancelamento sem perda de crédito em aulas individuais (VIP) versus turmas em grupo (3 a 5 alunos)? Plano de Migração: Qual será o cronograma e a janela de execução para o saneamento e carga inicial dos 830 alunos legados? ", "formato": ".docx"}, {"titulo": "PRD.md.docx", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/prd-md-docx-836d5542/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/prd-md-docx-836d5542/conteudo.html", "texto": " PRD.md.docx Índice da biblioteca Fonte: Vibe Coding Executivo/speakup-sdd/specs/sources/PRD.md.docx.txt SHA-256: 836d5542170aed6c386fc906f21ba61eae02393471547e731f889817e92e7014 Transcrição textual integral; não é resumo. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. Documento de Requisitos de Produto (PRD) Sistema de Gestão Plataforma B2B — SpeakUp Idiomas 1. Contexto e Problema A Speak Up Idiomas atende atualmente mais de 800 alunos
