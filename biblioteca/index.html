 / possíveis requisitos Resposta completa do Gemini Síntese / evidências observadas Copiar pergunta para Gemini Salvo localmente P-07 Progresso e usabilidade Beatriz Souza Pergunta planejada Objetivo: Extrair requisitos de acompanhamento, experiência, mobile e usabilidade. Persona(s) que respondeu(ram) Tags / possíveis requisitos Resposta completa do Gemini Síntese / evidências observadas Copiar pergunta para Gemini Salvo localmente P-08 Falhas e exceções Todas as personas Pergunta planejada Objetivo: Identificar fluxos de exceção, alertas, auditoria, segurança e consistência. Persona(s) que respondeu(ram) Tags / possíveis requisitos Resposta completa do Gemini Síntese / evidências observadas Copiar pergunta para Gemini Salvo localmente P-09 Qualidade e RNFs Todas as personas Pergunta planejada Objetivo: Obter RNFs mensuráveis sem inventar metas. Persona(s) que respondeu(ram) Tags / possíveis requisitos Resposta completa do Gemini Síntese / evidências observadas Copiar pergunta para Gemini Salvo localmente P-10 Prioridade e sucesso Todas as personas Pergunta planejada Objetivo: Priorizar o MVP e obter critérios de sucesso de negócio. Persona(s) que respondeu(ram) Tags / possíveis requisitos Resposta completa do Gemini Síntese / evidências observadas Copiar pergunta para Gemini Salvo localmente 6. Requisitos Funcionais Use o padrão da aula: “O sistema DEVE + verbo de ação + complemento + condição quando necessária.” O exercício exige no mínimo 8 RFs, critério de aceitação e origem. ID Requisito Critério de aceitação Origem P/Persona + Adicionar RF 7. Requisitos Não Funcionais Registre somente metas sustentadas pelas respostas. O exercício pede no mínimo 5 categorias distintas, como desempenho, segurança, usabilidade, escalabilidade, disponibilidade, manutenibilidade ou portabilidade. ID Categoria Descrição mensurável Justificativa / origem + Adicionar RNF 8. Salvar e levar ao Codex/Gemini Os campos são salvos automaticamente no localStorage do navegador. Você também pode exportar um backup JSON, importar depois, copiar o roteiro das 10 perguntas ou imprimir/salvar em PDF. Copiar as 10 perguntas Exportar JSON Importar JSON Imprimir / PDF Limpar dados Dica: mantenha o HTML e o JSON de backup juntos no seu projeto do Codex. Depois da entrevista, use as evidências para preencher RF/RNF — sem antecipar respostas das personas. ", "formato": ".html"}, {"titulo": "SpeakUp_Requisitos_Antonio_Figueiredo", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "biblioteca/21/speakup-requisitos-antonio-figueiredo-5433d46b/conteudo.md", "html": "biblioteca/leitura/biblioteca/21/speakup-requisitos-antonio-figueiredo-5433d46b/conteudo.html", "texto": " Sumário do documento P-01 P-02 P-03 P-04 P-05 P-06 P-07 P-08 P-09 P-10 SpeakUp_Requisitos_Antonio_Figueiredo Índice da biblioteca Fonte: Vibe Coding Executivo/SpeakUp_Requisitos_Antonio_Figueiredo.docx SHA-256: 5433d46b15d8ddfe00e972b43b5f78809e7ff37f50b6bd9e133bf6a9eda91e50 Conversão do DOCX com títulos, listas, tabelas e imagens incorporadas. A paginação original não é preservada. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. EXERCÍCIO INDIVIDUAL DE DISCOVERY Caso Speak Up Idiomas — Levantamento de Requisitos via Entrevista Simulada Aluno: Antonio Figueiredo Disciplina: Vibe Coding para Executivos | FIAP 1. Contexto e objetivo A Speak Up Idiomas possui mais de 800 alunos corporativos e enfrenta limitações decorrentes de processos manuais, planilhas, canais descentralizados e um sistema legado. O Discovery foi conduzido para compreender as perspectivas da operação pedagógica, do cliente corporativo e do aluno, transformando evidências da entrevista em requisitos funcionais e não funcionais rastreáveis. Problem Statement: A Speak Up Idiomas precisa de uma forma integrada de administrar sua operação B2B, permitindo que alunos, equipe pedagógica e empresas clientes gerenciem aulas, frequência, evolução e informações contratuais com autonomia e rastreabilidade, porque o modelo atual gera retrabalho, conflitos, baixa visibilidade e riscos operacionais e de compliance. 2. Fluxo integrado de desenvolvimento Design Thinking / Design Sprint (Descoberta) → Lean Startup / Lean Inception (Estratégia) → PBB — Product Backlog Building (Refinamento) → Agile / Scrum (Entrega). Neste exercício, a ênfase está na Descoberta: entender o problema antes de prescrever a solução. As evidências coletadas alimentam requisitos, priorização e futuros itens de backlog/MVP. 3. Registro da entrevista P-01 Pergunta: Descrevam, do início ao fim, como funciona hoje a jornada de um aluno corporativo — da entrada no programa até o acompanhamento de sua evolução — indicando onde entram planilhas, tarefas manuais, retrabalho, atrasos e os principais problemas. Persona(s): Beatriz, Marina e Rodrigo Resposta (síntese): Fluxo manual desde matrícula até relatório de presença no 5º dia útil; uso de Excel, baixa visibilidade do RH e comunicação informal por WhatsApp. P-02 Pergunta: Como você organiza hoje turmas, horários e alocação de professores? Quais situações mais geram conflitos ou retrabalho e o que acontece quando há troca ou ausência de professor? Persona(s): Marina Resposta (síntese): Planilha mestre complexa, conflitos em aulas VIP, falta de aviso ao aluno em substituições e registro manual de absenteísmo. P-03 Pergunta: Quais volumes você administra hoje — alunos, professores, turmas e aulas —, quais picos de operação existem e quais informações precisa acompanhar para avaliar ocupação e risco de evasão? Persona(s): Marina Resposta (síntese): Operação com 830 alunos, 120 turmas, 35 professores e cerca de 500 aulas/semana; picos em virada de mês/semestre e acompanhamento reativo de evasão. P-04 Pergunta: Como você acompanha atualmente a participação e evolução dos funcionários, quais indicadores e relatórios precisa receber, com que frequência e como usa essas informações para avaliar orçamento, compliance e ROI? Persona(s): Rodrigo Resposta (síntese): Necessidade de relatórios em tempo real, proficiência, comprovação de ROI e aplicação de regras de coparticipação contratual. P-05 Pergunta: Quais sistemas da empresa deveriam trocar informações com a Speak Up, quais dados precisam circular e quais regras de acesso, privacidade ou aprovação devem ser respeitadas? Persona(s): Rodrigo Resposta (síntese): Integrações com RH/Folha (TOTVS/SAP), SSO (Azure AD/Okta), ERP/faturamento, LGPD e controle de acesso por papéis. P-06 Pergunta: Conte como você agenda e acompanha suas aulas hoje. O que acontece quando precisa faltar, remarcar ou repor uma aula, como recebe comunicações e quais dificuldades enfrenta? Persona(s): Beatriz Resposta (síntese): Sistema legado lento, baixa responsividade mobile, perda de créditos por demora no WhatsApp e falta de sincronização com agendas corporativas. P-07 Pergunta: Como o aluno acompanha seu progresso e quais informações são úteis? Em quais dispositivos e situações essas informações precisam ser acessadas? Persona(s): Beatriz e Marina Resposta (síntese): Necessidade de visão de proficiência CEFR, histórico de tópicos, acesso mobile em até 3 cliques e histórico centralizado na troca de docentes. P-08 Pergunta: Quando algo dá errado — conflito de agenda, falta, informação incorreta, atraso de relatório ou falha de comunicação — como descobrem o problema, quem age e qual o impacto? Persona(s): Beatriz, Marina e Rodrigo Resposta (síntese): Aulas perdidas geram frustração, trabalho reativo da coordenação e ruídos em auditorias e no relacionamento com o RH. P-09 Pergunta: Quais expectativas são indispensáveis quanto a tempo de resposta, disponibilidade, usuários simultâneos, segurança, facilidade de uso e continuidade do serviço? Persona(s): Rodrigo, Marina e Beatriz Resposta (síntese): SLA de 99,5%, suporte a 3.000–5.000 usuários simultâneos, respostas em até 2 segundos, mobile-first e logs imutáveis por 12 meses. P-10 Pergunta: Quais problemas devem ser priorizados e quais resultados mensuráveis fariam vocês afirmar que o novo sistema resolveu o problema? Persona(s): Beatriz, Marina e Rodrigo Resposta (síntese): Prioridades: autonomia mobile e redução de faltas punitivas; automação da grade e eliminação de choques; dashboard em tempo real e faturamento em 1 clique. 4. Diagnóstico consolidado Ineficiência e retrabalho no backoffice: mais de 15 horas semanais são consumidas com planilhas de turmas, faltas e remanejamentos, com conflitos de agenda e impacto no fechamento financeiro. Experiência do aluno fragmentada: baixa autonomia mobile, ausência de sincronização de calendários e risco de perda de crédito por dependência de atendimento manual. Baixa visibilidade e risco de compliance para clientes B2B: frequência e evolução chegam tardiamente ao RH, dificultando auditoria, coparticipação e comprovação de ROI. Falta de integração: não há fluxo automatizado adequado entre aprendizagem, RH/Folha, identidade corporativa e faturamento. 5. Requisitos Funcionais ID Requisito Descrição Critério de Aceitação Origem RF-01 Gestão de grade e alocação O sistema DEVE montar e conciliar a grade de horários, alocando professores conforme nível, disponibilidade e formato da turma, sem sobreposição de agendas. Ao confirmar uma alocação, o sistema deve bloquear qualquer combinação que gere conflito de professor ou turma e apresentar alternativas disponíveis. P-02/P-03 — Marina RF-02 Autoatendimento de agenda O sistema DEVE permitir que o aluno autenticado agende, cancele ou remarque aulas, respeitando regras parametrizadas de antecedência e contrato. Dada uma aula elegível, o aluno deve conseguir selecionar uma opção disponível, confirmar a alteração e visualizar imediatamente a agenda atualizada. P-06 — Beatriz RF-03 Créditos e reposições O sistema DEVE controlar saldo de créditos, faltas e regras de reposição por aluno e empresa cliente. Após cancelamento/falta, o saldo deve ser atualizado automaticamente conforme a regra contratual e manter o motivo registrado. P-06/P-08 — Beatriz RF-04 Notificações O sistema DEVE enviar notificações de confirmação, lembrete e alteração de aula por canais configurados e calendário integrado. Ao alterar professor ou horário, os usuários afetados devem receber aviso e a agenda sincronizada deve refletir a alteração. P-02/P-06 — Marina/Beatriz RF-05 Presença e absenteísmo O sistema DEVE permitir registro digital de presença, falta justificada e falta não justificada, mantendo histórico por aula. Após a chamada, o status de cada aluno deve ficar disponível no histórico e nos relatórios autorizados sem necessidade de digitação em planilha externa. P-01/P-02/P-04 — Marina/Rodrigo RF-06 Portal do cliente B2B O sistema DEVE disponibilizar painel para gestores autorizados acompanharem frequência, proficiência, ocupação, alunos ativos e indicadores do programa. O gestor de RH autenticado deve visualizar apenas dados de sua empresa e consultar indicadores atualizados sem aguardar fechamento manual mensal. P-04/P-05 — Rodrigo RF-07 Evolução pedagógica O sistema DEVE registrar nivelamento, evolução CEFR, tópicos ministrados e feedbacks, preservando histórico entre trocas de professor. Ao abrir o perfil pedagógico, aluno e profissionais autorizados devem visualizar a evolução e o histórico permitido de aulas/tópicos. P-07 — Beatriz/Marina RF-08 Faturamento e medição O sistema DEVE consolidar aulas contratadas e realizadas para apoiar medição mensal e aprovação do faturamento pelo cliente. O gestor autorizado deve selecionar o período, visualizar a consolidação e executar a aprovação da medição em uma única ação. P-04/P-10 — Rodrigo RF-09 Substituição de professores O sistema DEVE permitir remanejamento de professor em caso de ausência, sugerindo docentes disponíveis e registrando a substituição. Ao substituir um professor, o sistema deve evitar conflito de agenda, manter o histórico da troca e notificar os alunos afetados. P-02/P-08 — Marina RF-10 Integrações corporativas O sistema DEVE integrar dados autorizados com sistemas corporativos de RH/Folha, identidade, ERP/faturamento e calendários. Para uma integração configurada, o sistema deve transmitir/receber apenas os campos autorizados, registrar sucesso ou falha e permitir rastrear a operação. P-05/P-06 — Rodrigo/Beatriz RF-11 Elegibilidade e ciclo do aluno O sistema DEVE permitir cadastrar, ativar, pausar e inativar alunos corporativos, preservando histórico e liberando vagas quando aplicável. Ao inativar um aluno, novos agendamentos devem ser impedidos, o histórico deve permanecer disponível a perfis autorizados e a vaga deve ser liberada conforme regra. P-01/P-04 — Rodrigo RF-12 Auditoria O sistema DEVE registrar alterações de agenda, abonos de faltas, substituições e mudanças manuais relevantes com usuário, data/hora e valores envolvidos. Uma ação auditável deve gerar registro consultável por perfil autorizado e não deve apagar o histórico anterior. P-05/P-08/P-09 — Rodrigo/Marina 6. Requisitos Não Funcionais ID Categoria Descrição do Requisito Justificativa / Origem RNF-01 Usabilidade A interface do aluno deve ser mobile-first e responsiva, permitindo executar as ações principais, como reagendamento, em até 3 cliques. P-07/P-09 — Beatriz RNF-02 Desempenho Consultas de grade, agendamentos e carregamento de painéis devem responder em até 2 segundos nos cenários de pico definidos na entrevista. P-09 — Rodrigo/Marina/Beatriz RNF-03 Disponibilidade Os portais operacionais devem possuir disponibilidade mínima de 99,5% em regime 24/7. P-09 — Rodrigo/Marina/Beatriz RNF-04 Segurança e privacidade Dados pessoais devem ser protegidos em trânsito e em repouso, com tratamento compatível com as exigências de LGPD relatadas no Discovery. P-05 — Rodrigo RNF-05 Controle de acesso O sistema deve aplicar controle de acesso baseado em papéis, separando permissões de aluno, professor, coordenação, administração da escola e gestor de RH. P-05 — Rodrigo RNF-06 Escalabilidade A solução deve suportar crescimento até 5.000 usuários e picos simultâneos informados no Discovery sem degradação que viole o requisito de desempenho. P-03/P-09 — Marina/Rodrigo RNF-07 Auditabilidade Logs de operações críticas devem ser mantidos de forma imutável por pelo menos 12 meses e acessíveis somente a perfis autorizados. P-08/P-09 — Rodrigo/Marina/Beatriz 7. Priorização inicial para MVP Com base na P-10, a primeira versão deve priorizar: (1) autonomia mobile do aluno para agenda e reposições; (2) automação da grade e prevenção de conflitos de professores; (3) registro de presença e notificações; (4) dashboard B2B em tempo próximo do real; e (5) consolidação de medição/faturamento. Essa priorização deve ser refinada em PBB/Product Backlog Building antes da implementação. 8. Gaps e riscos para uma próxima rodada de Discovery Regras de cancelamento e crédito em turmas de 3 a 5 alunos. Onboarding, diário de classe, contratos e pagamentos dos 35 professores. Estratégia e critérios de migração do histórico de 800+ alunos e das planilhas existentes. Métricas de qualidade pedagógica e satisfação, como CSAT/NPS. RTO/RPO e política de backup não foram suficientemente definidos nas respostas; não devem ser tratados como requisito confirmado sem nova evidência. 9. Conclusão O Discovery evidencia que o principal risco não é apenas tecnológico, mas operacional: o crescimento da Speak Up está apoiado em processos manuais que não escalam. A entrevista produziu evidências suficientes para formular uma primeira versão rastreável de requisitos. Os requisitos acima devem seguir para refinamento, priorização e validação antes da construção do MVP, preservando o princípio central da aula: entender e validar o problema antes de acelerar a solução. ", "formato": ".docx"}, {"titulo": "Stack e restrições — SpeakUp", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/tech-stack.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/specs/tech-stack.html", "texto": " Sumário do documento Base preservada Runtime, dependências e reprodução Estrutura existente Segurança e integração Verificação disponível Restrições operacionais e lacunas Hierarquia de referência Stack e restrições — SpeakUp Data: 19/10/2026. Estado: constituição proposta para revisão humana. Base preservada Interface: React e React DOM, JavaScript/JSX, CSS, aplicação web responsiva. Desenvolvimento e build: Vite; diretório de saída dist/ . Backend conectado: Supabase Auth, cliente Supabase JS, PostgreSQL e funções RPC; Edge Function de login do aluno em TypeScript/Deno. Importação: parser CSV local e read-excel-file para XLSX, carregado sob demanda. Demonstração: dados fictícios e persistência local com namespace próprio da versão SDD. Não há decisão de migrar a aplicação inteira para TypeScript, trocar framework, criar microserviços ou escolher hospedagem. Essas expansões exigem especificação posterior. Runtime, dependências e reprodução O manifesto atual exige Node &gt;=22.12.0. A execução registrada utilizou Node 24.15.0; padronizar uma linha suportada para os ambientes futuros durante a especificação de ambiente. A versão SDD utiliza npm e package-lock.json ; instalar com npm ci . A origem usa pnpm, e seu lock foi preservado em ../reports/original-pnpm-lock.yaml . As versões efetivamente instaladas constam em ../reports/dependencies.json . Os testes comparativos anteriores usaram as mesmas dependências instaladas para os dois códigos. Não reproduzem exatamente o lock pnpm original. Não alterar essa ressalva nem tratar uma atualização futura de dependências como parte invisível da comparação. O HTML deve continuar em português brasileiro. Eventos de calendário são instantes com fuso explícito; datas civis usam YYYY-MM-DD; dinheiro usa tipo decimal exato no banco. Matrícula é identificador textual e deve preservar zeros iniciais. As 19 colunas oficiais permanecem regidas pelo PRD/PSS. Estrutura existente src/main.jsx entrada e inicialização src/App.jsx estado e composição; ainda concentra algumas telas src/domain/ importação, agenda e indicadores src/application/ caso de uso de mutação demo src/infrastructure/ configuração e cliente Supabase src/features/ login e importação src/ui/ modal compartilhado supabase/migrations/ migração original e correção incremental supabase/functions/ login do aluno tests/ domínio, configuração, SQL e navegador docs/operations.md instruções e pendências operacionais reports/ comparação, capturas, logs e hashes specs/ memória do projeto Não se presume que essa organização já concluiu a modularização de App.jsx. Segurança e integração PostgreSQL mantém a autoridade de autorização/integridade; revisar grants, RLS e funções SECURITY DEFINER em conjunto. Manter search_path explícito e validação de papel e vínculo dentro das RPCs privilegiadas. Service role somente em backend/terminal autorizado; nunca em variáveis VITE, interface, fixtures ou logs. Nenhuma variável Supabase: demo. Configuração parcial: erro visível. Par configurado: inicializar backend antes da aplicação. A migração de 19/10 restringe a ocupação informada ao RH; não representa anonimização formal de todos os metadados. A senha compartilhada, rate limiting distribuído, recuperação de conta e ciclo de sessão exigem especificação e validação antes de produção. CORS não substitui autenticação; PGlite não substitui teste de Auth, Edge, rede ou sessões concorrentes reais. Verificação disponível npm test npm run build npm run format:check npx playwright install chromium npm run test:e2e Há Node Test Runner, PGlite, Playwright/Chromium e Prettier. Prettier verifica formato, não tipos ou lint semântico. O workflow GitHub Actions está definido, mas não foi executado remotamente. A pasta de trabalho não era um repositório Git na inspeção anterior. Esta etapa altera somente Markdown; usa os resultados anteriores como histórico, sem apresentá-los como uma nova execução. Não acrescenta runtime, dependências, scripts ou integrações à skill, que é Markdown-only. Restrições operacionais e lacunas Backend de produção, região, domínios, política de segredos, notificações e calendário não estão provisionados por esta entrega. workspace_data ainda retorna coleções completas autorizadas; paginação é local. Atualização entre usuários, telemetria de serviço, carga, concorrência em múltiplas conexões, backup/restore e retenção externa permanecem sem comprovação. Mudanças de contratos RPC devem incluir compatibilidade da interface, migração revisável e reversão planejada. Não executar migrações, provisionar usuários ou promover para produção por consequência automática da escrita de specs. Hierarquia de referência Decisões explícitas do responsável e requisitos confirmados do produto. Constituição revisada: mission.md, tech-stack.md e roadmap.md. Specs futuras em YYYY-MM-DD-feature-name/ , revisadas antes de implementação. Artefatos anteriores requirements.md, acceptance.md, decisions.md e tasks.md: histórico técnico ainda útil; conflitos serão reconciliados em etapa posterior, sem reescrever a história dos testes. ", "formato": ".md"}, {"titulo": "Vibe Coding Executivo", "disciplina": "21", "grupo": "Vibe Coding Executivo", "markdown": "disciplinas/21-vibe-coding-executivo/README.md", "html": "biblioteca/leitura/disciplinas/21-vibe-coding-executivo/README.html", "texto": " Sumário do documento Navegação Projetos e materiais identificados Atualização Vibe Coding Executivo Turma 4ABL · MBA AI Leadership · Organização: 21 · Status: com-projetos . Rótulo transcrito da imagem; códigos numéricos servem somente à organização. Navegação Aulas Projetos Entregas Referências Projetos e materiais identificados SpeakUp: original e SDD : piloto local; constituição em revisão. Discovery SpeakUp : material disponível; sem comprovação de entrega. Atualização Registre novos encontros por data e projetos por nome estável. Use os modelos em ../../templates/ . Material encontrado não significa aula cursada, conclusão de disciplina ou entrega registrada no portal. ", "formato": ".md"}, {"titulo": "Biblioteca de leitura e consulta", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "docs/biblioteca.md", "html": "biblioteca/leitura/docs/biblioteca.html", "texto": " Sumário do documento Conteúdo e fidelidade Atualização Biblioteca de leitura e consulta Abrir biblioteca HTML com busca · Navegar em Markdown pelo GitHub O índice reúne os documentos Markdown existentes e as conversões dos materiais do curso. A busca HTML consulta títulos e conteúdo completo, funciona sem servidor e permite filtrar por disciplina. No GitHub, use o índice Markdown: os arquivos .md são apresentados como páginas de leitura, com tabelas, imagens e links. Para consultar pelo navegador local, abra biblioteca/index.html ou o portal principal. Conteúdo e fidelidade DOCX: títulos, parágrafos, listas, tabelas e imagens incorporadas, via Pandoc. PDF: extração de texto e imagem de cada página, para consultar também figuras e diagramas. Texto presente apenas nas imagens não participa da busca; não foi executado OCR. PPTX: texto, tabelas, imagens incorporadas e notas por slide; layouts, gráficos e SmartArt não são reproduzidos integralmente. XLSX: células e fórmulas por planilha, sem executar fórmulas ou reproduzir gráficos. Notebooks: células e saídas textuais gravadas, sem executar o código. Imagens: incorporadas em páginas Markdown para consulta visual, sem OCR. TXT e HTML: conteúdo textual; scripts das aplicações não são executados. Markdown: versões existentes são reutilizadas sempre que já importadas; nenhuma baseline de aplicação é alterada. As conversões são transcrições, não resumos. Nenhum arquivo original é apagado. Entradas de conteúdo binário idêntico compartilham uma conversão; as origens ficam registradas em catalogo/biblioteca.json . Não se declara equivalência entre versões diferentes apenas pelo nome. O catálogo de pendências indica as fontes que ainda não puderam ser lidas ou convertidas; não confundir a importação anterior de binários com cobertura textual integral. Materiais de aula e de terceiros permanecem atribuídos às fontes e aos respectivos titulares. O repositório continua privado. Imagens são extraídas apenas quando incorporadas nos formatos compatíveis; referências não resolvidas ficam registradas no catálogo e no texto original. Atualização Instale Pandoc e Poppler, além das dependências Python listadas em tools/requirements-library.txt . Os passos abaixo são executados na raiz do repositório: python3 tools/ingest_library.py --source /caminho/para/MBAAILEADERSHIP python3 tools/build_portal.py python3 tools/build_library.py python3 tools/validate_library.py python3 tools/validate_repo.py O conversor não abre placeholders do OneDrive: mantenha as fontes no dispositivo e aguarde sua sincronização. Uma conversão existente continua disponível quando o original é posteriormente removido do armazenamento local pelo OneDrive. A ferramenta não publica automaticamente no GitHub nem expõe um site público. Confira as alterações antes de fazer commit e push. O HTML é gerado para consulta local. No GitHub, arquivos HTML são exibidos como código; a leitura navegável usa os índices Markdown. Não foi ativado GitHub Pages nem alterada a visibilidade do repositório. ", "formato": ".md"}, {"titulo": "Como manter o portfólio", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "CONTRIBUTING.md", "html": "biblioteca/leitura/CONTRIBUTING.html", "texto": " Como manter o portfólio Localize a disciplina no catálogo; confirme o nome oficial quando houver truncamento. Para uma aula, crie aulas/YYYY-MM-DD-tema/ e copie o modelo de aula. Para um projeto, crie projetos/nome-estavel/ com README, requisitos, instruções, testes e limitações. Use os manifestos adequados à stack. Registre entregas como rascunho/revisado/submetido/confirmado, com evidência quando existir. Mantenha materiais externos e registros pessoais no acervo local; não adicione .env ou dependências. Atualize disciplina.json e o catálogo global. Com Pandoc instalado, rode python3 tools/build_portal.py . Depois rode python3 tools/validate_repo.py e os testes do projeto alterado. Revise git diff --cached e só então faça commit/push. Não use force-push para reorganizações rotineiras. Evite editar simultaneamente o projeto na pasta antiga e na organizada. Commits sugeridos: docs(ai-core): ... , feat(vibe-coding): ... , chore(catalogo): ... . O número da disciplina é organizacional e não precisa entrar no nome de cada commit. Para mudanças SpeakUp orientadas pela skill específica, respeite a constituição e os checkpoints descritos nas specs. A importação para este monorepositório não encerra fases nem aprova produção. ", "formato": ".md"}, {"titulo": "Direitos, privacidade e publicação", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "docs/direitos-e-privacidade.md", "html": "biblioteca/leitura/docs/direitos-e-privacidade.html", "texto": " Direitos, privacidade e publicação O repositório é privado. Não conceder acesso público ou atribuir licença ampla ao conjunto sem revisar materiais de terceiros, dados e autoria compartilhada. Não versionar .env real, chaves, tokens, service role, node_modules, builds, ambientes virtuais, Git de terceiros ou arquivos de credenciais. .env.example contém somente exemplos públicos. A senha de demonstração exigida pelo exercício não é uma credencial de produção aprovada. Materiais de aula e skills recebidas são referências externas. O pacote de skills contém metadados de outro repositório; não copiar esse Git para o portfólio. Preserve atribuições e obtenha os arquivos de fontes autorizadas. Resumos, notebooks e entregas podem citar pessoas, grupos e identificadores acadêmicos. A visibilidade privada não equivale a uma revisão de privacidade completa. Antes de tornar o portfólio público, preparar uma versão revisada com dados sintéticos e conteúdo cuja redistribuição esteja autorizada. Não declarar LGPD, licenças de uso, SLA, auditoria imutável ou autorização de publicação como comprovados por esta organização de arquivos. ", "formato": ".md"}, {"titulo": "Disciplinas — turma 4ABL", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "docs/disciplinas.md", "html": "biblioteca/leitura/docs/disciplinas.html", "texto": " Disciplinas — turma 4ABL A ordem segue a imagem fornecida. Nome truncado não foi completado por inferência. Advocacy e Influência — sem-material-local AI Core Concepts — com-projetos AI Sociedades do Futuro Dessincronizao e… — com-material · nome oficial pendente Arquitetura Corporativa para IA Estrategia — sem-material-local Arquitetura de Agentes — sem-material-local Capacitação Organizacional para IA — sem-material-local Encontro com a Coordenação — sem-material-local Engenharia de Software com IA Assistida para… — sem-material-local · nome oficial pendente Estratégia de IA — sem-material-local Experiências de Produto — sem-material-local Gestão de Produto — sem-material-local Gestão de Projetos e Equipes — sem-material-local Governança de Dados IA e Ética — sem-material-local Implementação de Agentes — sem-material-local Orquestração e Integração de Agentes — sem-material-local Processamento de Aprendizagem — sem-material-local Reengenharia de Processos com Agentes — sem-material-local Segurança e Confiabilidade — sem-material-local Transformação de Modelos Operacionais e de Neg… — sem-material-local · nome oficial pendente Valor e Investment Governance de IA — sem-material-local Vibe Coding Executivo — com-projetos ", "formato": ".md"}, {"titulo": "Estrutura do repositório", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "docs/estrutura.md", "html": "biblioteca/leitura/docs/estrutura.html", "texto": " Sumário do documento Regenerar o portal Estrutura do repositório Cada disciplina tem README, disciplina.json , aulas por data, projetos independentes, entregas com estado e referências. Slugs usam ASCII e hífens para simplificar caminhos e automações; nomes de exibição mantêm a grafia disponível. O portfólio adota um monorepositório com escopos explícitos. Cada software mantém manifesto, lock e testes próprios. Não centralizar todas as dependências em um único ambiente. As duas versões SpeakUp permanecem irmãs para executar a comparação. A baseline original não é reformatada. catalogo/disciplinas.json é o índice de navegação. catalogo/importacao.json relaciona arquivos versionados à origem e seus hashes antes/depois. catalogo/adaptacoes.json explica alterações nas cópias. O inventário integral e as duplicatas ficam em acervo-local/ , fora do Git. Templates são pontos de partida, não comprovação de conteúdo realizado. Arquivos .gitkeep preservam seções ainda vazias quando necessário. Projetos futuros podem ter testes e pipelines próprios. Regenerar o portal Com Pandoc instalado, execute python3 tools/build_portal.py . O gerador atualiza as páginas de navegação, preservando o código dos projetos e a baseline. Não publica na web. ", "formato": ".md"}, {"titulo": "Importação concluída — registro da retomada", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "docs/importacao-pendente.md", "html": "biblioteca/leitura/docs/importacao-pendente.html", "texto": " Importação concluída — registro da retomada Em 19/10/2026, os downloads do OneDrive foram concluídos e os 183 arquivos antes pendentes foram importados sem conflitos. Os 61 arquivos recuperados inicialmente de snapshots também foram conferidos com as fontes atuais. Os 246 arquivos inventariados estão copiados e verificados por SHA-256. Não há pendências de leitura nesse inventário. Duplicatas por conteúdo foram identificadas e mantidas; nenhum original foi apagado ou movido. A versão SDD, seus testes, specs, relatórios e HTML estão disponíveis no projeto SpeakUp. Referências de terceiros e demais itens restritos continuam no acervo local, fora do Git. Importação concluída não significa que o produto esteja pronto para produção ou que as entregas acadêmicas tenham sido submetidas. A trilha de cópias está em catalogo/importacao.json , as adaptações em catalogo/adaptacoes.json e o inventário integral em acervo-local/inventario.json . A lista de pendências foi mantida, agora vazia, para futuras retomadas. O script tools/resume_import.py continua disponível para novas importações controladas. ", "formato": ".md"}, {"titulo": "MBA AI Leadership — 4ABL", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "README.md", "html": "biblioteca/leitura/README.html", "texto": " Sumário do documento Comece aqui Estado da importação Biblioteca de leitura Projetos em destaque Organização Validar organização MBA AI Leadership — 4ABL Portfólio acadêmico e memória dos projetos de Antonio Figueiredo , turma 4ABL . Repositório privado, organizado em 19/10/2026 para evoluir junto com as disciplinas. Comece aqui Portal HTML responsivo : disciplinas, status e acesso aos projetos. Baixe/abra localmente; o GitHub não executa HTML na visualização de arquivo. Catálogo de disciplinas . Estrutura e convenções . Como adicionar aulas e projetos . Origem, integridade e acervo local . Direitos, privacidade e publicação . Estado da importação Concluída: os 246 arquivos inventariados foram copiados e conferidos contra as fontes atuais. Nenhuma pendência de leitura; originais preservados. O acervo restrito continua fora do Git. Consulte o registro da retomada . Biblioteca de leitura Ler e navegar no GitHub em Markdown . Abrir biblioteca HTML com busca no conteúdo . Formatos, cobertura e atualização . Projetos em destaque AI Core Concepts — Correlação CX : notebooks, análise, scripts e gráficos. Vibe Coding Executivo — SpeakUp : original e evolução SDD lado a lado. Documentação interativa SpeakUp . Discovery SpeakUp . AI Sociedades do Futuro — entrega em elaboração . Organização catalogo/ disciplinas, importação e adaptações rastreáveis disciplinas/ 21 áreas; aulas, projetos, entregas e referências docs/ organização, operação do repositório e decisões templates/ modelos para próximas disciplinas tools/ validação da estrutura e integridade .github/ CI e modelos de issue/PR acervo-local/ referências e originais; somente local, fora do Git A numeração segue a imagem fornecida e não afirma ordem curricular. Três rótulos aparecem truncados e continuam pendentes de confirmação no portal. Disciplinas sem material não são apresentadas como concluídas. Validar organização python3 tools/validate_repo.py Os testes de software pertencem a cada projeto. O pipeline verifica a estrutura e executa a comparação e os testes SpeakUp com os fontes importados. não implanta projetos ou GitHub Pages. Nenhuma licença geral foi atribuída aos materiais de terceiros. ", "formato": ".md"}, {"titulo": "Organização local e integridade", "disciplina": "geral", "grupo": "Materiais gerais", "markdown": "docs/organizacao-local.md", "html": "biblioteca/leitura/docs/organizacao-local.html", "texto": " Sumário do documento Retomada concluída Organização local e integridade Foi criada uma nova pasta mba-ai-leadership-4abl ao lado do acervo existente. A organização usa cópias: nenhum original foi movido, sobrescrito ou apagado. A leitura de cada arquivo tem limite de espera para placeholders OneDrive. Um item não lido é marcado pendente; não se afirma que foi copiado. O inventário integral contém origem, destino, tamanho, data e SHA-256 quando verificado. Duplicatas são identificadas pelo conteúdo e mantidas; sem deduplicação destrutiva. As cópias de Markdown podem ter links ajustados. O helper de comparação SpeakUp usa diretório temporário portátil; os fontes do original Vibe Coding permanecem idênticos. Não existe sincronização automática entre pasta antiga e nova. Continue os trabalhos dentro da nova estrutura; antes de reimportar, compare o inventário e preserve edições novas. Acervo não versionado: slides, transcrição integral, PDFs/Word de referência, bases XLSX ainda não revisadas e pacote externo de skills. Algumas cópias locais de entrada/entrega ficam junto ao projeto e são ignoradas. O clone remoto não possui esses itens: recupere-os de fonte autorizada quando forem necessários. Os notebooks educacionais e o CSV de atividade permanecem privados; revisar proveniência antes de publicação pública. O resumo da aula de 19/10 permanece parcial. A transcrição completa ainda é necessária para encerrar seu material de estudo. Uma entrega encontrada não significa submissão confirmada. O arquivo de encerramento do MBA foi inventariado como material geral, sem inferir que a turma ou as disciplinas já foram concluídas. Retomada concluída Após o download do OneDrive, todas as 246 fontes foram lidas e comparadas por SHA-256. Os snapshots iniciais foram confirmados contra os originais atuais. Não há pendências de importação no inventário de 19/10/2026. As ressalvas sobre cobertura parcial de aulas e submissões não verificadas continuam válidas. ", "formato": ".md"}];const q=document.querySelector('#q'),group=document.querySelector('#group'),results=document.querySelector('#results'),count=document.querySelector('#count');const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();function update(){const terms=norm(q.value).trim().split(/\s+/).filter(Boolean);let selected=docs.filter(d=>(!group.value||group.value===d.disciplina)&&terms.every(t=>norm(d.titulo+' '+d.texto).includes(t)));results.replaceChildren();count.textContent=selected.length+' documentos encontrados';for(const d of selected){let li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('div'),preview=document.createElement('p');a.textContent=d.titulo;a.href='../'+d.html;meta.className='meta';meta.textContent=d.grupo+' · '+d.formato+' → Markdown';preview.textContent=d.texto.slice(0,180)+'…';li.append(a,meta,preview);results.append(li);}}q.addEventListener('input',update);group.addEventListener('change',update);update();</script></main></body></html>
