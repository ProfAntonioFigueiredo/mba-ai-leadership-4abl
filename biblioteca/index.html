itos autorais. Slide 2 Roteiro da aula 1 Vieses Seleção, confirmação e variável omitida 2 Riscos da IA Deepfake, reconhecimento facial e enquete da turma 3 Máquinas pensam? GANs, Teste de Turing e o caso LaMDA 4 Debate Agentes, antropomorfização e pensamento crítico 5 IA Clássica Tipos de ML, overfitting e o mapa do ML 6 Hands On Correlação estatística e caderno de hipóteses Notas do apresentador Objetivos da aula (PDF): conhecer a IA Clássica; entender os tipos de Machine Learning; discutir cases e vieses; aplicar IA Clássica através da correlação estatística. Slide 3 1 Viés de Seleção A amostra não representa a população e a conclusão se inverte Slide da aula: 9 pessoas, e o quadrado vermelho seleciona só as 3 mulheres 67% da AMOSTRA prefere uva (2 de 3 mulheres) 67% da POPULAÇÃO prefere banana (6 de 9 pessoas) O erro está no critério, não no tamanho: aumentar a amostra do mesmo jeito não resolve. Em IA: modelo treinado com dados enviesados reproduz e amplia o viés (crédito, reconhecimento facial, RH). Mitigar: amostragem aleatória ou estratificada, comparar a amostra com a população, documentar a origem dos dados. Notas do apresentador Pergunta executiva: de onde vieram esses dados e quem ficou de fora? Uma amostra grande e enviesada é pior que uma pequena e representativa, porque passa confiança falsa. Slide 4 1 Outros vieses: Confirmação e Variável Omitida Viés de Confirmação Fatos que confirmam a crença são sobrevalorizados; os que contradizem, subvalorizados. Caso da professora: o gestor pede para \"filtrar a base\" (só 2025, tirar variáveis) até a hipótese dele parecer verdadeira. Variável Omitida Uma variável relevante fica fora e distorce a relação. QI → estuda menos (−) e pontua mais (+). Sem o QI, o efeito do estudo sobre a nota parece menor ou até negativo. → Reaparece no Hands On (Paradoxo de Simpson). Notas do apresentador Mitigação da confirmação: definir hipótese e recorte ANTES da análise, registrar todas as análises e fazer revisão independente. Mitigação da variável omitida: conhecer o domínio, mapear as causas e usar experimentos A/B. Slide 5 2 Tentativas de negar a mudança de modelos 1903, Horace Rackham: \"Cavalos sempre existirão; automóveis são modismo.\" 1962, Decca Records: \"Bandas com guitarristas estão acabando\" (recusou os Beatles). 2007, Steve Ballmer: \"Nenhuma chance de o iPhone ter market share significativo.\" Líderes avaliam o novo com os critérios do modelo antigo. A pergunta certa não é \"a IA vai pegar?\", e sim \"o que precisa ser verdade para isso mudar meu negócio?\" Notas do apresentador Ligação com a Parte 1: é o viés de confirmação aplicado à estratégia. Slide 6 2 Os 3 desafios mais críticos da IA, segundo a turma Enquete Poll Everywhere · 34 votos · 7 opções As 7 opções da enquete 1º Déficits cognitivos IA reduzindo o aprendizado e o pensamento crítico (também no top 3 da professora) 2º Legislação Falta de regulação ou regulação excessiva, que \"trava a inovação\" 3º Deepfake Crimes cibernéticos facilitados pela IA Notas do apresentador Outras opções: IA assumindo o controle; vieses e discriminação algorítmica; obsolescência humana; hype (IA como bala de prata). Slide 7 2 Deepfake: a reunião em que ninguém era real CNN Brasil, 04/02/2024 US$ 25 mi transferidos por um funcionário após uma videoconferência em que CFO e colegas eram deepfakes (Hong Kong) Não foi só tecnologia: como se autoriza US$ 25 mi verbalmente num Zoom? (turma da PwC) Hierarquia pesa: quem foi clonado era um executivo sênior, e é difícil questionar \"o chefe\". Lição: vídeo e voz deixaram de ser prova de identidade. Controles: verificação fora do canal, palavra-código, dupla aprovação, limites de valor. Notas do apresentador Peter: 'saber que eu não devo transferir 25 milhões numa reunião, mesmo para o CEO', é o conhecimento crítico. Com procedimento, não importa se é IA ou não. Slide 8 2 Reconhecimento facial e a matriz de confusão StartSe, 08/07/2019 81% dos alertas da polícia de Londres eram falsos positivos (8 de 42 corretos) É procurado É inocente Sistema: \"procurado\" Verdadeiro positivo FALSO POSITIVO Sistema: \"não é\" FALSO NEGATIVO Verdadeiro negativo \"Guerra estatística\": divulgar só as taxas de FP e FN em vez dos 81% mascara o resultado. Qual erro é pior? Depende do contexto. Aqui, FP = inocente abordado; num diagnóstico de câncer, o FN costuma ser pior. Notas do apresentador Hong Kong: manifestantes usaram máscaras e óculos contra a identificação. Júlio: camiseta com estampa que torna a pessoa invisível ao algoritmo (ataque adversarial). Para ir ao ar, é preciso um painel completo de métricas. Slide 9 3 GANs: como se gera um rosto que não existe Arquitetura: gerador × discriminador 1 Gerador cria exemplos falsos a partir de ruído (o \"falsificador\") 2 Discriminador classificador binário: real ou fake? (o \"perito\") 3 Jogo adversarial cada um é atualizado com o erro do outro 4 Equilíbrio o discriminador erra ~50%, e o fake fica indistinguível Notas do apresentador this-person-does-not-exist.com: no começo as imagens tinham falhas (orelha deslocada, cabelo recortado). Deep learning é usado para dados não estruturados. Goodfellow (2014). Hoje os modelos de difusão dominam a geração de imagens. A professora usa GANs para gerar bases sintéticas. Slide 10 3 Máquinas pensam? Do Teste de Turing ao LaMDA 1950 Turing: se não distinguimos humano de máquina numa conversa, a máquina \"passa\". \"Já não serve mais pra nada\" (professora). 1980 Quarto Chinês (Searle): manipular símbolos não é compreender. Imitar ≠ entender. 2022 Google demite Blake Lemoine, que disse que o LaMDA tinha consciência. Efeito ELIZA. \"Há 4 ou 5 anos os alunos achavam essa pergunta ridícula. Hoje já ouço alguns 'sims'.\" AGI e IA senciente já aparecem no Hype Cycle da Gartner. Notas do apresentador Tirinha Turing Test 2208: a máquina reconhece o humano como o 'burro'. CAPTCHAs são o Teste de Turing ao contrário. Lição: antropomorfização é um viés cognitivo. Slide 11 4 Debate: agentes, antropomorfização e hype \"Analista Financeiro 1\" Um banco proibiu dar a um agente de IA o nome de um cargo humano. Nomear aproxima as pessoas, mas faz esquecer que é código que erra: sem humano no loop, sem guardrails. 200 agentes em 3 meses Meta \"mágica\" que resultou em 200 PoCs, alguns MVPs e ROI zero. Agora: letramento, arquitetura, guardrails, humano no loop e FinOps. Copiloto, não piloto O humano à frente e o agente trazendo informação. Accountability: quem responde pelo erro do agente? (Peter) \"Faça UM agente funcionar\" Depois vá para o segundo. Engenheiros: \"codávamos em 4 h; agora em 30 min, e levamos 8 h para entender o que a IA fez\". Notas do apresentador Aline: se todo cargo tiver que dominar IA, as pessoas perdem o foco na especialidade? Professora: entenda a IA para se posicionar e estabelecer limites; grandes implementações continuam com times de desenvolvimento. Peter: a IA vai ser como a datilografia, natural para todos. Slide 12 4 A IA reduz o aprendizado e o pensamento crítico? MIT Media Lab (2025), \"Your Brain on ChatGPT\": EEG em 3 grupos Conectividade cerebral: sem apoio &gt; Google &gt; ChatGPT. \"O cérebro vai desligando à medida que recebe suporte.\" Memória e autoria: quem usou LLM teve dificuldade de defender a própria redação. Nas empresas: \"PPTs fantásticos e pessoas se perdendo para explicar os números\". Juniores: uma empresa cortou o acesso deles a LLMs para \"não emburrecerem\". Contraponto (Peter): a escrita e a internet também mudaram o aprendizado. \"Ninguém sabe mais fazer fogo, e tudo bem.\" Notas do apresentador Ressalvas: amostra pequena, preprint. Wesley/Gartner: quem sabe fazer sem IA será o profissional valioso do futuro. Professora: a velocidade da mudança é o que mais preocupa. A máquina é ótima em hard skills, mas 'não tem alma'. Slide 13 05 Inteligência Artificial Clássica \"Não desprezem a IA clássica: ela ainda é pelo menos 60% da nossa atuação no mercado. E a generativa me ajudou a fazer a clássica.\" Slide 14 5 Programação tradicional × Aprendizado de Máquina \"O ML começa pelo fim\" Tradicional Dados de entrada Algoritmo (regras) Dados de saída Machine Learning Dados de saída (rótulos) Algoritmo de ML Modelo Malha fina de if-else Fraude = ticket acima do padrão E 5 erros de senha E IP distante… Frágil e engessada: \"somos criativos para o bem e para o mal\", e todo dia surge fraude nova. Aprende com a base rotulada Olha o histórico \"fraude / não fraude\" com todas as nuances. Uma fraude inédita passa uma única vez: depois é rotulada e o modelo é retreinado. ~80% da IA aplicada hoje é supervisionada. Notas do apresentador Para líderes: em ML, os dados são o novo código. Vieses nos dados viram vieses no modelo. Slide 15 5 Aprendizado supervisionado na prática Quick, Draw! (Google) Lobe (Microsoft): com / sem máscara Quick, Draw!: a rede compara o traço com milhões de desenhos rotulados. O rato da professora teve o maior match; o crocodilo e o sapo ficaram atrás. Hipopótamo rosa: mostre exemplos reais e a criança reconhece até uma variação nova. Isso é aprendizado supervisionado. Treino × teste: reserve dados inéditos para o teste; \"se ele já viu, ele cola\". Rotulagem: esforço humano enorme e sujeito a erro (a OpenAI foi acusada de terceirizar essa mão de obra). 100% de acerto não é bom Overfitting: o modelo decorou uma amostra pequena ou idealizada. \"A realidade nunca é quadrada.\" Casos-limite: a mão na frente da boca, ou uma máscara com mão estampada. Notas do apresentador Dataiku: plataforma colaborativa que testa de 10 a 15 modelos (AutoML) em cerca de 1 hora; depois vem o fine tuning. YOLO: detecção em tempo real, mas confundiu gato com cachorro, e um cachorro listrado pela sombra do portão virou 'tigre'. Slide 16 5 Os três tipos de Machine Learning Supervisionado Dados ROTULADOS Classificação (fraude sim/não) e regressão (prever valor). Professor com gabarito: o hipopótamo no zoológico. Não supervisionado Dados SEM rótulo Clusterização, regras de associação, redução de dimensão. Agrupar semelhantes sem saber o nome do grupo. Por reforço Agente × ambiente Tentativa e erro com recompensa (fitness). Castigo e prêmio: MarI/O, robôs, carros autônomos. Notas do apresentador LLMs combinam os três: pré-treino autossupervisionado, ajuste fino supervisionado e RLHF (reforço com feedback humano). A professora disse que ~80% da IA é supervisionada, inclusive os LLMs. Slide 17 5 Classificação × Clusterização Crédito: Bruno Kenji Caso de e-commerce: clusters de navegação Redução de preço Navega de forma objetiva, vai direto ao produto e não compra → oferecer desconto (\"o motivo nº 1 é preço\"). Oferta dos indecisos Olha coisas muito diversas → desconto não faz sentido; a abordagem é outra (curadoria, recomendação). Notas do apresentador 'Classificar pato não tem utilidade, não somos zoológicos, mas fazemos muito isso no mercado.' O nome do cluster vem depois, pela interpretação humana. Slide 18 5 Aprendizado por reforço: o MarI/O O que a IA vê: blocos e inimigos (entradas) → botões do controle (ações). Fitness = reforço: sobe quando o Mario avança e despenca quando ele erra. \"Ela entende que acerta sem entender de Mario.\" Uso real: robótica e carros autônomos em simuladores: \"passou no vermelho → despenca o fitness\". Regra prática da professora Dado estruturado → Machine Learning Dado não estruturado (imagem, vídeo, áudio) → Deep Learning Notas do apresentador Nota técnica: o MarI/O usa NEAT, um algoritmo genético/evolutivo; ilustra bem o reforço (agente, ambiente, ação, recompensa). Cuidado com o 'reward hacking': o agente otimiza exatamente a métrica que você definiu. Slide 19 5 O mapa do Machine Learning \"Dá para passar uns três anos só aprendendo esse mapinha\" DATAGEEKS Clássico supervisionado: classificação (árvores, SVM, regressão logística) e regressão (linear). Clássico não supervisionado: clustering (K-Means), padrões (Apriori), redução (PCA). Ensemble: Random Forest (bagging), XGBoost (boosting). Reforço: Q-Learning, DQN, algoritmos genéticos. Redes neurais / DL: CNN (imagem), RNN (sequência), GAN, autoencoders. Próxima aula: o ramo que desce para a IA generativa (Transformers e LLMs). Slide 20 6 Correlação estatística (Pearson) O quanto duas métricas caminham juntas, uma pista e não uma prova −1 −0,4 0 +0,4 +1 Critério do exercício: r &gt; 0,4 ou r &lt; −0,4 🍦 Sorvete × temperatura Forte e positiva: sobem juntas. Serve para planejar estoque e sazonalidade. 🇺🇸 Frio × varejo nos EUA Parece forte e negativa, mas é ESPÚRIA: quem move o varejo são Ação de Graças e Natal. 🎬 Nicolas Cage × afogamentos Perto de +1 e mera coincidência. Correlação não implica causalidade. Ausência de correlação também é informação: \"fiz uma ação de marketing e não há correlação: ela não funcionou\". Para o diretor, mostre o gráfico de dispersão, não a matriz. Slide 21 6 Exemplo em aula: Trade Marketing (Red Bull) 50 capturas no ponto de venda · Copilot no Excel: \"Aplique correlação estatística\" Preço Promotor Distribuída Vendida Preço 1,00 −0,98 −0,06 −0,43 Promotor −0,98 1,00 −0,03 0,33 Distribuída −0,06 −0,03 1,00 0,92 Vendida −0,43 0,33 0,92 1,00 Distribuída × vendida (+0,92): disponibilidade gera venda? Ou a venda puxa a reposição? Giro de estoque? Promotor × preço (−0,98): o promotor negocia preço? reduz margem? leva o preço sugerido? ou só vai à loja em época de promoção (variável omitida)? Promotor × vendida (0,33): \"tímido\"; mas a taxa de conversão sobe (64% × 41%). Regressão linear = Machine Learning vendida ≈ 0,65 × distribuída − 7,6 A linha de tendência do gráfico de dispersão já é um modelo: dado um eixo, infiro o outro. Distribuindo 150 → cerca de 90 vendidas (cuidado ao extrapolar). Notas do apresentador Mantemos ou demitimos o promotor? Ele impacta o preço, isso é fato; se afeta a venda é a pergunta. Falta estratégia e meta. Antes da correlação, rode a estatística descritiva (média, mediana, desvio, mín., máx.). Slide 22 6 Desafio CX: o Paradoxo de Simpson Base metrica_cx_corr_v2 · 420 chamados do Suporte de TI interno No total, tempo × satisfação = +0,42 (\"demorar é bom\"?!). Dentro de cada criticidade a relação inverte: −0,49 a −0,57. A criticidade é a variável omitida: chamados críticos demoram mais E recebem notas maiores. Slide 23 6 Desafio CX: é o canal, não a idade Idade × CES = +0,50 é indireta: 83% dos colaboradores com 46+ usam o telefone, e o telefone tem CES de ~3,7 a 3,9 em QUALQUER faixa etária (chat ≈ 2,2). Ausência que informa: Criticidade × CES ≈ 0 e Tempo × CES ≈ 0. O esforço depende do canal. Notas do apresentador Recomendação ao diretor: tratar o tempo de resolução como alavanca de satisfação, com metas por criticidade, começando pelo telefone. Experimento: piloto de fila expressa + callback × grupo controle. Slide 24 6 Caderno de hipóteses: o processo da entrega 01 Antes dos dados Sem IA: feeling e experiência 02 Matriz Descritiva + correlação + leitura 03 Auditoria da IA Constatação · hipótese · causal indevida 04 Caderno final O que entra e o que cai 05 Recomendação Decisão, evidência, experimento, custo de errar \"Poderíamos pedir ao GPT para fazer tudo e ir dormir, mas não é a função de vocês na liderança de IA. Usem a IA como copiloto e se mantenham no loop: quem assina o caderno de hipóteses é você, não o LLM.\" Notas do apresentador Entrega: PDF no portal com os RMs separados por vírgula; prazo até a próxima aula; informar qual IA foi usada. Hipótese que cai não é erro. Slide 25 Próximos passos Anotar o grupo sorteado e os RMs dos integrantes Preencher a Etapa 1 do caderno com o grupo, sem IA Revisar e ajustar o caderno preenchido; exportar em PDF Subir no portal até a próxima aula (RMs separados por vírgula) Estudar para a próxima aula: IA Generativa e como funcionam os LLMs \"Será que a minha vida está sendo decidida por algoritmos?\" · Profª Tassiana ", "formato": ".pptx"}, {"titulo": "Aula 1 — IA clássica", "disciplina": "02", "grupo": "AI Core Concepts", "markdown": "disciplinas/02-ai-core-concepts/aulas/2026-09-28-i _de_Hipoteses_CX_preenchido", "disciplina": "02", "grupo": "AI Core Concepts", "markdown": "biblioteca/02/caderno-de-hipoteses-cx-preenchido-f0576871/conteudo.md", "html": "biblioteca/leitura/biblioteca/02/caderno-de-hipoteses-cx-preenchido-f0576871/conteudo.html", "texto": " Caderno_de_Hipoteses_CX_preenchido Índice da biblioteca Fonte: Aulas/AI-Core-Concepts/04_Hands_On_Correlacao/entrega/Caderno_de_Hipoteses_CX_preenchido.docx SHA-256: f05768711383fd3d0f5ed1e04ab663d12a39bed15c6e9e0d2a278fd9b20be061 Conversão do DOCX com títulos, listas, tabelas e imagens incorporadas. A paginação original não é preservada. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. HANDS ON · CORRELAÇÃO ESTATÍSTICA Caderno de Hipóteses Preencham em grupo, na ordem das etapas, e exportem em PDF para subir no portal. O uso de IA está liberado em todas as etapas, exceto na Etapa 1. Hipótese que cai não é erro: faz parte do processo. 00 IDENTIFICAÇÃO DO GRUPO RM Nome Ferramenta(s) de IA usada(s): Claude (Anthropic, via Claude Code no VS Code): interpretação da matriz e sugestão de hipóteses. Python (pandas, seaborn): cálculo da correlação de Pearson e Spearman e dos gráficos. Base analisada: metrica_cx_corr_v2.csv 01 HIPÓTESES ANTES DOS DADOS 10 minutos · sem IA Sem abrir a base, apenas pelo dicionário de dados: o que a experiência de vocês como gestores diz que vai aparecer? Registrem agora; vocês vão confrontar isso com os dados na Etapa 4. # O que esperamos encontrar Por que acreditamos nisso 1 2 3 02 MATRIZ DE CORRELAÇÃO E LEITURAS 15 minutos · IA liberada Antes da matriz, olhem os dados. Mínimo, máximo, valores estranhos, colunas que não variam. O que chamou atenção? • 420 respostas; nenhum valor faltante. • Id: identificador, fica fora da matriz. • Status_Chamado = \"Resolvido\" em 100% das linhas: coluna que não varia, fica fora da matriz. • Age: 5 registros com idade 0 (Ids 17, 286, 297, 320, 413), provável erro de cadastro. Tratados como ausentes. Sem eles, a idade vai de 19 a 67 anos. • Tempo_Resolucao_h: de 1,1 h a 71,7 h. Média de 15,9 h, bem acima da mediana de 7,7 h (cauda longa de chamados demorados). • Distribuição: Baixa 52%, Média 30%, Alta 19% | Chat 40%, Telefone 34%, Portal 26%. • Canal e Criticidade são texto. Criticidade virou escala 1-2-3 e Canal virou 3 colunas 0/1. Captura da matriz de correlação (colem a imagem aqui) Listem as correlações maiores que 0,4 ou menores que -0,4. Na coluna \"Leitura\", escrevam apenas o que o número diz, sem explicar o porquê. Exemplo: \"quando X sobe, Y tende a cair\". Par de variáveis Coeficiente Leitura e_NPS × RATINGS +0,89 Quando a nota de satisfação sobe, a disposição em recomendar também sobe. Criticidade × Tempo_Resolucao_h +0,89 Quanto maior a criticidade, maior o tempo de resolução. Age × Canal Telefone +0,74 Quanto maior a idade, maior a presença no canal Telefone. CES × Canal Telefone +0,65 Atendimentos por telefone tendem a ter CES (esforço) mais alto. Age × Canal Chat −0,62 Quanto maior a idade, menor o uso do Chat. Criticidade × RATINGS +0,59 Quanto maior a criticidade, maior tende a ser a nota de satisfação. CES × RATINGS −0,54 Quando o esforço sobe, a satisfação tende a cair. Criticidade × e_NPS +0,53 Quanto maior a criticidade, maior tende a ser o e_NPS. Age × CES +0,50 Quanto maior a idade, maior tende a ser o esforço relatado. e_NPS × CES −0,48 Quando o esforço sobe, a disposição em recomendar tende a cair. CES × Canal Chat −0,48 Atendimentos por chat tendem a ter CES (esforço) mais baixo. Tempo_Resolucao_h × RATINGS +0,42 Quanto maior o tempo de resolução, maior tende a ser a nota (no agregado). Quais colunas da base ficaram fora da matriz? O que elas poderiam explicar? • Status_Chamado ficou fora porque é constante: só temos chamados resolvidos. Poderia explicar a satisfação de quem ficou sem solução (chamados abertos, cancelados ou reabertos). A pesquisa tem viés de seleção: só ouve quem foi atendido até o fim. • Id ficou fora por ser identificador. Se tivesse data, permitiria ver sazonalidade e tendência. • Canal e Criticidade só entram depois de convertidas em números. Os pares Canal × Canal (ex.: Chat × Telefone −0,58) foram ignorados, porque são negativos por construção (cada chamado tem um único canal). • Variáveis que NÃO existem e fazem falta: técnico ou nível (N1/N2/N3), SLA contratado, nº de transferências e reaberturas, área do colaborador. Elas poderiam explicar por que o crítico demora mais e é mais bem avaliado. • AUSÊNCIAS de correlação que também são informação: Criticidade × CES (0,01) e Tempo × CES (−0,02). O esforço do colaborador NÃO depende da gravidade nem da demora do chamado, e sim do canal. Criticidade × Canal (~0): chamados críticos não se concentram em nenhum canal. 03 AUDITORIA DA IA 10 minutos Peçam à IA que interprete a matriz e sugira hipóteses. Depois, auditem cada afirmação como se ela viesse de um analista júnior da sua squad. Prompt usado: \"Você é um analista de dados. Aplique correlação estatística (Pearson) na base metrica_cx_corr_v2.csv (pesquisa interna de satisfação do Suporte de TI). Liste as correlações maiores que 0,4 ou menores que -0,4, interprete a matriz e sugira hipóteses para o diretor de Suporte.\" Classifiquem cada afirmação: Constatação (descreve o número), Hipótese (explicação que ainda precisa ser testada) ou Causal indevida (afirma causa sem evidência). Afirmação da IA (resumida) Classificação Concordamos? Por quê? e_NPS e RATINGS têm correlação forte e positiva (0,89). Constatação Sim. Descreve o número. Com Spearman (mais adequado para escalas de 1 a 5) o valor se mantém: 0,90. Chamados que demoram mais geram colaboradores mais satisfeitos (tempo × RATINGS = +0,42). Causal indevida Não. Separando por criticidade, a relação inverte: dentro de cada nível, mais tempo = MENOS satisfação (r de −0,49 a −0,57). É um Paradoxo de Simpson. A criticidade é a variável omitida. Colaboradores mais velhos têm mais dificuldade: a idade aumenta o esforço (CES). Causal indevida Não. Controlando pelo canal, a idade quase não muda o CES (Telefone ≈ 3,7-3,9 em todas as faixas). A idade leva ao telefone, e o telefone é que tem mais esforço. O canal Telefone está associado a maior esforço e menor satisfação. Hipótese Sim, como hipótese. CES médio 3,75 (vs. 2,2 no Chat) e RATINGS 2,4 (vs. 3,6). Falta medir espera, URA e transferências para explicar o porquê. Chamados críticos são mais bem avaliados porque recebem técnicos mais seniores. Causal indevida Parcialmente. A correlação existe (+0,59), mas a base não tem a variável técnico ou nível. É uma hipótese plausível apresentada como fato. Precisa de dados de N1/N2/N3 para validar. Chamados de alta criticidade demoram cerca de 10× mais (48 h vs. 4,5 h). Constatação Sim, é o número. Mas a IA não perguntou se isso cumpre o SLA. O esperado seria o crítico ser priorizado. O que a IA deixou de questionar? • As 5 idades iguais a 0 (erro de cadastro), que distorcem as correlações com Age. • Que Status_Chamado é constante: a pesquisa só ouve chamados resolvidos (viés de seleção / sobrevivência). • Que as correlações Canal × Canal são artefato da codificação. • Que Pearson assume relação linear entre variáveis contínuas, e CES, RATINGS e e_NPS são escalas ordinais. Checamos com Spearman: tudo se mantém, exceto Tempo × RATINGS, que cai para 0,37 (abaixo do corte). • A variável omitida criticidade por trás de Tempo × Satisfação (Paradoxo de Simpson). • Se o tempo dos chamados críticos (48 h) está dentro do SLA. 04 CADERNO DE HIPÓTESES FINAL As hipóteses que o grupo mantém depois de confrontar a Etapa 1 com os dados e com a auditoria. Na coluna \"Etapa 1\", indiquem se a hipótese confirma, contradiz ou é nova em relação ao que vocês esperavam. # Hipótese Correlação que sustenta Etapa 1: confirma, contradiz ou nova Viés ou variável omitida possível Como validaríamos 1 Reduzir o tempo de resolução aumenta a satisfação em todos os níveis de criticidade. Tempo × RATINGS dentro de cada criticidade: −0,49 a −0,57 (no agregado, +0,42 enganoso) Criticidade (variável omitida que inverte o sinal: Paradoxo de Simpson) Piloto: fila expressa com meta de tempo menor para parte dos chamados de baixa criticidade vs. grupo controle; comparar RATINGS e e_NPS. 2 O canal Telefone gera mais esforço e menos satisfação, independentemente da idade. CES × Telefone +0,65; CES × RATINGS −0,54; CES × Chat −0,48 Idade (confundidor: 83% do público 46+ usa telefone). Controlado: o efeito persiste em todas as faixas Medir espera na URA, transferências e resolução no 1º contato; testar callback ou chat assistido para um grupo. 3 A idade define o canal escolhido, e por isso a idade parece aumentar o esforço (correlação indireta). Age × Telefone +0,74; Age × Chat −0,62; Age × CES +0,50 Espúria: Age × CES desaparece controlando o canal. Viés de seleção por canal Comparar o CES por faixa etária dentro do mesmo canal (feito: sem diferença relevante). 4 Chamados críticos recebem atendimento diferenciado (mais atenção e comunicação), o que eleva a satisfação. Criticidade × RATINGS +0,59; × e_NPS +0,53 Nível do técnico e nº de interações (não estão na base); efeito alívio Cruzar com o nível do técnico (N1/N2/N3) e o nº de atualizações enviadas ao colaborador por chamado. 5 Os chamados críticos demoram além do esperado (possível descumprimento de SLA). Criticidade × Tempo +0,89 (Alta = 48 h; Baixa = 4,5 h) Complexidade técnica e dependência de terceiros Comparar o tempo com o SLA por criticidade; mapear escalonamentos e fornecedores envolvidos. 6 Satisfação (RATINGS) e recomendação (e_NPS) medem a mesma percepção. e_NPS × RATINGS +0,89 (Spearman 0,90) Mesma pessoa, mesmo momento (viés de resposta) Testar pesquisa enxuta em um piloto e ver se a informação se perde. Hipóteses que derrubamos e por quê: • \"Demorar mais deixa o colaborador mais satisfeito\" (Tempo × RATINGS +0,42): derrubada. Dentro de cada criticidade a relação é negativa. Com Spearman, ainda cai para 0,37, abaixo do corte. • \"Colaboradores mais velhos têm mais dificuldade\" (Age × CES +0,50): derrubada. No mesmo canal, o esforço é praticamente igual em todas as faixas etárias. O efeito é do canal Telefone, não da idade. Das expectativas da Etapa 1, alguma resistimos a abandonar mesmo com os dados contra? 05 RECOMENDAÇÃO AO DIRETOR DE SUPORTE Escolham a hipótese mais forte e escrevam para quem vai decidir. Uma ou duas frases por item. Decisão que recomendamos: Tratar o tempo de resolução como alavanca de satisfação: fixar metas de redução por nível de criticidade e começar pelo canal Telefone, que concentra o maior esforço e o público 46+. Evidência que temos (e o que ela não prova): Dentro de cada criticidade, mais tempo = menos satisfação (r de −0,49 a −0,57); o Telefone tem CES de 3,75 contra 2,24 do Chat, em qualquer idade. Não prova causa: é uma pesquisa observacional, só com chamados resolvidos, sem dados de técnico, SLA ou transferências. Experimento para testar se há causa: Piloto de 8 semanas: sortear metade dos chamados de baixa e média criticidade para uma fila expressa (meta de tempo 50% menor) e, no Telefone, oferecer callback. Comparar RATINGS, e_NPS e CES com o grupo controle. Diferença significativa indica causa. Custo de errar (se agirmos e a hipótese for falsa; se não agirmos e ela for verdadeira): Se agirmos e for falsa: custo de reorganizar a fila e o esforço da equipe, sem ganho de satisfação (reversível, piloto limitado). Se não agirmos e for verdadeira: colaboradores parados por mais tempo (perda de produtividade), queda contínua de e_NPS e a experiência pior concentrada no público 46+ que depende do telefone. ", "formato": ".docx"}, {"titulo": "Caderno_de_Hipoteses_TEMPLATE", "disciplina": "02", "grupo": "AI Core Concepts", "markdown": "biblioteca/02/caderno-de-hipoteses-template-39e7ab13/conteudo.md", "html": "biblioteca/leitura/biblioteca/02/caderno-de-hipoteses-template-39e7ab13/conteudo.html", "texto": " Caderno_de_Hipoteses_TEMP ge | Idade do colaborador atendido | | Canal | Chat, Telefone ou Portal | | Criticidade | Baixa, Media, Alta | | Tempo_Resolucao_h | Horas entre a abertura e a resolução do chamado | | Status_Chamado | Situação do chamado | | e_NPS | Disposição em recomendar o suporte (0 a 10) | | CES | Esforço para resolver o problema (1 = muito fácil, 5 = muito difícil) | | RATINGS | Satisfação com o atendimento (1 = muito insatisfeito, 5 = muito satisfeito) | Perguntas que ajudam a pensar: Demorar mais deixa o colaborador mais ou menos satisfeito? Qual canal deve ser o melhor ou o pior? A idade influencia o quê? Chamados críticos são mais bem ou mais mal avaliados? NPS, CES e RATINGS andam juntos? ✍️ Sua resposta, Etapa 1 # O que esperamos encontrar Por que acreditamos nisso 1 2 3 02 · Matriz de correlação e leituras (15 min · IA liberada) 2.1 📋 \"Antes da matriz, olhem os dados. Mínimo, máximo, valores estranhos, colunas que não variam. O que chamou atenção?\" ▶️ Rode a estatística descritiva, o primeiro passo que a professora recomendou ( \"aplique estatística descritiva\" ). d.describe(include = 'all' ).T print ( 'Valores faltantes no total:' , d.isna(). sum (). sum ()) print ( 'Colunas que NÃO variam:' , [c for c in d.columns if d[c].nunique() == 1 ]) print ( 'Idades iguais a 0 (Ids):' , d.loc[d.Age == 0 , 'Id' ].tolist()) print ( 'Criticidade:' , d.Criticidade.value_counts().to_dict()) print ( 'Canal:' , d.Canal.value_counts().to_dict()) fig, ax = plt.subplots( 1 , 4 , figsize = ( 18 , 3.6 )) sns.histplot(d.Age, bins = 25 , ax = ax[ 0 ]).set_title( 'Idade: repare nos zeros' ) sns.histplot(d.Tempo_Resolucao_h, bins = 30 , ax = ax[ 1 ]).set_title( 'Tempo de resolução (h)' ) ax[ 1 ].axvline(d.Tempo_Resolucao_h.mean(), color = 'red' , ls = '--' , label = 'média' ) ; ax[ 1 ].axvline(d.Tempo_Resolucao_h.median(), color = 'green' , ls = '--' , label = 'mediana' ) ; ax[ 1 ].legend() sns.countplot(data = d, x = 'e_NPS' , ax = ax[ 2 ], color = '#3A7CA5' ).set_title( 'e_NPS (0 a 10)' ) sns.boxplot(data = d, x = 'Criticidade' , y = 'Tempo_Resolucao_h' , order = ORDEM_CRIT, palette = CORES_CRIT, ax = ax[ 3 ]).set_title( 'Tempo por criticidade' ) plt.tight_layout() ; plt.show() 💡 Insight: como ler a estatística descritiva Média × mediana: quando a média é bem maior que a mediana , há uma cauda longa : poucos casos muito altos puxam a média para cima. Aqui o tempo médio é ~15,9 h e a mediana ~7,7 h, então alguns chamados demoram muito mais que o normal . Para gestão, a mediana representa melhor o \"chamado típico\". Mínimo e máximo revelam erros de cadastro e outliers . Uma idade = 0 é impossível para um colaborador. Coluna que não varia ( nunique = 1 ) não pode ter correlação com nada, então sai da matriz. Mas ela diz algo sobre quem foi ouvido : se todo chamado está \"Resolvido\", a pesquisa só ouviu quem teve o problema resolvido (viés de seleção / sobrevivência, Parte 1 da aula). Distribuição das categorias: saber que 52% dos chamados são de baixa criticidade ajuda a priorizar onde está o maior volume. ✍️ Sua resposta: o que chamou atenção? Clique duas vezes aqui e escreva com as suas palavras. 🔎 Referência (clique para abrir, só depois de responder) 420 respostas, sem valores faltantes. Status_Chamado = \"Resolvido\" em 100%: não varia (e só ouve quem foi atendido até o fim). 5 idades = 0 (Ids 17, 286, 297, 320, 413): erro de cadastro, tratar como ausente. Tempo de 1,1 h a 71,7 h; média 15,9 h ≫ mediana 7,7 h, uma cauda longa. Baixa 52%, Média 30%, Alta 19% · Chat 40%, Telefone 34%, Portal 26%. 2.2 Preparar os dados para a matriz A correlação de Pearson só funciona com números . Decisões de preparação: Id sai (identificador) · Status_Chamado sai (constante) · Age = 0 vira ausente. Criticidade → escala ordinal 1 = Baixa, 2 = Média, 3 = Alta (existe uma ordem). Canal → one-hot : três colunas 0/1 (não existe ordem entre Chat, Portal e Telefone). d.loc[d.Age == 0 , 'Age' ] = np.nan d[ 'Criticidade_num' ] = d.Criticidade. map ({ 'Baixa' : 1 , 'Media' : 2 , 'Alta' : 3 }) num = pd.DataFrame({ 'Idade' : d.Age, 'Criticidade' : d.Criticidade_num, 'Tempo_Resolucao_h' : d.Tempo_Resolucao_h, 'e_NPS' : d.e_NPS, 'CES' : d.CES, 'RATINGS' : d.RATINGS, 'Canal_Chat' : (d.Canal == 'Chat' ).astype( int ), 'Canal_Portal' : (d.Canal == 'Portal' ).astype( int ), 'Canal_Telefone' : (d.Canal == 'Telefone' ).astype( int )}) num.head() 💡 Insight: por que codificar assim? Se transformássemos Canal em 1, 2, 3, estaríamos dizendo que \"Telefone = 3 × Chat\", o que não faz sentido. O one-hot evita essa ordem falsa. Efeito colateral: as colunas de canal têm correlação negativa entre si por construção (se é Chat, não é Telefone). Esses pares não são insight de negócio e serão ignorados. 2.3 📋 \"Captura da matriz de correlação (colem a imagem aqui)\" ▶️ A imagem é salva em entrega/01_heatmap.png para você colar no Word. corr = num.corr(method = 'pearson' ) plt.figure(figsize = ( 10 , 8 )) sns.heatmap(corr, mask = np.triu(np.ones_like(corr, bool ), 1 ), annot = True , fmt = '.2f' , cmap = 'RdBu_r' , vmin =- 1 , vmax = 1 , square = True , cbar_kws = { 'label' : 'r de Pearson' }) plt.title( 'Matriz de correlação: Suporte de TI (n = 420)' ) plt.tight_layout() ; plt.savefig( 'entrega/01_heatmap.png' , dpi = 150 ) ; plt.show() 💡 Insight: como ler o mapa de calor 🔴 Vermelho forte = perto de +1 : as duas sobem juntas. 🔵 Azul forte = perto de −1 : uma sobe e a outra desce. ⚪ Branco = perto de 0 : sem relação linear. A diagonal é sempre 1 (a variável com ela mesma), por isso mostramos só metade da matriz. Atenção ao sinal com o CES: o CES é \"esforço\", então maior = pior . Uma correlação negativa entre CES e RATINGS significa \"mais esforço → menos satisfação\", o que faz todo o sentido. 2.4 📋 \"Listem as correlações maiores que 0,4 ou menores que −0,4. Na coluna 'Leitura', escrevam apenas o que o número diz, sem explicar o porquê.\" canais = { 'Canal_Chat' , 'Canal_Portal' , 'Canal_Telefone' } pares = [] cols = list (corr.columns) for i, a in enumerate (cols): for b in cols[i + 1 :]: r = corr.loc[a, b] if abs (r) &gt; LIMIAR and not ({a, b} &lt;= canais): pares.append((a, b, round (r, 2 ), 'positiva' if r &gt; 0 else 'negativa' , forca(r))) rel = pd.DataFrame(pares, columns = [ 'Variável 1' , 'Variável 2' , 'r' , 'Sentido' , 'Força' ]).sort_values( 'r' , key = abs , ascending = False ).reset_index(drop = True ) rel # Um gráfico de dispersão para cada par (o que a professora recomenda levar ao diretor, em vez da matriz) n = len (rel) ; cols_g = 3 ; linhas_g = int (np.ceil(n / cols_g)) fig, axs = plt.subplots(linhas_g, cols_g, figsize = ( 16 , 4 * linhas_g)) for ax, (_, p) in zip (axs.flat, rel.iterrows()): sns.regplot(data = num, x = p[ 'Variável 1' ], y = p[ 'Variável 2' ], ax = ax, x_jitter = .15 , y_jitter = .15 , scatter_kws = { 'alpha' : .25 , 's' : 12 }) ax.set_title( f\" { p[ 'Variável 1' ] } × { p[ 'Variável 2' ] } (r = { p . r :+.2f} )\" , fontsize = 10 ) for ax in list (axs.flat)[n:]: ax.axis( 'off' ) plt.tight_layout() ; plt.show() 💡 Insight: como escrever a \"Leitura\" (e como ler a dispersão) Leitura = só o número. ✅ \"Quando a criticidade sobe, o tempo de resolução tende a subir.\" ❌ \"Chamados críticos demoram porque são complexos\" (isso já é hipótese , vai para a Etapa 4). Pontos em colunas verticais = a variável do eixo X tem poucos valores (binária 0/1 ou escala de 1 a 5). O jitter espalha um pouco os pontos só para eles ficarem visíveis. Diagonal com pontos próximos da linha = forte. Pontos espalhados com uma inclinação = moderada. ✍️ Sua resposta, tabela de correlações Par de variáveis Coeficiente Leitura (só o que o número diz) 2.5 📋 \"Quais colunas da base ficaram fora da matriz? O que elas poderiam explicar?\" ▶️ Veja também as ausências de correlação : a professora lembrou que \"isso também é informação\" . aus = [] for i, a in enumerate (cols): for b in cols[i + 1 :]: if abs (corr.loc[a, b]) &lt; 0.1 and not ({a, b} &lt;= canais): aus.append((a, b, round (corr.loc[a, b], 2 ))) print ( 'Pares SEM correlação (|r| &lt; 0,1):' ) pd.DataFrame(aus, columns = [ 'Variável 1' , 'Variável 2' , 'r' ]) 💡 Insight: o que fica de fora também conta O que foi excluído (Id, Status) e o que nem existe na base (técnico, nível N1/N2/N3, SLA, nº de transferências, reaberturas, área do colaborador) pode ser a variável omitida que explica uma correlação. Ausência de correlação pode derrubar uma crença da Etapa 1. Ex.: se você esperava que \"chamado crítico dá mais trabalho ao colaborador\", veja Criticidade × CES. ✍️ Sua resposta: colunas fora e o que poderiam explicar Clique duas vezes aqui e escreva com as suas palavras. 🔎 Referência Status_Chamado : constante; a pesquisa só ouve chamados resolvidos (e os não resolvidos? cancelados? reabertos?). Id : identificador; se houvesse data, daria para ver sazonalidade. Canal × Canal: ignorados, porque são negativos por construção. Fazem falta: técnico e nível, SLA contratado, transferências, reaberturas, área do colaborador. Ausências: Criticidade × CES ≈ 0 e Tempo × CES ≈ 0 → o esforço não depende da gravidade nem da demora. Criticidade × Canal ≈ 0 → críticos não se concentram em um canal. 03 · Auditoria da IA (10 min) 3.1 📋 \"Peçam à IA que interprete a matriz e sugira hipóteses. Depois, auditem cada afirmação como se ela viesse de um analista júnior da sua squad.\" Prompt sugerido (use no ChatGPT, Gemini, Copilot ou Claude, anexando a base): Você é um analista de dados. Aplique correlação estatística (Pearson) na base metrica_cx_corr_v2.csv (pesquisa interna de satisfação do Suporte de TI). Liste as correlações maiores que 0,4 ou menores que -0,4, interprete a matriz e sugira hipóteses para o diretor de Suporte. ✍️ Prompt que eu usei (cole aqui) ✍️ O que a IA respondeu (resuma as principais afirmações) 💡 Insight: as três classificações Classificação O que é Exemplo (sorvete) Constatação Só descreve o número \"Temperatura e venda de sorvete têm r = 0,9\" Hipótese Explicação ou ação que ainda precisa ser testada \"Vale aumentar o estoque no verão?\" Causal indevida Afirma causa sem evidência \"O calor causa as vendas\" / Nicolas Cage × afogamentos Sinais de alerta no texto da IA: \"causa\", \"leva a\", \"porque\", \"gera\", \"aumenta\" (afirmado como fato). Use as ferramentas abaixo para testar cada afirmação. 3.2 🔍 Auditoria A: \"Chamados que demoram mais deixam o colaborador mais satisfeito\"? explorar( 'Tempo_Resolucao_h' , 'RATINGS' , por = 'Criticidade' ) 💡 Insight: Paradoxo de Simpson ⭐ No geral a relação é positiva , mas dentro de cada criticidade ela é negativa . A criticidade é uma variável omitida (confundidora) : chamados críticos demoram mais e também recebem notas maiores . Misturando tudo, parece que \"demorar é bom\". É exatamente o slide \"Variável Omitida\" da aula (QI → tempo de estudo e nota) e o exemplo do ITA (o vestibular como filtro). 🧪 Teste você mesmo: troque RATINGS por e_NPS na célula acima e rode de novo. 3.3 🔍 Auditoria B: \"Colaboradores mais velhos têm mais dificuldade: a idade aumenta o esforço (CES)\"? d[ 'Faixa etária' ] = pd.cut(d.Age, [ 0 , 30 , 45 , 70 ], labels = [ 'até 30' , '31–45' , '46+' ]) fig, ax = plt.subplots( 1 , 2 , figsize = ( 14 , 4.5 )) (pd.crosstab(d[ 'Faixa etária' ], d.Canal, normalize = 'index' ) * 100 ).plot(kind = 'bar' , stacked = True , ax = ax[ 0 ], rot = 0 , color = list (CORES_CANAL.values())) ax[ 0 ].set_title( 'Canal usado por faixa etária (%)' ) ; ax[ 0 ].set_ylabel( '%' ) d.pivot_table(index = 'Faixa etária' , columns = 'Canal' , values = 'CES' , observed = True ).plot(kind = 'bar' , ax = ax[ 1 ], rot = 0 , color = list (CORES_CANAL.values())) ax[ 1 ].set_title( 'CES médio por canal e idade (maior = pior)' ) ; ax[ 1 ].set_ylim( 1 , 5 ) plt.tight_layout() ; plt.savefig( 'entrega/04_canal_idade_ces.png' , dpi = 150 ) ; plt.show() display(d.groupby( 'Canal' )[[ 'Age' , 'CES' , 'e_NPS' , 'RATINGS' ]].mean(). round ( 2 )) 💡 Insight: correlação indireta (controlar por outra variável) Para saber se é a idade ou o canal , compare o CES dentro do mesmo canal (gráfico da direita). Se as barras do mesmo canal ficam parecidas em todas as idades, o efeito é do canal . A idade só leva as pessoas ao telefone. 🧪 Teste: explorar('Age', 'CES', por='Canal') explorar( 'Age' , 'CES' , por = 'Canal' ) 3.4 🔍 Auditoria C: Pearson é adequado para escalas de 1 a 5? sp = num.corr(method = 'spearman' ) comp = rel[[ 'Variável 1' , 'Variável 2' , 'r' ]].rename(columns = { 'r' : 'Pearson' }) comp[ 'Spearman' ] = [ round (sp.loc[a, b], 2 ) for a, b in zip (comp[ 'Variável 1' ], comp[ 'Variável 2' ])] comp[ 'Continua |r| &gt; 0,4?' ] = np.where(comp.Spearman. abs () &gt; LIMIAR, '✅' , '❌' ) comp 💡 Insight: Pearson × Spearman Pearson mede relação linear entre variáveis contínuas. Spearman usa a ordem (postos) dos valores. É mais adequado para escalas ordinais (CES, RATINGS, e_NPS) e mais robusto a outliers. Se as duas concordam, a conclusão é robusta . Se o valor cai abaixo do corte com Spearman, desconfie daquela correlação. ✍️ Sua resposta, auditoria Afirmação da IA (resumida) Classificação Concordamos? Por quê? 📋 O que a IA deixou de questionar? 🔎 Referência \"Demorar mais deixa mais satisfeito\" → causal indevida (Paradoxo de Simpson). \"A idade aumenta o esforço\" → causal indevida (o efeito é do canal). \"O telefone tem mais esforço e menos satisfação\" → hipótese (falta medir URA, espera, transferências). \"e_NPS e RATINGS têm r = 0,89\" → constatação . A IA costuma não questionar: idades = 0, Status constante (viés de seleção), artefato Canal × Canal, Pearson em escala ordinal, a variável omitida criticidade, o SLA dos chamados críticos. 04 · Caderno de hipóteses final 📋 \"As hipóteses que o grupo mantém depois de confrontar a Etapa 1 com os dados e com a auditoria. Na coluna 'Etapa 1', indiquem se a hipótese confirma, contradiz ou é nova.\" ▶️ Laboratório livre: use explorar(x, y, por=...) para testar qualquer hipótese antes de escrevê-la. Variáveis: Age , Criticidade_num , Tempo_Resolucao_h , e_NPS , CES , RATINGS · grupos: Criticidade , Canal , Faixa etária . # Exemplos: troque e rode quantas vezes quiser explorar( 'Criticidade_num' , 'RATINGS' , por = 'Canal' ) # Painel de médias, útil para dar números concretos às hipóteses display(d.pivot_table(index = 'Criticidade' , columns = 'Canal' , values = 'RATINGS' ).loc[ORDEM_CRIT]. round ( 2 ).style.background_gradient(cmap = 'RdYlGn' , vmin = 1 , vmax = 5 ).set_caption( 'RATINGS médio' )) display(d.groupby( 'Criticidade' )[[ 'Tempo_Resolucao_h' , 'e_NPS' , 'CES' , 'RATINGS' ]].mean().loc[ORDEM_CRIT]. round ( 2 )) 💡 Insight: o que torna uma hipótese boa Está escrita como pergunta ou afirmação testável (\"Reduzir o tempo aumenta a satisfação?\"). Aponta a correlação que a sustenta (com o número). Reconhece o viés ou a variável omitida possível (a humildade estatística). Diz como validar (dado extra, piloto, teste A/B). Hipótese que cai não é erro : registre o que derrubou e por quê. Viés de confirmação: tem alguma crença da Etapa 1 que você está \"protegendo\" mesmo com os dados contra? ✍️ Sua resposta, caderno final # Hipótese Correlação que sustenta Etapa 1: confirma / contradiz / nova Viés ou variável omitida possível Como validaríamos 1 2 3 4 5 📋 Hipóteses que derrubamos e por quê: 📋 Das expectativas da Etapa 1, alguma resistimos a abandonar mesmo com os dados contra? 🔎 Referência (hipóteses possíveis) Reduzir o tempo de resolução aumenta a satisfação em todos os níveis de criticidade (r de −0,49 a −0,57 dentro de cada nível). Variável omitida: criticidade. O Telefone gera mais esforço e menos satisfação, independentemente da idade (CES × Telefone +0,65). A idade define o canal; Age × CES é indireta (controlando o canal, some). Chamados críticos recebem atendimento diferenciado e são mais bem avaliados (Criticidade × RATINGS +0,59). Falta a variável técnico/nível. Chamados críticos demoram além do SLA? (Criticidade × Tempo +0,89; 48 h × 4,5 h.) RATINGS e e_NPS medem a mesma percepção (+0,89). Derrubadas: \"demorar deixa mais satisfeito\" e \"a idade aumenta o esforço\". 05 · Recomendação ao Diretor de Suporte 📋 \"Escolham a hipótese mais forte e escrevam para quem vai decidir. Uma ou duas frases por item.\" O diretor \"não entende de hipóteses nem de correlação\" : fale de decisão, evidência, experimento e custo . ▶️ Números para sustentar a recomendação: tempo_total = d.Tempo_Resolucao_h. sum () print ( f'Horas totais de chamados abertos na amostra: { tempo_total :,.0f} h (≈ { tempo_total / 420 :.1f} h por chamado)' ) for red in [ 0.2 , 0.3 , 0.5 ]: print ( f' Reduzindo { int (red * 100 ) } % do tempo → ≈ { tempo_total * red :,.0f} h de colaboradores a menos com problema aberto' ) tel = d.groupby( 'Canal' )[[ 'CES' , 'RATINGS' , 'e_NPS' ]].mean(). round ( 2 ) print ( ' \\n Experiência por canal:' ) ; display(tel) # Efeito do tempo sobre RATINGS dentro de cada criticidade (inclinação da reta = pontos por hora) for k in ORDEM_CRIT: g = d[d.Criticidade == k] ; a, b = np.polyfit(g.Tempo_Resolucao_h, g.RATINGS, 1 ) print ( f' { k :&gt;5} : cada 10 h a mais ≈ { a * 10 :+.2f} ponto no RATINGS (r = { g . Tempo_Resolucao_h . corr(g.RATINGS) :+.2f} )' ) 💡 Insight: como desenhar o experimento (provar causa) Correlação não prova causa. Para provar, é preciso intervir e comparar com um grupo controle . Teste A/B: sortear ( aleatorizar ) metade dos chamados para uma \"fila expressa\" e a outra metade segue normal. O sorteio garante que as duas metades sejam parecidas em criticidade, idade e canal, e assim a variável omitida some. Defina antes a métrica de sucesso (ex.: RATINGS médio +0,5) e o prazo (ex.: 8 semanas). Custo de errar : pense nos dois lados. Agir e estar errado (custo de mudar a fila, reversível) × não agir e estar certo (colaboradores parados = produtividade perdida, e_NPS em queda). ✍️ Sua resposta, recomendação Decisão que recomendamos: Evidência que temos (e o que ela não prova): Experimento para testar se há causa: Custo de errar (se agirmos e a hipótese for falsa; se não agirmos e ela for verdadeira): 🔎 Referência Decisão: tratar o tempo de resolução como alavanca de satisfação: metas de redução por criticidade, começando pelo Telefone . Evidência: dentro de cada criticidade, mais tempo = menos satisfação; Telefone CES 3,75 × Chat 2,24 em qualquer idade. Não prova causa: pesquisa observacional, só chamados resolvidos, sem técnico/SLA. Experimento: piloto de 8 semanas com fila expressa e callback no Telefone × grupo controle sorteado; comparar RATINGS, e_NPS e CES. Custo de errar: agir e errar = reorganizar a fila (reversível); não agir e acertar = horas de colaboradores paradas, e_NPS caindo, experiência pior para o público 46+. 👥 Contribuições do grupo Integrante RM Etapas em que contribuiu Revisei o caderno completo? (✅) 📤 Como entregar (PDF + notebook) Rodar tudo: Ambiente de execução → Executar tudo (para os gráficos aparecerem no arquivo). Notebook: Arquivo → Fazer download → Baixar .ipynb . PDF do notebook: Arquivo → Imprimir → Salvar como PDF . PDF do template: copiem as respostas para o Caderno de Hipóteses.docx , colem a imagem entrega/01_heatmap.png (painel 📁 à esquerda → clique com o botão direito → Baixar) e exportem em PDF. Portal: subam o PDF (e o .ipynb, se a professora permitir anexos extras) com os RMs separados por vírgula . ✍️ Assinatura do caderno \"Um bom caderno de hipóteses é um ensaio com a IA como copiloto e um relatório final assinado por você: é quando você filtra e decide o que fazer.\" (Profª Tassiana) Declaramos que as hipóteses e recomendações acima foram revisadas e decididas pelo grupo . A IA foi usada como copiloto nas etapas 02 a 05 e não foi usada na Etapa 1 . Nome RM Assinatura Data: / /2026 ✅ Checklist de entrega Etapa 1 preenchida sem IA Imagem entrega/01_heatmap.png colada no Word Respostas copiadas para o Caderno de Hipóteses.docx Exportado em PDF e enviado no portal, com os RMs separados por vírgula Prazo: até a próxima aula ", "formato": ".ipynb"}, {"titulo": "caderno_hipoteses_CX", "disciplina": "02", "grupo": "AI Core Concepts", "markdown": "disciplinas/02-ai-core-concepts/projetos/correlacao-cx/entrega/caderno_hipoteses_CX.md", "html": "biblioteca/leitura/disciplinas/02-ai-core-concepts/projetos/correlacao-cx/entrega/caderno_hipoteses_CX.html", "texto": " Sumário do documento 1. Entendimento e preparação da base 2. Matriz de correlação: pares relevantes (|r| &gt; 0,4) 3. Hipóteses H1: Satisfação é um construto único (e_NPS × RATINGS, r = +0,89) H2: A criticidade define o tempo (Criticidade × Tempo, r = +0,89) H3: ⭐ Paradoxo de Simpson: o tempo parece não prejudicar, mas prejudica H4: Chamados críticos geram mais satisfação (Criticidade × RATINGS +0,59; × e_NPS +0,53) H5: O telefone é o canal de maior esforço (CES × Telefone +0,65; CES × Chat −0,48) H6: A idade define o canal (Idade × Telefone +0,74; Idade × Chat −0,62) H7: Esforço destrói a satisfação (CES × RATINGS −0,54; CES × e_NPS −0,48) 4. Resumo executivo para a Diretoria de Suporte de TI Caderno de Hipóteses: Experiência do Colaborador no Suporte de TI Para: Diretoria de Suporte de TI Disciplina: AI Core Concepts, Aula 1 (Profª Tassiana Rugoni de Campos). FIAP MBA Base: metrica_cx_corr_v2.csv , 420 chamados resolvidos Método: correlação de Pearson. Foram analisados os pares com r &gt; 0,4 ou r &lt; −0,4 . 1. Entendimento e preparação da base Variável Significado Tratamento Id Identificador único da resposta Excluído : é só identificador Age Idade do colaborador atendido 5 registros com idade 0 (Ids 17, 286, 297, 320, 413) tratados como dado ausente, por serem provável erro de cadastro Canal Chat (167), Telefone (143), Portal (110) Convertido em 3 variáveis 0/1 ( one-hot ) Criticidade Baixa (218), Média (124), Alta (78) Convertida em escala ordinal: 1 = Baixa, 2 = Média, 3 = Alta Tempo_Resolucao_h Horas entre a abertura e a resolução do chamado (média 15,9 h; 1,1 a 71,7 h) Numérica Status_Chamado Situação do chamado. Sempre \"Resolvido\" Excluído : é constante e não varia e_NPS Disposição do colaborador em recomendar o suporte (0 a 10), o employee NPS Numérica CES Esforço para resolver o problema (1 = muito fácil, 5 = muito difícil). Quanto maior, pior Numérica RATINGS Satisfação com o atendimento (1 = muito insatisfeito, 5 = muito satisfeito) Numérica Os pares Canal × Canal (ex.: Chat × Telefone = −0,58) foram desconsiderados . São negativos por construção, já que cada chamado tem um único canal, e não trazem informação de negócio. 2. Matriz de correlação: pares relevantes (|r| &gt; 0,4) # Par r Sentido 1 e_NPS × RATINGS +0,89 Forte positiva 2 Criticidade × Tempo de resolução +0,89 Forte positiva 3 Idade × Canal Telefone +0,74 Forte positiva 4 CES × Canal Telefone +0,65 Moderada positiva 5 Idade × Canal Chat −0,62 Moderada negativa 6 Criticidade × RATINGS +0,59 Moderada positiva 7 CES × RATINGS −0,54 Moderada negativa 8 Criticidade × e_NPS +0,53 Moderada positiva 9 Idade × CES +0,50 Moderada positiva 10 e_NPS × CES −0,48 Moderada negativa 11 CES × Canal Chat −0,48 Moderada negativa 12 Tempo de resolução × RATINGS +0,42 Moderada positiva ⚠️ Ausências de correlação que também são informação: Criticidade × CES (0,01), Tempo × CES (−0,02) e Criticidade × Canal (~0). 3. Hipóteses H1: Satisfação é um construto único (e_NPS × RATINGS, r = +0,89) Leitura: quem dá nota alta ao atendimento também recomenda o suporte. Hipótese: as duas pesquisas medem a mesma percepção ? Seria possível simplificar a pesquisa e reduzir a fadiga de pesquisa dos colaboradores? Cuidado: as duas são respondidas no mesmo momento pela mesma pessoa, e é natural que andem juntas. Como validar: comparar a taxa de resposta e a informação extra de cada uma. Testar uma pesquisa enxuta em um grupo piloto. Ação: unificar num indicador de satisfação e manter o CES como medida separada de esforço. H2: A criticidade define o tempo (Criticidade × Tempo, r = +0,89) Leitura: chamados de criticidade alta levam em média 48,0 h , contra 15,9 h nos de média e 4,5 h nos de baixa. Hipótese: chamados críticos são mais complexos e dependem de outras equipes ou fornecedores? Ou o SLA de chamados críticos está sendo descumprido ? Cuidado: num suporte bem gerido, o esperado seria o contrário: o crítico ser priorizado e resolvido mais rápido . Como validar: comparar com o SLA contratado por criticidade. Mapear quantos escalonamentos e transferências cada chamado crítico teve. Ação: revisar a fila e a priorização dos chamados críticos, criar um swarming (força-tarefa) para incidentes críticos e fixar metas de SLA por nível. H3: ⭐ Paradoxo de Simpson: o tempo parece não prejudicar, mas prejudica Leitura \"ingênua\": Tempo × RATINGS = +0,42 e Tempo × e_NPS = +0,38. Quanto mais demora, mais satisfeito? Não faz sentido de negócio. Investigação: separando por criticidade, a relação se inverte : Criticidade Tempo × e_NPS Tempo × RATINGS Baixa −0,47 −0,51 Média −0,51 −0,57 Alta −0,38 −0,49 Explicação: a criticidade é uma variável omitida (confundidora) . Chamados críticos demoram mais (H2) e também recebem notas maiores (H4). Misturando tudo, parece que \"demorar é bom\". Dentro de cada nível, demorar sempre piora a satisfação. Hipótese: reduzir o tempo de resolução aumenta a satisfação em todos os níveis de criticidade. Ação: o tempo de resolução é uma alavanca real de satisfação. Metas de redução por nível de criticidade. Lição: é o exemplo do slide \"Variável Omitida\" (QI × tempo de estudo × nota) acontecendo na base. H4: Chamados críticos geram mais satisfação (Criticidade × RATINGS +0,59; × e_NPS +0,53) Leitura: criticidade alta tem e_NPS médio de 9,5 e RATINGS de 4,5 , contra 6,1 e 2,4 na baixa. Hipóteses: chamados críticos são atendidos por técnicos mais seniores , com mais atenção e comunicação? efeito alívio : resolver um problema grave gera gratidão? chamados de baixa criticidade são tratados com descaso (fila longa, respostas-padrão)? Como validar: cruzar com o nível do técnico (N1, N2, N3), o número de interações e as atualizações ao colaborador por chamado. Ação: levar para os chamados simples as práticas de comunicação dos críticos. A baixa criticidade é 52% do volume , então é aí que está o maior ganho de satisfação. H5: O telefone é o canal de maior esforço (CES × Telefone +0,65; CES × Chat −0,48) Leitura: CES médio de 3,75 no telefone , contra 2,55 no portal e 2,24 no chat. O telefone também tem o pior e_NPS (5,9) e o pior RATINGS (2,4) . Hipótese: o telefone exige mais esforço (espera na URA, transferências, repetir o problema)? Cuidado: é o canal ou é a idade? A idade também se correlaciona com o CES (+0,50). Controlando pela faixa etária, o telefone continua pior: CES de 3,7 a 3,9 no telefone contra 2,2 a 2,6 no chat e no portal, em qualquer idade . O problema está no canal, não no colaborador. Como validar: medir o tempo de espera, as transferências e a taxa de resolução no primeiro contato (FCR) do telefone. Ação: redesenhar a jornada telefônica (URA, callback, FCR) e oferecer o chat como alternativa assistida , com o custo de produtividade em mente: cada hora de chamado aberto é uma hora de colaborador parado. H6: A idade define o canal (Idade × Telefone +0,74; Idade × Chat −0,62) Leitura: a idade média é de 51 anos no telefone , 37 no portal e 31 no chat. 83% dos colaboradors com 46 anos ou mais usam o telefone , e 78% dos que têm até 30 usam o chat. Hipótese: os colaboradores mais velhos preferem ou dependem do telefone , e por isso sofrem mais com o canal de maior esforço (H5)? Idade × CES (+0,50) provavelmente é espúria. A idade não aumenta o esforço por si. Ela leva ao telefone , que é o canal de maior esforço (veja o controle na H5). Risco: viés de seleção nas pesquisas por canal, porque cada canal atende um público diferente. Ação: melhorar o telefone é prioridade de inclusão . Não force a migração digital. Crie opções assistidas (callback, atendimento humano direto). H7: Esforço destrói a satisfação (CES × RATINGS −0,54; CES × e_NPS −0,48) Leitura: quanto maior o esforço do colaborador, pior a nota e a recomendação. Hipótese: o esforço é um fator de insatisfação independente da criticidade (CES × Criticidade = 0,01)? Ação: adotar o CES como KPI prioritário e atacar os pontos de fricção (formulários, transferências, repetições). 4. Resumo executivo para a Diretoria de Suporte de TI Reduzir o tempo de resolução aumenta a satisfação em todos os níveis de criticidade (H3). A correlação geral positiva é enganosa: é um Paradoxo de Simpson causado pela criticidade. O telefone é o canal problemático (H5). Tem o maior esforço e a menor satisfação, independentemente da idade , e concentra o público de 46 anos ou mais (H6). Os chamados críticos demoram cerca de 10 vezes mais que os de baixa criticidade (H2). É preciso verificar se há descumprimento de SLA. Os chamados simples são o maior potencial de ganho (H4): são 52% do volume e têm a pior satisfação. Qualidade de dados: 5 registros com idade 0. Recomenda-se validar o cadastro na origem. ⚠️ Correlação não é causalidade. Todas as hipóteses devem ser validadas com o dono do processo ( business owner ) e, quando possível, com testes controlados (A/B, pilotos). ", "formato": ".md"}, {"titulo": "Caderno_Hipoteses_Grupo", "disciplina": "02", "grupo": "AI Core Concepts", "markdown": "biblioteca/02/caderno-hipoteses-grupo-cf5257db/conteudo.md", "html": "biblioteca/leitura/biblioteca/02/caderno-hipoteses-grupo-cf5257db/conteudo.html", "texto": " Sumário do documento 00 · Identificação do grupo 01 · Hipóteses ANTES dos dados (10 min · 🚫 SEM IA) 💬 Discussão do grupo, Etapa 1 02 · Matriz de correlação e leituras (15 min · IA liberada) 2.1 Antes da matriz, olhem os dados 💬 Discussão do grupo: o que chamou atenção nos dados? 2.2 Preparação: transformar texto em números 2.3 Matriz de correlação (Pearson): esta é a imagem para o template 2.4 Correlações maiores que 0,4 ou menores que −0,4 💬 Discussão do grupo: colunas fora da matriz 03 · Auditoria da IA (10 min) 🔍 Auditoria 1: &quot;Chamados que demoram mais deixam o colaborador mais satisfeito&quot; (Tempo × RATINGS = +0,42)? 🔍 Auditoria 2: &quot;A idade aumenta o esforço (CES)&quot; (Age × CES = +0,50)? 🔍 Auditoria 3: criticidade, tempo e satisfação 🔍 Auditoria 4: Pearson × Spearman (CES, RATINGS e e_NPS são escalas de 1 a 5, ordinais) 💬 Discussão do grupo, Etapa 3 04 · Caderno de hipóteses final 💬 Discussão do grupo, Etapa 4 05 · Recomendação ao Diretor de Suporte 💬 Discussão do grupo, Etapa 5 📊 Anexo: todos os gráficos de dispersão dos pares relevantes Caderno_Hipoteses_Grupo Índice da biblioteca Fonte: Aulas/AI-Core-Concepts/04_Hands_On_Correlacao/notebooks/Caderno_Hipoteses_Grupo.ipynb SHA-256: cf5257db4adb8199221aaceb6c4e5c062a7a50b152ef6aa3a6d84a9aeb25da10 Células e saídas textuais já gravadas. O notebook não foi executado na conversão. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem com os titulares indicados na fonte. 📓 Caderno de Hipóteses: Suporte de TI (Hands On, Correlação Estatística) AI Core Concepts, Aula 1 · Profª Tassiana Rugoni de Campos · FIAP MBA Base: metrica_cx_corr_v2.csv , pesquisa interna de satisfação dos colaboradores atendidos pelo Suporte de TI. Como usar: sigam as etapas na ordem (igual ao template). Rodem as células de código uma a uma ( Shift+Enter ) e registrem as conclusões do grupo nas células 💬 Discussão do grupo (clique duas vezes para editar). Hipótese que cai não é erro: faz parte do processo. Dicionário de dados | Campo | Descrição | |---|---| | Id | Identificador único da resposta | | Age | Idade do colaborador atendido | | Canal | Chat, Telefone ou Portal | | Criticidade | Baixa, Media, Alta | | Tempo_Resolucao_h | Horas entre a abertura e a resolução do chamado | | Status_Chamado | Situação do chamado | | e_NPS | Disposição em recomendar o suporte (0 a 10) | | CES | Esforço para resolver o problema (1 = muito fácil, 5 = muito difícil) → maior = pior | | RATINGS | Satisfação com o atendimento (1 = muito insatisfeito, 5 = muito satisfeito) | 00 · Identificação do grupo RM Nome Ferramenta(s) de IA usada(s): Claude (Anthropic) + Python (pandas/seaborn) 01 · Hipóteses ANTES dos dados (10 min · 🚫 SEM IA) ⚠️ Não rodem nenhuma célula abaixo antes de preencher esta etapa. Usem só o dicionário de dados e a experiência de vocês como gestores. Na Etapa 4 vocês vão confrontar isso com os dados. Perguntas para provocar a discussão: Chamados que demoram mais deixam o colaborador mais ou menos satisfeito? Existe um canal (Chat, Telefone, Portal) que vocês esperam ser melhor ou pior? Por quê? A idade do colaborador deve influenciar o quê: canal, esforço, satisfação? Chamados críticos devem ser mais bem ou mais mal avaliados? NPS, CES e RATINGS devem andar juntos? 💬 Discussão do grupo, Etapa 1 # O que esperamos encontrar Por que acreditamos nisso 1 2 3 02 · Matriz de correlação e leituras (15 min · IA liberada) 2.1 Antes da matriz, olhem os dados import numpy as np, pandas as pd, matplotlib.pyplot as plt, seaborn as sns % matplotlib inline sns.set_theme(style = 'whitegrid' ) pd.set_option( 'display.precision' , 2 ) df = pd.read_csv( '../dados/metrica_cx_corr_v2.csv' ) print (df.shape) df.head() # Estatística descritiva: mínimo, máximo, média, mediana (50%) e desvio padrão df.describe(include = 'all' ).T # O que chama atenção? print ( 'Valores faltantes:' , df.isna(). sum (). sum ()) print ( 'Status_Chamado:' , df.Status_Chamado.value_counts().to_dict(), '→ não varia!' ) print ( 'Idades suspeitas (Age = 0):' , df.loc[df.Age == 0 , 'Id' ].tolist()) print ( ' \\n Criticidade:' , df.Criticidade.value_counts().to_dict()) print ( 'Canal:' , df.Canal.value_counts().to_dict()) fig, ax = plt.subplots( 1 , 3 , figsize = ( 14 , 3.5 )) sns.histplot(df.Age, bins = 20 , ax = ax[ 0 ]).set_title( 'Idade (atenção aos zeros)' ) sns.histplot(df.Tempo_Resolucao_h, bins = 30 , ax = ax[ 1 ]).set_title( 'Tempo de resolução (cauda longa)' ) sns.countplot(data = df, x = 'e_NPS' , ax = ax[ 2 ]).set_title( 'e_NPS' ) plt.tight_layout() ; plt.show() 💬 Discussão do grupo: o que chamou atenção nos dados? Status_Chamado é sempre \"Resolvido\". O que isso significa para a pesquisa? (Quem não teve o chamado resolvido não foi ouvido: viés de seleção.) 5 idades = 0 : erro de cadastro? Como tratar? Tempo : média ≈ 15,9 h × mediana ≈ 7,7 h. O que uma cauda longa indica? Anotações do grupo: 2.2 Preparação: transformar texto em números Id (identificador) e Status_Chamado (constante) saem da matriz. Criticidade → escala ordinal 1 (Baixa), 2 (Média), 3 (Alta). Canal → 3 colunas 0/1 ( one-hot ). Age = 0 → tratado como ausente. d = df.copy() d.loc[d.Age == 0 , 'Age' ] = np.nan num = pd.DataFrame({ 'Idade' : d.Age, 'Criticidade' : d.Criticidade. map ({ 'Baixa' : 1 , 'Media' : 2 , 'Alta' : 3 }), 'Tempo_Resolucao_h' : d.Tempo_Resolucao_h, 'e_NPS' : d.e_NPS, 'CES' : d.CES, 'RATINGS' : d.RATINGS, 'Canal_Chat' : (d.Canal == 'Chat' ).astype( int ), 'Canal_Portal' : (d.Canal == 'Portal' ).astype( int ), 'Canal_Telefone' : (d.Canal == 'Telefone' ).astype( int ), }) num.head() 2.3 Matriz de correlação (Pearson): esta é a imagem para o template corr = num.corr(method = 'pearson' ) plt.figure(figsize = ( 10 , 8 )) sns.heatmap(corr, mask = np.triu(np.ones_like(corr, bool ), 1 ), annot = True , fmt = '.2f' , cmap = 'RdBu_r' , vmin =- 1 , vmax = 1 , square = True , cbar_kws = { 'label' : 'r de Pearson' }) plt.title( 'Matriz de correlação: Suporte de TI (n = 420)' ) plt.tight_layout() ; plt.savefig( '../entrega/graficos/01_heatmap.png' , dpi = 150 ) ; plt.show() 2.4 Correlações maiores que 0,4 ou menores que −0,4 Na coluna Leitura do template, escrevam só o que o número diz , sem explicar o porquê (ex.: \"quando X sobe, Y tende a cair\" ). LIMIAR = 0.4 canais = { 'Canal_Chat' , 'Canal_Portal' , 'Canal_Telefone' } pares = [] cols = list (corr.columns) for i, a in enumerate (cols): for b in cols[i + 1 :]: r = corr.loc[a, b] if abs (r) &gt; LIMIAR and not ({a, b} &lt;= canais): # ignora Canal × Canal (artefato do one-hot) pares.append((a, b, round (r, 2 ), 'positiva' if r &gt; 0 else 'negativa' )) rel = pd.DataFrame(pares, columns = [ 'Variável 1' , 'Variável 2' , 'r' , 'Sentido' ]).sort_values( 'r' , key = abs , ascending = False ) rel.reset_index(drop = True ) 💬 Discussão do grupo: colunas fora da matriz Quais colunas ficaram de fora e o que elas poderiam explicar ? Que variáveis não existem na base e fariam falta? (técnico, nível N1/N2/N3, SLA, transferências, reaberturas…) Por que ignoramos Canal × Canal (ex.: Chat × Telefone = −0,58)? Anotações do grupo: 03 · Auditoria da IA (10 min) Peçam à IA que interprete a matriz e sugira hipóteses. Depois, auditem cada afirmação como se viesse de um analista júnior da squad . Prompt sugerido: \"Você é um analista de dados. Aplique correlação estatística (Pearson) na base metrica_cx_corr_v2.csv (pesquisa interna de satisfação do Suporte de TI). Liste as correlações maiores que 0,4 ou menores que -0,4, interprete a matriz e sugira hipóteses para o diretor de Suporte.\" Classificação: Constatação (descreve o número) · Hipótese (explicação a testar) · Causal indevida (afirma causa sem evidência). As células abaixo ajudam a auditar as afirmações da IA com os dados. 🔍 Auditoria 1: \"Chamados que demoram mais deixam o colaborador mais satisfeito\" (Tempo × RATINGS = +0,42)? ordem = [ 'Baixa' , 'Media' , 'Alta' ] ; cores = dict ( zip (ordem, [ '#4C9F70' , '#E0A030' , '#C0392B' ])) fig, ax = plt.subplots( 1 , 2 , figsize = ( 14 , 5 )) sns.regplot(data = d, x = 'Tempo_Resolucao_h' , y = 'RATINGS' , ax = ax[ 0 ], scatter_kws = { 'alpha' : .35 }, line_kws = { 'color' : 'black' }) ax[ 0 ].set_title( f'Visão geral: r = { d . Tempo_Resolucao_h . corr(d.RATINGS) :+.2f} ' ) for k in ordem: g = d[d.Criticidade == k] sns.regplot(data = g, x = 'Tempo_Resolucao_h' , y = 'RATINGS' , ax = ax[ 1 ], color = cores[k], scatter_kws = { 'alpha' : .35 }, label = f' { k } : r = { g . Tempo_Resolucao_h . corr(g.RATINGS) :+.2f} ' ) ax[ 1 ].set_title( 'Separando por criticidade' ) ; ax[ 1 ].legend() plt.suptitle( 'Paradoxo de Simpson? A criticidade é variável omitida?' , fontweight = 'bold' ) plt.tight_layout() ; plt.savefig( '../entrega/graficos/02_simpson.png' , dpi = 150 ) ; plt.show() pd.DataFrame({k: { 'n' : len (g), 'tempo médio (h)' : g.Tempo_Resolucao_h.mean(), 'Tempo × RATINGS' : g.Tempo_Resolucao_h.corr(g.RATINGS), 'Tempo × e_NPS' : g.Tempo_Resolucao_h.corr(g.e_NPS)} for k, g in d.groupby( 'Criticidade' )}).T.loc[ordem] 💡 O que observar: no agregado a relação é positiva . Dentro de cada criticidade ela é negativa . Isso é o Paradoxo de Simpson : é o slide \"Variável Omitida\" (QI × tempo de estudo × nota) na prática. 🔍 Auditoria 2: \"A idade aumenta o esforço (CES)\" (Age × CES = +0,50)? d[ 'Faixa etária' ] = pd.cut(d.Age, [ 0 , 30 , 45 , 70 ], labels = [ 'até 30' , '31–45' , '46+' ]) fig, ax = plt.subplots( 1 , 2 , figsize = ( 14 , 4.5 )) (pd.crosstab(d[ 'Faixa etária' ], d.Canal, normalize = 'index' ) * 100 ).plot(kind = 'bar' , stacked = True , ax = ax[ 0 ], rot = 0 , color = [ '#3A7CA5' , '#81B29A' , '#E07A5F' ]) ; ax[ 0 ].set_title( 'Canal usado por faixa etária (%)' ) d.pivot_table(index = 'Faixa etária' , columns = 'Canal' , values = 'CES' ).plot(kind = 'bar' , ax = ax[ 1 ], rot = 0 , color = [ '#3A7CA5' , '#81B29A' , '#E07A5F' ]) ; ax[ 1 ].set_title( 'CES médio por canal e idade (maior = pior)' ) ; ax[ 1 ].set_ylim( 1 , 5 ) plt.tight_layout() ; plt.savefig( '../entrega/graficos/04_canal_idade_ces.png' , dpi = 150 ) ; plt.show() print (d.groupby( 'Canal' ).Age.mean(). round ( 1 ).rename( 'Idade média por canal' )) 💡 O que observar: dentro do mesmo canal , o CES quase não muda com a idade. A idade leva ao telefone , e o telefone tem mais esforço . Age × CES é uma correlação indireta/espúria . 🔍 Auditoria 3: criticidade, tempo e satisfação m = d.groupby( 'Criticidade' )[[ 'Tempo_Resolucao_h' , 'e_NPS' , 'CES' , 'RATINGS' ]].mean().loc[ordem] fig, ax = plt.subplots( 1 , 3 , figsize = ( 14 , 3.8 )) for a, col in zip (ax, [ 'Tempo_Resolucao_h' , 'e_NPS' , 'RATINGS' ]): a.bar(ordem, m[col], color = [cores[k] for k in ordem]) ; a.set_title(col) for i, v in enumerate (m[col]): a.text(i, v, f' { v :.1f} ' , ha = 'center' , va = 'bottom' ) plt.tight_layout() ; plt.savefig( '../entrega/graficos/03_criticidade.png' , dpi = 150 ) ; plt.show() m 🔍 Auditoria 4: Pearson × Spearman (CES, RATINGS e e_NPS são escalas de 1 a 5, ordinais) comp = rel[[ 'Variável 1' , 'Variável 2' , 'r' ]].copy() sp = num.corr(method = 'spearman' ) comp[ 'Spearman' ] = [ round (sp.loc[a, b], 2 ) for a, b in zip (comp[ 'Variável 1' ], comp[ 'Variável 2' ])] comp[ 'Mantém |r|&gt;0,4?' ] = comp.Spearman. abs () &gt; LIMIAR comp.reset_index(drop = True ) 💬 Discussão do grupo, Etapa 3 Afirmação da IA (resumida) Classificação Concordamos? Por quê? O que a IA deixou de questionar? (idades zeradas? Status constante? Pearson em escala ordinal? variável omitida? SLA?) 04 · Caderno de hipóteses final Confrontem a Etapa 1 com os dados e a auditoria. Na coluna Etapa 1 , indiquem se a hipótese confirma , contradiz ou é nova . 💬 Discussão do grupo, Etapa 4 # Hipótese Correlação que sustenta Etapa 1: confirma / contradiz / nova Viés ou variável omitida possível Como validaríamos 1 Reduzir o tempo de resolução aumenta a satisfação em todos os níveis de criticidade Tempo × RATINGS por criticidade: −0,49 a −0,57 Criticidade (Paradoxo de Simpson) Piloto de fila expressa × grupo controle 2 O Telefone gera mais esforço e menos satisfação, independentemente da idade CES × Telefone +0,65; CES × RATINGS −0,54 Idade (controlada: efeito persiste) Medir URA, espera, transferências, FCR 3 A idade define o canal, por isso \"parece\" aumentar o esforço Age × Telefone +0,74; Age × CES +0,50 Espúria (controlando o canal, some) CES por idade dentro do mesmo canal 4 Chamados críticos recebem atendimento diferenciado e são mais bem avaliados Criticidade × RATINGS +0,59; × e_NPS +0,53 Nível do técnico (fora da base); efeito alívio Cruzar com N1/N2/N3 e nº de atualizações 5 Chamados críticos demoram além do SLA Criticidade × Tempo +0,89 Complexidade; dependência de terceiros Comparar com o SLA por criticidade 6 RATINGS e e_NPS medem a mesma percepção e_NPS × RATINGS +0,89 Mesma pessoa, mesmo momento Pesquisa enxuta em piloto Hipóteses que derrubamos e por quê: (ex.: \"demorar deixa mais satisfeito\"; \"a idade aumenta o esforço\") Das expectativas da Etapa 1, alguma resistimos a abandonar mesmo com os dados contra? (viés de confirmação!) 05 · Recomendação ao Diretor de Suporte Escolham a hipótese mais forte e escrevam para quem vai decidir. Uma ou duas frases por item. 💬 Discussão do grupo, Etapa 5 Decisão que recomendamos: Evidência que temos (e o que ela não prova): Experimento para testar se há causa: Custo de errar (se agirmos e for falsa / se não agirmos e for verdadeira): 📄 Proposta já preenchida em ../entrega/Caderno_de_Hipoteses_CX_preenchido.docx . Usem como ponto de partida e ajustem conforme a discussão. 📊 Anexo: todos os gráficos de dispersão dos pares relevantes for _, p in rel.iterrows(): plt.figure(figsize = ( 6 , 4 )) sns.regplot(data = num, x = p[ 'Variável 1' ], y = p[ 'Variável 2' ], x_jitter = .15 , y_jitter = .15 , scatter_kws = { 'alpha' : .3 }) plt.title( f\" { p[ 'Variável 1' ] } × { p[ 'Variável 2' ] } (r = { p . r :+.2f} )\" ) plt.show() ", "formato": ".ipynb"}, {"titulo": "Captura_tabulado", "disciplina": "02", "grupo": "AI Core Concepts", "markdown": "biblioteca/02/captura-tabulado-d58cef47/conteudo.md", "html": "biblioteca/leitura/biblioteca/02/captura-tabulado-d58cef47/conteudo.html", "texto": " Sumário do documento Captura (2) Captura Estatística Descritiva Captura_tabulado Índice da biblioteca Fonte: Aulas/AI-Core-Concepts/04_Hands_On_Correlacao/dados/Captura_tabulado.xlsx SHA-256: d58cef47e334a3ebf7e3b060b152b9858a548f11ee2f0e8811c70a0c03a99408 Células e fórmulas exportadas por planilha. Não executa fórmulas; gráficos e formatação não são reproduzidos. Material do acervo acadêmico fornecido pelo usuário. Autoria e direitos permanecem c f a &gt;= .9 else 'forte' if a &gt;= .7 else 'moderada' if a &gt;= .5 else 'moderada-fraca' if a &gt;= .4 else 'fraca' if a &gt;= .2 else 'desprezível' def explorar(x, y, por = None , dados = None ): \"\"\"Ferramenta de investigação: mostra a correlação x × y no geral e, opcionalmente, DENTRO de cada grupo `por`. Ex.: explorar('Tempo_Resolucao_h', 'RATINGS', por='Criticidade')\"\"\" d0 = dados if dados is not None else d r = d0[x].corr(d0[y]) ncols = 2 if por else 1 fig, ax = plt.subplots( 1 , ncols, figsize = ( 6.5 * ncols, 4.3 ), squeeze = False ) sns.regplot(data = d0, x = x, y = y, ax = ax[ 0 , 0 ], x_jitter = .15 , y_jitter = .15 , scatter_kws = { 'alpha' : .3 }, line_kws = { 'color' : 'black' }) ax[ 0 , 0 ].set_title( f'Geral: r = { r :+.2f} ( { forca(r) } )' ) linhas = [( 'Geral' , len (d0), r)] if por: grupos = [g for g in (ORDEM_CRIT if por == 'Criticidade' else sorted (d0[por].dropna().unique()))] for g in grupos: sub = d0[d0[por] == g] rg = sub[x].corr(sub[y]) ; linhas.append(( f' { por } = { g } ' , len (sub), rg)) cor = CORES_CRIT.get(g) or CORES_CANAL.get(g) sns.regplot(data = sub, x = x, y = y, ax = ax[ 0 , 1 ], color = cor, x_jitter = .15 , y_jitter = .15 , scatter_kws = { 'alpha' : .3 }, label = f' { g } : r = { rg :+.2f} ' ) ax[ 0 , 1 ].legend() ; ax[ 0 , 1 ].set_title( f'Dentro de cada { por } ' ) plt.tight_layout() ; plt.show() display(pd.DataFrame(linhas, columns = [ 'Recorte' , 'n' , 'r' ]).set_index( 'Recorte' )) d = pd.read_csv( '../dados/metrica_cx_corr_v2.csv' ) print ( '✅ Base carregada:' , d.shape[ 0 ], 'linhas ×' , d.shape[ 1 ], 'colunas' ) Python em uso: /Users/antoniosergiorfigueiredo/AulasMBA/.venv/bin/python ✅ Base carregada: 420 linhas × 9 colunas 00 · Identificação do grupo 📋 RM, nome e ferramentas de IA usadas. (No portal, os RMs vão separados por vírgula no campo do upload.) RM Nome Ferramenta(s) de IA usada(s): 01 · Hipóteses ANTES dos dados (10 min · 🚫 SEM IA) 📋 \"Sem abrir a base, apenas pelo dicionário de dados: o que a experiência de vocês como gestores diz que vai aparecer? Registrem agora; vocês vão confrontar isso com os dados na Etapa 4.\" ⚠️ Regra da professora: nada de IA nesta etapa, e não rode as células de análise antes de responder . Não há insight nem referência aqui de propósito: o valor está em registrar o seu feeling para depois ver quais \"dogmas caem\". Dicionário de dados | Campo | Descrição | |---|---| | Id | Identificador único da resposta | | Age | Idade do colaborador atendido | | Canal | Chat, Telefone ou Portal | | Criticidade | Baixa, Media, Alta | | Tempo_Resolucao_h | Horas entre a abertura e a resolução do chamado | | Status_Chamado | Situação do chamado | | e_NPS | Disposição em recomendar o suporte (0 a 10) | | CES | Esforço para resolver o problema (1 = muito fácil, 5 = muito difícil) | | RATINGS | Satisfação com o atendimento (1 = muito insatisfeito, 5 = muito satisfeito) | Perguntas que ajudam a pensar: Demorar mais deixa o colaborador mais ou menos satisfeito? Qual canal deve ser o melhor ou o pior? A idade influencia o quê? Chamados críticos são mais bem ou mais mal avaliados? NPS, CES e RATINGS andam juntos? ✍️ Sua resposta, Etapa 1 # O que esperamos encontrar Por que acreditamos nisso 1 2 3 02 · Matriz de correlação e leituras (15 min · IA liberada) 2.1 📋 \"Antes da matriz, olhem os dados. Mínimo, máximo, valores estranhos, colunas que não variam. O que chamou atenção?\" ▶️ Rode a estatística descritiva, o primeiro passo que a professora recomendou ( \"aplique estatística descritiva\" ). d.describe(include = 'all' ).T count unique top freq mean std min 25% \\ Id 420.0 NaN NaN NaN 210.5 121.39 1.0 105.75 Age 420.0 NaN NaN NaN 38.89 12.2 0.0 30.0 Canal 420 3 Chat 167 NaN NaN NaN NaN Criticidade 420 3 Baixa 218 NaN NaN NaN NaN Tempo_Resolucao_h 420.0 NaN NaN NaN 15.92 17.4 1.1 4.5 Status_Chamado 420 1 Resolvido 420 NaN NaN NaN NaN e_NPS 420.0 NaN NaN NaN 7.21 2.52 0.0 5.75 CES 420.0 NaN NaN NaN 2.83 1.02 1.0 2.0 RATINGS 420.0 NaN NaN NaN 3.12 1.33 1.0 2
