<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do SpeakUp Lovable</title><desc id="desc">Frontend React no navegador conectado ao Supabase Auth, Edge Function student-login e API RPC, com regras no PostgreSQL. Modo demo usa localStorage.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto-start-reverse"><path d="M0,0 L0,6 L9,3 z" fill="#1877cc"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18334f}.title{font-size:32px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.num{font-size:20px;font-weight:700;fill:white}.line{fill:none;stroke:#1877cc;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.box{stroke-width:1.5;rx:15}</style></defs>
<rect width="1600" height="1040" fill="#f4f8fd"/>
<text x="50" y="55" class="title">SpeakUp Lovable · Arquitetura da aplicação</text>
<text x="50" y="87" class="body">Componentes identificados no código · visão lógica · implantação remota não verificada</text>
<rect x="25" y="120" width="465" height="650" rx="22" fill="#eaf3ff" stroke="#b4d3f0"/>
<rect x="535" y="120" width="505" height="650" rx="22" fill="#eef9f3" stroke="#b3dcc8"/>
<rect x="1085" y="120" width="490" height="650" rx="22" fill="#f5efff" stroke="#d7bff2"/>
<text x="50" y="155" class="head">CLIENTE / FRONTEND</text><text x="560" y="155" class="head">BACKEND · SUPABASE</text><text x="1110" y="155" class="head">BANCO · POSTGRESQL</text>
<rect x="50" y="180" width="415" height="100" class="box" fill="white" stroke="#99bfe6"/><circle cx="77" cy="207" r="16" fill="#147adb"/><text x="72" y="214" class="num">1</text><text x="104" y="213" class="head">Usuários no navegador</text><text x="70" y="245" class="body">Aluno · Professor · Coordenação · RH</text><text x="70" y="269" class="small">Login, agenda, reservas, presença e indicadores</text>
<path d="M250 280 V305" class="line"/>
<rect x="50" y="305" width="415" height="195" class="box" fill="white" stroke="#99bfe6"/><circle cx="77" cy="333" r="16" fill="#147adb"/><text x="72" y="340" class="num">2</text><text x="104" y="340" class="head">React 19 + Vite 7</text><text x="70" y="372" class="body">main.jsx · telas · estado · modal</text><text x="70" y="401" class="body">Domínio: importação, agenda e relatórios</text><text x="70" y="430" class="body">Importação CSV / XLSX no navegador</text><text x="70" y="459" class="small">read-excel-file · validação e prévia do lote</text><text x="70" y="485" class="small">Desenvolvimento: 127.0.0.1:5173 (padrão)</text>
<path d="M250 500 V525" class="line"/>
<rect x="50" y="525" width="415" height="120" class="box" fill="#dcecff" stroke="#99bfe6"/><circle cx="77" cy="553" r="16" fill="#147adb"/><text x="72" y="560" class="num">3</text><text x="104" y="560" class="head">Integração / SDK Supabase</text><text x="70" y="592" class="body">src/backend.js</text><text x="70" y="620" class="small">URL + chave pública · sessão do usuário</text>
<text x="65" y="684" class="body">HTTPS · autenticação / funções / RPC</text><text x="65" y="715" class="small">Resposta: dados JSON → atualização do estado</text><text x="65" y="742" class="small">Nenhum servidor Node/Express próprio no projeto</text>
<rect x="560" y="180" width="455" height="130" class="box" fill="white" stroke="#8ac4a8"/><circle cx="587" cy="207" r="16" fill="#10a073"/><text x="582" y="214" class="num">4</text><text x="614" y="213" class="head">Edge Function · Deno</text><text x="580" y="246" class="body">student-login · matrícula + senha</text><text x="580" y="273" class="small">Matrícula → SHA-256 → e-mail técnico</text><text x="580" y="297" class="small">Valida origem e perfil student; retorna sessão</text>
<path d="M790 310 V340" class="line"/>
<rect x="560" y="340" width="455" height="125" class="box" fill="white" stroke="#8ac4a8"/><circle cx="587" cy="367" r="16" fill="#10a073"/><text x="582" y="374" class="num">5</text><text x="614" y="373" class="head">Supabase Auth</text><text x="580" y="405" class="body">E-mail + senha para os demais perfis</text><text x="580" y="433" class="small">Sessão: access_token + refresh_token</text><text x="580" y="456" class="small">Identidade do usuário disponível via auth.uid()</text>
<rect x="560" y="525" width="455" height="155" class="box" fill="white" stroke="#8ac4a8"/><circle cx="587" cy="553" r="16" fill="#10a073"/><text x="582" y="560" class="num">6</text><text x="614" y="560" class="head">API de dados / RPC</text><text x="580" y="594" class="body">Cliente chama funções SQL pelo SDK</text><text x="580" y="623" class="body">Leitura do perfil: profiles por user_id</text><text x="580" y="653" class="small">Mutações → recarrega workspace_data()</text>
<path d="M465 552 H510 V245 H560" class="line"/><path d="M510 402 H560" class="line"/><path d="M465 602 H560" class="line"/>
<path d="M1015 601 H1110" class="line"/><text x="1037" y="586" class="small">RPC</text>
<rect x="1110" y="180" width="440" height="230" class="box" fill="white" stroke="#c8a5e5"/><circle cx="1137" cy="207" r="16" fill="#9052ce"/><text x="1132" y="214" class="num">7</text><text x="1164" y="213" class="head">Tabelas e relacionamentos</text><text x="1130" y="247" class="body">tb_aluno · teachers · companies</text><text x="1130" y="279" class="body">student_companies · vínculo corporativo</text><text x="1130" y="311" class="small">profiles → auth.users / aluno / professor / empresa</text><text x="1130" y="343" class="body">slots → teachers</text><text x="1130" y="375" class="body">bookings → tb_aluno + slots</text><text x="1130" y="399" class="small">audit_events → ator em auth.users</text>
<path d="M1330 525 V410" class="line"/>
<rect x="1110" y="525" width="440" height="220" class="box" fill="white" stroke="#c8a5e5"/><circle cx="1137" cy="553" r="16" fill="#9052ce"/><text x="1132" y="560" class="num">8</text><text x="1164" y="560" class="head">Regras de negócio no banco</text><text x="1130" y="592" class="body">workspace_data · create_slot · book_class</text><text x="1130" y="622" class="body">cancel_booking · mark_attendance</text><text x="1130" y="652" class="body">import_students · current_role · log_action</text><text x="1130" y="684" class="small">SECURITY DEFINER + autorização explícita</text><text x="1130" y="710" class="small">RLS / grants · constraints · auditoria</text><text x="1130" y="734" class="small">RH: ocupação total da turma nesta versão</text>
<rect x="25" y="795" width="1550" height="120" rx="18" fill="#fff5df" stroke="#e4c373"/><text x="50" y="829" class="head">MODO DEMO · sem URL e chave Supabase</text><text x="50" y="861" class="body">React → mutate / structuredClone / save → dados fictícios + localStorage (speakup-demo-v1) → interface</text><text x="50" y="891" class="small">Fluxo local alternativo. Backend ativo somente com URL e chave; uma variável ausente também seleciona demo.</text>
<text x="50" y="956" class="small">Fontes: src/main.jsx · src/backend.js · src/domain.mjs · supabase/functions/student-login · supabase/migrations · README.md</text><text x="50" y="985" class="small">Uma migração SQL versionada. Destino proposto: Lovable + Supabase próprio; implantação remota não verificada.</text><text x="50" y="1013" class="small">Visão inspirada na referência fornecida; hospedagem, DNS, balanceador e serviços externos não comprovados não foram acrescentados.</text>
</svg>


