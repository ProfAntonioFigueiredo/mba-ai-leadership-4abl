name: Validate MBA 4ABL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate_repo.py
  speakup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: disciplinas/21-vibe-coding-executivo/projetos/speakup/speakup-sdd/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/compare.py
